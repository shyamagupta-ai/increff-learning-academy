<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Increff Learning Academy · TGA</title>
<style>
:root{--navy:#152C53;--navy2:#1E3B6B;--coral:#EB5C5E;--muted:#5B6270;--line:#E5E7EB;--panel:#F6F8FB;--green:#1F8A5B;--red:#C8393B;--bg:#EEF2F8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--navy);background:var(--bg);line-height:1.5;font-size:16px}
a{color:var(--coral)}
button{font-family:inherit}
.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20}
.top .in{max-width:1120px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px}
.logo{display:inline-flex;background:#fff;border-radius:8px;padding:4px 8px}
.logo svg{height:28px;width:auto}
.brand{font-weight:800;font-size:17px;letter-spacing:.2px}
.brand small{display:block;font-weight:600;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#F7A9AA}
.sp{flex:1}
.tb{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;cursor:pointer}
.tb:hover{background:rgba(255,255,255,.2)}
.wrap{max-width:1120px;margin:0 auto;padding:28px 20px 80px}
.hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;border-radius:20px;padding:36px 40px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-120px;top:-140px;width:420px;height:420px;border-radius:50%;border:34px solid rgba(235,92,94,.2);pointer-events:none}
.hero h1{font-size:34px;line-height:1.15;font-weight:800;max-width:640px}
.hero p{color:#C9D3E6;max-width:640px;margin-top:10px;font-size:17px}
.hero .row{display:flex;gap:16px;margin-top:22px;flex-wrap:wrap;align-items:center;position:relative;z-index:1}
.hero input{border:none;border-radius:10px;padding:11px 14px;font-size:15px;min-width:240px}
.bar{height:10px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden;width:260px}
.bar i{display:block;height:100%;background:var(--coral);border-radius:99px;transition:width .4s}
.prog-l{font-size:14px;color:#C9D3E6}
.how{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0 8px}
.how div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:14px;color:var(--muted)}
.how b{display:block;color:var(--navy);font-size:15px;margin-bottom:2px}
.part{margin-top:30px}
.part-h{display:flex;align-items:baseline;gap:12px;margin-bottom:4px}
.part-h .pl{font-size:13px;font-weight:800;letter-spacing:2px;color:var(--coral);text-transform:uppercase}
.part-h h2{font-size:24px;font-weight:800}
.part-b{color:var(--muted);margin-bottom:12px;font-size:15px}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.mod{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:6px;min-height:150px;text-align:left;font-size:inherit;color:inherit}
.mod:hover{border-color:var(--coral);transform:translateY(-2px);box-shadow:0 6px 18px rgba(21,44,83,.08)}
.mod .id{font-size:12px;font-weight:800;color:var(--coral);letter-spacing:1px}
.mod h3{font-size:17px;line-height:1.25}
.mod p{font-size:13.5px;color:var(--muted)}
.mod .st{margin-top:auto;font-size:12.5px;font-weight:700;display:flex;justify-content:space-between}
.mod.locked{opacity:.55;cursor:not-allowed}
.mod.locked:hover{transform:none;border-color:var(--line);box-shadow:none}
.mod.done{border-color:#BFE3D0;background:#F7FCF9}
.pill{display:inline-block;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:99px;letter-spacing:.4px;text-transform:uppercase}
.p-g{background:#E3F4EC;color:var(--green)}.p-n{background:#EEF0F4;color:var(--muted)}.p-c{background:#FDE7E7;color:var(--red)}.p-b{background:#E4EDFB;color:#2F6FD6}
.soon{background:#fff;border:1.5px dashed #C7CFDC;border-radius:16px;padding:18px;color:var(--muted);font-size:14px}
.int{display:inline-block;background:var(--navy);color:#fff;font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;border-radius:6px;padding:2px 7px;margin-right:6px;vertical-align:1px}
/* lesson */
.lhead{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.back{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600;color:var(--navy)}
.lhead .t{font-weight:800;font-size:20px}
.lhead .t small{display:block;font-size:12px;letter-spacing:1.5px;color:var(--coral);text-transform:uppercase}
.steps-bar{display:flex;gap:5px;margin-bottom:18px}
.steps-bar span{flex:1;height:6px;border-radius:99px;background:#D6DDE8;cursor:pointer}
.steps-bar span.on{background:var(--coral)}.steps-bar span.seen{background:var(--navy)}
.card{background:#fff;border-radius:20px;border:1px solid var(--line);padding:34px 38px;min-height:420px;animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card h2{font-size:28px;line-height:1.2;font-weight:800;margin-bottom:6px}
.card .sub{color:var(--muted);margin-bottom:18px}
.card > .blk{margin-top:16px}
.card p.tx{font-size:17px}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.btn{background:var(--navy);color:#fff;border:none;border-radius:12px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
.btn:hover{background:var(--navy2)}
.btn.c{background:var(--coral)}.btn.c:hover{background:#D84B4D}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.grid div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;font-size:15px}
.grid b{display:block;font-size:16px;margin-bottom:4px}
.tip{background:#FFF6EC;border-left:4px solid var(--coral);border-radius:10px;padding:12px 16px;font-size:15px}
.reveal{border:1.5px solid var(--navy);border-radius:14px;overflow:hidden}
.reveal .q{padding:14px 18px;font-weight:600;font-size:16px;display:flex;gap:14px;align-items:flex-start;justify-content:space-between}
.reveal .q:before{content:"?";flex:none;width:26px;height:26px;border-radius:50%;background:var(--coral);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px}
.reveal .q span{flex:1}
.reveal button{flex:none;background:var(--navy);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-weight:700;cursor:pointer;font-size:13px}
.reveal .a{display:none;background:#F1F6FE;padding:14px 18px 14px 58px;border-top:1px solid var(--line);font-size:15.5px}
.reveal.open .a{display:block}
.flow{display:flex;gap:6px;flex-wrap:wrap}
.flow button{flex:1;min-width:110px;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:12px 8px;font-weight:700;font-size:14px;cursor:pointer;color:var(--navy);position:relative}
.flow button small{display:block;font-size:11px;color:var(--coral);font-weight:800}
.flow button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.flow-d{margin-top:12px;background:var(--panel);border-radius:14px;padding:16px 18px;min-height:96px;font-size:15.5px}
.flow-d .fit{margin-top:8px;padding-top:8px;border-top:1px dashed #CBD3E0;color:var(--navy)}
.flow-d .fit b{color:var(--coral)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:600;cursor:pointer;font-size:14px;color:var(--navy)}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tabd{background:var(--panel);border-radius:14px;padding:6px 18px}
.tabd div{padding:10px 0;border-bottom:1px solid var(--line);font-size:15.5px;display:grid;grid-template-columns:190px 1fr;gap:12px}
.tabd div:last-child{border:none}
.tabd b{color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:1px;padding-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:6px 13px;font-size:14px;font-weight:600}
.flips{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.flip{perspective:900px;height:178px;cursor:pointer}
.flip .fi{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .fi{transform:rotateY(180deg)}
.flip .fr,.flip .bk{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:16px;display:flex;flex-direction:column;justify-content:center}
.flip .fr{background:var(--navy);color:#fff;text-align:center;align-items:center;font-weight:800;font-size:19px}
.flip .fr small{font-size:11px;font-weight:600;color:#F7A9AA;letter-spacing:1px;margin-top:8px;text-transform:uppercase}
.flip .bk{background:#fff;border:1.5px solid var(--navy);transform:rotateY(180deg);font-size:13.5px;justify-content:flex-start;overflow:auto}
.flip .bk .qq{margin-top:8px;color:var(--coral);font-weight:600;font-size:12.5px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stats div{background:var(--panel);border-radius:14px;padding:14px 16px;border:1px solid var(--line)}
.stats b{display:block;font-size:30px;font-weight:800;color:var(--coral);line-height:1.1}
.stats span{font-size:13.5px;color:var(--muted)}
.quote{background:var(--panel);border-radius:16px;padding:22px 24px;border:1px solid var(--line);min-height:190px}
.quote p{font-size:17px;font-style:italic}
.quote .who{margin-top:12px;font-weight:800}.quote .who span{display:block;font-weight:500;color:var(--muted);font-size:14px}
.qnav{display:flex;gap:8px;align-items:center;margin-top:10px}
.qnav button{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.people div{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;text-align:center}
.people .av{width:62px;height:62px;border-radius:50%;background:var(--navy);color:#fff;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.people b{display:block}.people span{font-size:13.5px;color:var(--muted)}
.stps{counter-reset:s;display:grid;gap:8px}
.stps div{display:flex;gap:14px;align-items:flex-start;background:var(--panel);border-radius:12px;padding:12px 16px;font-size:15px}
.stps div:before{counter-increment:s;content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--coral);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.calc{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.calc label{font-size:12.5px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.calc input{width:120px;border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;font-size:16px;font-weight:700;color:var(--navy)}
.calc .out{font-size:16px;flex:1;min-width:220px;background:#fff;border-radius:10px;padding:10px 14px;border:1px solid var(--line)}
.calc .out b{color:var(--coral);font-size:20px}
/* quiz */
.qz .qi{border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:12px}
.qz .qi .qt{font-weight:700;margin-bottom:10px}
.qz .qi .qt span{color:var(--coral);margin-right:6px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;margin-top:6px;cursor:pointer;font-size:15px;color:var(--navy)}
.opt:hover{border-color:var(--navy)}
.opt.sel{border-color:var(--navy);background:#EEF3FB;font-weight:600}
.opt.ok{border-color:var(--green);background:#E3F4EC}
.opt.bad{border-color:var(--red);background:#FBE3E3}
.why{margin-top:8px;font-size:14px;color:var(--muted);display:none}
.qz.graded .why{display:block}
.res{border-radius:16px;padding:20px 22px;margin-top:16px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.res.pass{background:#E3F4EC}.res.fail{background:#FBE3E3}
.res b{font-size:32px}
/* glossary */
#gl{position:fixed;inset:0;background:rgba(14,30,58,.45);display:none;z-index:50;justify-content:flex-end}
#gl.open{display:flex}
#gl .pn{background:#fff;width:min(460px,100%);height:100%;padding:22px;display:flex;flex-direction:column}
#gl input{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;margin:12px 0}
#gl .ls{overflow:auto;flex:1}
#gl .it{padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
#gl .it b{display:block;font-size:15px}
#gl .it a{font-size:12px;font-weight:700;cursor:pointer}
.x{background:none;border:none;font-size:22px;cursor:pointer;color:var(--navy)}
.rc{width:100%;border-collapse:collapse;font-size:14.5px}
.rc th,.rc td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top}
.rc th{width:200px;color:var(--navy);font-weight:700;background:var(--panel)}
.tw{overflow-x:auto}.tbl th{width:auto;min-width:120px}.tbl tr:first-child th{background:var(--navy);color:#fff}
.bant .bg{display:grid;grid-template-columns:130px repeat(3,1fr);gap:6px}
.bh{text-align:center;font-weight:800;font-size:13px;border-radius:8px;padding:6px}.bh.g{background:#E3F4EC;color:var(--green)}.bh.y{background:#FFF3D6;color:#8A5E00}.bh.r{background:#FBE3E3;color:var(--red)}
.bl{font-weight:800;display:flex;align-items:center}
.bc{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px;cursor:pointer;font-weight:700;color:var(--muted)}
.bc.G.on{background:var(--green);color:#fff;border-color:var(--green)}.bc.Y.on{background:#C98A00;color:#fff;border-color:#C98A00}.bc.R.on{background:var(--red);color:#fff;border-color:var(--red)}
.bo{margin-top:12px;border-radius:12px;padding:12px 16px;font-size:15.5px}.bo.g{background:#E3F4EC}.bo.y{background:#FFF3D6}.bo.r{background:#FBE3E3}.bo.n{background:var(--panel)}
.bex{margin-top:12px;font-size:13px;color:var(--muted)}.bex button{margin:4px 6px 0 0;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer;font-size:13px;font-weight:600;color:var(--navy)}
.bw{margin-top:8px;font-size:14.5px}
.rcq{background:var(--panel);border-radius:10px;padding:10px 14px;margin-top:8px;font-size:14.5px}
.rvb{margin-top:26px;background:#FFF6EC;border:1px solid #F5C9A8;border-radius:14px;padding:14px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:14.5px}
.rvp{margin-top:30px;text-align:center;font-size:14px}
.rvp input{border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;margin-left:8px}
.rvp .btn{padding:8px 14px;font-size:13px}
.lnk{background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px}
.cert{margin-top:16px;border:3px double var(--navy);border-radius:18px;padding:34px;text-align:center;background:linear-gradient(180deg,#fff,#F6F8FB)}
.cert .cl svg{height:40px;width:auto}.ck{margin-top:10px;font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--coral);font-weight:800}
.cn{font-size:34px;font-weight:800;margin:10px 0}.ct{max-width:640px;margin:0 auto;color:var(--muted)}.cd{margin-top:14px;font-weight:700}
.reg{position:relative;z-index:1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px;width:100%}.reg b{width:100%;color:#fff}.reg input{min-width:200px}#rerr{color:#F7A9AA;font-size:13px;width:100%}.consent{color:#C9D3E6;font-size:12px;width:100%}
#rnote .pill{vertical-align:middle;background:#fff;color:var(--navy)}#rnote .lnk{color:#fff}#rnote span{color:#C9D3E6}
.foot{text-align:center;color:#8C95A6;font-size:13px;margin-top:40px}
@media (max-width:760px){.how{grid-template-columns:1fr 1fr}.card{padding:22px 18px}.hero{padding:26px 22px}.hero h1{font-size:26px}.tabd div{grid-template-columns:1fr}}
</style>
</head>

const PARTS=[{"id":"C","title":"Our products","blurb":"AI Planning OS and the Omnichannel Fulfilment System: what each module does, what it doesn’t, and how to answer product questions.","modules":["C1","C2","C3","C4","C5","C6","C7","CX"]},{"id":"D","title":"Industries & proof","blurb":"Industry use cases, the Lulu supermarket model, and choosing the right customer story.","modules":["D1","D2","D3","DX"]},{"id":"X","title":"Final certification","blurb":"One exam across everything. Pass to earn your certificate.","modules":["X1"]}];
const MODULES={"C1":{"title":"The product map","mins":12,"intro":"Two product families: plan the inventory, then run it. Every module, and the pain it answers.","cards":[{"h":"Plan the inventory, then run it","b":[{"t":"grid","items":[["AI Planning OS","Demand forecasting, financial, assortment and inventory planning in one connected, AI-native workflow. Answers: what to buy, how much, where to send it, when to top up, move or discount it."],["Omnichannel Fulfilment System","Exposes every piece of inventory across all channels and gets each order out: warehouse operations, order orchestration, logistics and store & omnichannel."]]},{"t":"reveal","q":"Give the 30-second overall pitch.","a":"“Increff helps retail businesses improve inventory decisions and fulfilment. AI Planning OS supports what to buy and where to place stock. The Omnichannel Fulfilment System runs the warehouse, order and channel processes. The useful starting point is the part of your operation causing the problem, not the entire catalogue.”"}]},{"h":"Everything inside the two families","b":[{"t":"table","head":["Family","Area","Modules"],"rows":[["AI Planning OS","Financial planning","Demand forecasting · Merchandise financial planning (MFP) · OTB planning / WSSI · Reviews & approvals"],["AI Planning OS","Assortment planning","Range architecture · Buying · Reordering"],["AI Planning OS","Inventory planning","Allocation & replenishment · Inter-store / warehouse transfers · Markdown optimisation"],["Omnichannel Fulfilment","Warehouse operations","WMS · Label software"],["Omnichannel Fulfilment","Order orchestration","OMS · Channel Management System · Vendor Inventory Management & Fulfilment"],["Omnichannel Fulfilment","Store & omnichannel","Ship from store · BOPIS / BORIS · Endless aisle · Self-checkout"]]}]},{"h":"Each module: the pain, the buyer, the question","sub":"Click a module.","b":[{"t":"tabs","items":[["Financial planning (MFP)","Sets top-down sales, margin and inventory targets by season, channel and category.","Targets built in Excel; no link between plan and buying.","Head of Merchandising / Planning, CFO","“How do you set next season’s sales and inventory budget today?”"],["OTB / WSSI","Tracks open-to-buy and weekly sales-stock-intake against plan.","Over-buying; no live view of budget left to spend.","Head of Planning, Head of Buying","“How do you know how much budget is left to buy mid-season?”"],["Assortment & buying","Decides which styles, sizes and depth to buy, driven by attributes and true rate of sale.","Buying on gut feel; dead stock and broken sizes.","Head of Buying, Head of Merchandising","“How do you decide which styles and how many to buy?”"],["Allocation & replenishment","Sends the right stock to each store and refills it from sales.","Stores with too much of one item and none of another; Excel allocation.","Head of Merchandising, Head of Planning, Head of Supply Chain","“How do you decide what each store gets?”"],["Markdown optimisation","Recommends when and how much to discount, per item and store.","Blanket end-of-season sales eating margin.","Head of Merchandising, CEO","“How do you decide when to discount slow sellers?”"],["WMS, piece-level (serialized)","Scan-based warehouse: every piece barcoded from receiving to dispatch, fully traceable.","Stock mismatches, manual pick lists, slow picking for B2C and marketplaces.","Head of Warehouse, Head of Supply Chain, COO","“Do you pick one item at a time, and how accurate is your stock count?”"],["WMS, carton/pallet (non-serialized)","Warehouse for boxes and pallets: batches, FEFO/FIFO, forklift tasks, B2B dispatch.","Expiry losses, long cycle counts, paper-based putaway.","Head of Warehouse, Head of Logistics, Head of Supply Chain","“Do goods move as cartons and pallets? How do you handle expiry?”"],["OMS","One inventory view across warehouses, stores and marketplaces; routes each order to the best location.","Overselling online; stock not synced across channels.","Head of E-commerce / Omnichannel, CTO / CIO","“Do you ever sell online something that’s actually out of stock?”"],["Store fulfilment","Lets stores ship online orders, BOPIS/BORIS, endless aisle; exposes store stock online.","Online stock-outs while stores sit on inventory.","Head of Omnichannel, Head of E-commerce, COO","“Can your stores fulfil online orders today?”"],["B2B / cross-dock","Wholesale and distributor dispatch, box-level cross-docking.","Manual B2B order entry (orders taken by email).","Head of Logistics, Head of Distribution, Head of Supply Chain","“How do distributor orders reach the warehouse?”"]],"labels":["What it does","Pain it solves","Who buys","Ask this"]}]},{"h":"The four problems, mapped to products","b":[{"t":"table","head":["Where the journey failed","Typical symptom","Where to look"],"rows":[["Inventory decisions","Wrong buy, size mix, location, replenishment, transfer or markdown","AI Planning OS"],["Connectivity","Information doesn’t move reliably between systems","Channel Management / integrations"],["Order coordination","Orders and stock not coordinated across channels and nodes","OMS, store fulfilment"],["Execution","Receiving, storage, picking, packing, dispatch or returns unreliable","WMS"]]},{"t":"tip","x":"A capability leads to an operational change, which leads to a business consequence. Example: scan verification → a mismatched pick is caught before dispatch → potentially fewer mis-ships and rework. Don’t leap to “guaranteed revenue growth”."}]}],"quiz":[{"q":"Which family does allocation and replenishment belong to?","o":["Omnichannel Fulfilment System","AI Planning OS","Channel Management","Store fulfilment"],"a":1,"w":"It’s inventory planning inside AI Planning OS."},{"q":"“We oversell online.” Which module do you think of first?","o":["Markdown optimisation","OMS","Label software","MFP"],"a":1,"w":"One inventory view across channels is the OMS’s job."},{"q":"“How do you know how much budget is left to buy mid-season?” tests the need for…","o":["OTB / WSSI","Store fulfilment","WMS","Cross-dock"],"a":0,"w":"Open-to-buy tracking."},{"q":"“Expiry losses and 20-day cycle counts.” Which module?","o":["WMS, carton/pallet","AI Planning OS","Endless aisle","MFP"],"a":0,"w":"Batches, FEFO and cycle counts are carton/pallet WMS territory."},{"q":"Who typically buys markdown optimisation?","o":["Head of Warehouse","Head of Merchandising, CEO","CTO only","Head of Logistics"],"a":1,"w":"Discount decisions sit with merchandising leadership."},{"q":"Which statement is safe?","o":["“Scan verification guarantees revenue growth.”","“Scan verification can catch a mismatched pick before dispatch, potentially reducing mis-ships.”","“Our WMS doubles sales.”","“No errors ever.”"],"a":1,"w":"Capability → operational change → possible consequence."}]},"C2":{"title":"AI Planning OS: financial and assortment planning","mins":15,"intro":"How the plan is set, and how the range is built and bought.","cards":[{"h":"Financial planning","sub":"Forecast demand, set the budget and approve the plan in one workflow.","b":[{"t":"tabs","items":[["Demand forecasting","Predict true demand at the store-SKU level.","Run your own algorithm scripts or swap individual algorithm blocks for your own logic · Compare forecast scenarios side by side and pick the winner on a weighted KPI scorecard · Reviews and approvals across hierarchies and teams, with every comment tracked."],["Merchandise financial planning","Align financial targets through forecasting.","Multi-level budgeting across category, channel, region and store, with automated top-down and bottom-up reconciliation · Built-in KPIs for revenue, margin, ASP and discount %, plus custom KPIs · AI growth suggestions with anomaly correction to clean out past over-buying."],["OTB planning / WSSI","Monitor weekly sales trends and optimise buying decisions.","OTB with flexible KPIs and weekly/monthly demand projections · Actual vs projected buying budgets tracked and adjusted as the season progresses · Monthly AOP targets broken into weekly plans using historical sell-through · An AI agent reviews each OTB plan and flags risks before sign-off."]],"labels":["What it does","Highlights"]}]},{"h":"Assortment planning","sub":"Build every assortment around the unique DNA of every store.","b":[{"t":"tabs","items":[["Range architecture","Attribute-driven assortments.","A unique store DNA for each store from historical sales, seasonality and attribute preferences · Attribute-group demand analysis across up to 17 fashion attributes, carried forward across seasons · Demand-corrected size curves, adjusted for past over- and under-buying, to prevent broken sizes."],["Buying","Lock in what to buy, how much and for which stores.","Forward-looking rate of sale for every store-style, with projected closing inventory · Range plan matched against the design catalogue or PLM, with suggested placeholders alongside actual style codes, images, costs and KPIs · Store-level distribution plan ranked by sales velocity, assortment fit and planogram gap."],["Reordering","Automate bestseller replenishment.","Styles classified by rate of sale, discount level and remaining sell window · Reorder quantities calculated at SKU level from live demand, cover days, lead times and safety stock · Reorder runs at several frequencies to match the buying calendar."]],"labels":["What it does","Highlights"]}]},{"h":"How forecasting works","sub":"Try your answer, then reveal.","b":[{"t":"reveal","q":"“How does your forecasting work?”","a":"Multiple models (SARIMA, XGBoost, Prophet) are back-tested and the best is chosen per category and level. Weightages and trade calendars are configurable. Clients can bring their own models, and standard models like moving average can be replicated."},{"t":"reveal","q":"“What about new products or brands with no history?”","a":"Attribute-based forecasting with up to 17 attribute levels, rolling up the hierarchy when data is thin. New brands can be benchmarked against similar ones. Assess fit and data readiness before predicting performance."},{"t":"reveal","q":"“How accurate is it?”","a":"It depends from client to client, and on how much historical data is available. Case studies have shown 85–90% accuracy from month 7 onwards, but the rolling data of a 5–6 month period plays a big role. Don’t promise a figure for their business: offer to assess their data first."},{"t":"reveal","q":"“What does MFP do?”","a":"It’s a planning system, not a reporting tool. It sets financial targets, covers revenue growth across channels and supports scenario comparison."}]}],"quiz":[{"q":"A prospect wants to keep their own forecasting algorithm. What do you say?","o":["Not possible","They can run their own scripts or swap individual algorithm blocks for their own logic","Only Increff models are allowed","Only in Excel"],"a":1,"w":"Algorithm Studio supports their own logic beside ours."},{"q":"How many fashion attributes can range architecture analyse?","o":["Up to 5","Up to 17","Exactly 3","Unlimited, guaranteed"],"a":1,"w":"Up to 17 attributes."},{"q":"“How accurate is your forecast?” Best answer?","o":["“Always 95%.”","“It depends on the client and their history; case studies show 85–90% from month 7, so let’s assess your data first.”","“We don’t measure it.”","“100% after a month.”"],"a":1,"w":"Never promise a figure."},{"q":"Which module breaks monthly AOP targets into weekly plans?","o":["OTB planning / WSSI","Reordering","Markdown","Label software"],"a":0,"w":"OTB / WSSI uses historical sell-through to build weekly plans."},{"q":"A brand launching new categories asks how we forecast without history. Answer?","o":["We can’t","Attribute-based forecasting rolls up the hierarchy and benchmarks against similar products; assess data readiness first","Copy last year","Ask the CEO"],"a":1,"w":"Attribute-level comparisons, then a data-readiness check."},{"q":"Is MFP a reporting tool?","o":["Yes","No: it is a planning system that sets targets and compares scenarios"],"a":1,"w":"Planning, not reporting."}]},"C3":{"title":"AI Planning OS: inventory planning, the platform and its limits","mins":15,"intro":"Getting stock to the right store, the platform features, and what not to promise.","cards":[{"h":"Inventory planning","sub":"Right stock, right store, right time.","b":[{"t":"tabs","items":[["Allocation & replenishment","True rate of sale for every store-style-SKU, from healthy, in-stock days only · Unique store–style rankings through Store-StyleRank™, using recency, seasonality, sales velocity and revenue potential · Custom parameters for allocation, replenishment and assortment by store or channel."],["Inter-store / warehouse transfers","Hyper-local rebalancing across the store and warehouse network based on pincode-level demand · Broken sizes moved to locations where they complete full-size runs, maximising full-price sell-through · Proactive reallocation suggestions from local demand forecasts."],["Markdown optimisation","Price elasticity to limit discounts and avoid wasted markdowns · In-season, event-based and end-of-season liquidation, with the event calendar as input · SKU-level discounts based on demand, sell-through and time left to clear."]],"labels":["Highlights"]},{"t":"reveal","q":"“Do you do markdowns and replenishment?”","a":"Yes. Markdown optimisation uses price elasticity. Replenishment can be automatic, or buy suggestions go for approval. Recommendations are pushed to the ERP, which creates the stock transfer orders."}]},{"h":"The platform","b":[{"t":"grid","items":[["Workflows and approvals","Planning runs as a cycle: each plan routes through store, merchandising, finance and leadership, with every comment and decision on record."],["Algorithm Studio","Use Increff algorithms as they are, tune them, or swap blocks for your own logic; run yours beside ours on the same data."],["Interactive workbooks","Build and review plans in spreadsheet-style workbooks, with charts, edits and pivots in one place."],["Scenarios and scorecards","Compare forecasts and plans side by side and choose the winner on a weighted KPI scorecard."],["Data and integrations","Bring in external data such as footfall alongside sales and stock."],["Role-based dashboards","A home page for each role, from CXO to merchandiser to store manager."]]}]},{"h":"AI that plans with you, not for you","b":[{"t":"grid","items":[["Plan faster","Agents draft and refine forecasts, workflows and dashboards for the team to approve."],["Catch risks earlier","Agents review every plan and flag issues before sign-off."],["Stay in control","You set the permissions, and every recommendation is explained."]]},{"t":"stats","items":[["90%","less planning cycle time"],["25%","better inventory health"],["22%","fewer stock-outs"],["15%","better forecast accuracy"]]},{"t":"reveal","q":"“Will it replace my merchandising team?”","a":"No. It is decision support with approvals. The system needs direction, and a softer transition is recommended. Planners’ expertise stays central."}]},{"h":"Boundaries: what AI Planning OS is not","b":[{"t":"grid","items":[["Not execution","It improves inventory <i>decisions</i>. It is not a POS, WMS, PLM/design tool or finance replacement. Transfers still need operational execution."],["Not a guarantee","Don’t promise forecast accuracy, autonomous decisions, or results without validation."],["Best for omnichannel brands","It relies on geographic (store) sales data, so it suits omnichannel and store-led brands best."],["AI claims","There is an in-product chatbot for guidance. APIs are available. Do not claim an official MCP server."]]},{"t":"reveal","q":"“If recommendations are right but stores get goods late, what else do we investigate?”","a":"Execution and replenishment lead time, not only planning logic."},{"t":"reveal","q":"“How do you prove the numbers?”","a":"A/B testing of stores on Increff against stores on the current method, and a pilot (any POC needs approved scope and conditions: see F6)."}]},{"h":"Discovery questions for planning","b":[{"t":"chips","items":["Who makes allocation decisions, with what data?","How much happens in spreadsheets?","How are stores clustered?","How are new products handled?","How do you tell low demand from lost sales due to no stock?","How quickly does a decision become an executed replenishment?","Are transfer benefits weighed against transport cost?","Who approves markdowns?"]},{"t":"p","x":"<b>Inputs you’ll need:</b> sales history, stock, product attributes, store structure, returns, season/event context, and who owns the data and its quality."}]}],"quiz":[{"q":"What makes Increff’s rate of sale “true”?","o":["It includes stock-out days as zero","It uses only healthy, in-stock days","It doubles weekend sales","It ignores stores"],"a":1,"w":"Stock-outs aren’t mistaken for low demand."},{"q":"Who creates the stock transfer orders after a replenishment recommendation?","o":["AI Planning OS","The ERP","The courier","The POS"],"a":1,"w":"Recommendations are pushed to the ERP, which creates the transfer orders."},{"q":"Does AI Planning OS replace planners?","o":["Yes","No: decision support with approvals"],"a":1,"w":"The team stays in control."},{"q":"An online-only brand with no stores asks for AI Planning OS. What should you know?","o":["It’s the perfect fit","It relies on geographic store sales data, so it suits omnichannel brands best","It needs no data","Only for pharma"],"a":1,"w":"Online-only is a weaker fit."},{"q":"How can a prospect prove the numbers?","o":["Trust us","A/B test stores on Increff vs the current method, or an approved POC","Read a brochure","No way to prove it"],"a":1,"w":"Evidence on their own stores."},{"q":"What does markdown optimisation use to limit discounts?","o":["Price elasticity","Courier rates","Bin locations","Payroll"],"a":0,"w":"Price elasticity plus sell-through and time left to clear."}]},"C4":{"title":"WMS: running the warehouse","mins":18,"intro":"How Increff controls stock from receiving to returns, and the two ways of tracking it.","cards":[{"h":"The warehouse journey","sub":"The questions behind each step.","b":[{"t":"steps","items":[["Receive","What arrived, in what quantity and condition?"],["Put away","Where was usable stock placed?"],["Pick","Which units, from where?"],["Pack","Do the items match the order?"],["Dispatch","What was handed over, and how is it evidenced?"],["Return","What came back, in what condition, and is it resellable?"]]},{"t":"p","x":"“Increff WMS supports warehouse inventory control and execution from receiving to dispatch and returns. The relevant conversation is how stock is recorded, located, verified, moved and reconciled.”"}]},{"h":"A platform that fits the warehouse","b":[{"t":"grid","items":[["Configurable workflows","Steps, rules, roles and automated triggers configured to match the operating model."],["Plug-in architecture","One stable core, plug-in modules of your choice, and room to add more without a rebuild."],["Built-in features","Wave picking, auto-replenishment, self-triggering cycle counts and a live control tower."],["Also built in","Pick-path optimisation · FIFO/FEFO automation · cross-docking · kits & bundles · 80+ dashboards."]]}]},{"h":"What’s new","b":[{"t":"grid","items":[["Role-based control tower","Every user, from CEO to supervisor, gets a dashboard built from a large library of charts and widgets."],["Multi-language UI","Set the language and rename terms to match each team and region."],["Digital 3D warehouse view","See the 2D layout as a 3D model, with pick and putaway movement overlaid to catch layout inefficiencies."],["Task-based operator app","Every job runs as a task on the handheld, with alerts and automatic follow-up tasks (missed picks, low stock)."],["Video-proof returns","Return unboxing captured on video to support marketplace claims for missing, damaged or wrong items."],["Quick onboarding","An intuitive interface designed so warehouse staff learn it fast. Don’t promise a fixed training time to a prospect."]]}]},{"h":"Serialized vs non-serialized","b":[{"t":"table","head":["","Serialized (piece-level)","Non-serialized (carton/pallet, SKU-level)"],"rows":[["How it tracks","A unique serial code for every item; scan-based operations; full audit trail per piece","Flexible units of measure: cases, cartons, pallets and eaches"],["Strengths","About 99.9% inventory accuracy, continuous audit, redirect to another bin if an item isn’t found, return tracking, fraud reduction","Bulk putaway and bulk return; suits wholesale-heavy and FMCG clients"],["Watch out","Every serial code must be scanned: no bulk putaway or bulk return","Rolling out in phases"]]},{"t":"tip","x":"When serialization seems too heavy for a prospect, quote both options. One system serves D2C, marketplaces, wholesale and offline retail."}]},{"h":"Label software","b":[{"t":"grid","items":[["Unique serial code per item","A unique digital signature for each item for accurate tracking."],["Drag-and-drop design","Create professional labels with simple design tools."],["Bulk printing","Thousands of labels with a single click."],["Print anywhere","From manufacturer, distributor or importer locations, with role-based access."]]},{"t":"reveal","q":"“Who adds the serial codes? Will a sticker spoil a luxury product?”","a":"Two methods: add the code at manufacturing via the label software, or scan items into boxes. The code can go on outer packaging, price tags or a sewn label. The brand controls placement and design."}]},{"h":"WMS impact","b":[{"t":"stats","items":[["99.9%","bin-level inventory accuracy"],["99.5%","orders fulfilled within SLA"],["25–30%","lower manpower and storage costs"]]},{"t":"tip","x":"Documented results, not guarantees. A prospect’s result depends on their baseline and scope."}]}],"quiz":[{"q":"A wholesaler wants bulk putaway. Which tracking mode?","o":["Serialized","Non-serialized"],"a":1,"w":"Bulk putaway and bulk return exist only in non-serialized mode."},{"q":"Which feature helps with marketplace claims for damaged returns?","o":["3D warehouse view","Video-proof returns","MFP","Endless aisle"],"a":1,"w":"Return unboxing is captured on video."},{"q":"A luxury brand worries a sticker will spoil the product. Answer?","o":["Stickers are mandatory on the item","The code can go on outer packaging, a price tag or a sewn label, and the brand controls placement","We can’t help","Use RFID only"],"a":1,"w":"Placement is flexible."},{"q":"Which step answers “Do the items match the order?”","o":["Receive","Put away","Pack","Return"],"a":2,"w":"Packing verifies against the order."},{"q":"What does the plug-in architecture mean for a client?","o":["Rebuild for every change","A stable core with modules added without a rebuild","On-premise install","No configuration"],"a":1,"w":"Grow without a rebuild."},{"q":"A prospect asks: “How fast can my staff learn it?” Best answer?","o":["“Exactly 10 minutes, guaranteed.”","“It’s designed to be learned quickly; let’s walk through the real task with your team.”","“Months.”","“No training needed ever.”"],"a":1,"w":"Don’t guarantee training times."}]},"C5":{"title":"WMS: questions prospects ask","mins":12,"intro":"The questions that come up most on calls, and what to capture.","cards":[{"h":"Your answer first","sub":"Try each, then reveal.","b":[{"t":"reveal","q":"“What is item-level serialization and why bother?”","a":"Each unit gets a unique ID: about 99.9% inventory accuracy, continuous audit, bin redirect when an item isn’t found, return tracking and fraud reduction. There’s also a non-serialized, SKU-level option; quote both when serialization seems heavy."},{"t":"reveal","q":"“How do you prevent wrong-item picks?”","a":"Two-step validation: a pick scan and a pack scan. Packers scan blind, without seeing the order; product images help."},{"t":"reveal","q":"“How do you handle multi-item orders and picker travel?”","a":"Items are consolidated using bins and serial-to-order mapping, and the system minimises picker travel. Bin-space optimisation isn’t standard but can be customised."},{"t":"reveal","q":"“Does it support returns?”","a":"Yes: return consolidation, video capture of forward and return shipments, and return-reduction strategies."},{"t":"reveal","q":"“Can we skip scanning steps, like AWB or bag-level?”","a":"Many steps are configurable. The AWB scan can be skipped from a configuration screen. Fixed-pallet export orders can be scanned at pallet level instead of bag level."}]},{"h":"More questions","b":[{"t":"reveal","q":"“Do you support batch and expiry?”","a":"Calls say yes: batch tagging, FEFO/FIFO, remaining shelf life by location and channel-specific shelf-life tolerances. But depth needs specialist validation: capture the exact rule, unit and validation point."},{"t":"reveal","q":"“Can one user log in on several devices?”","a":"Calls said only one login per user at a time. Don’t claim otherwise; verify if it matters."},{"t":"reveal","q":"“Can it run at our 3PL’s warehouse?”","a":"Yes. The value holds as long as the brand controls its inventory and visibility. Don’t guarantee how fast 3PL staff will be trained."},{"t":"reveal","q":"“Can we do bulk putaway in the serialized WMS?”","a":"No. Bulk putaway and bulk return exist only in the non-serialized mode; in serialized mode every code is scanned."},{"t":"reveal","q":"“Do you capture inbound photos or video at receiving?”","a":"Not currently (customisation possible). Forward and return video exist. Video is stored locally; Increff doesn’t supply hardware."},{"t":"reveal","q":"“Can you verify returns at the gate, or permanently relocate misplaced items?”","a":"Gate-entry shipment checks aren’t currently supported, and inventory normalisation isn’t available. Don’t say yes."}]},{"h":"Boundaries and discovery","b":[{"t":"grid","items":[["Browser-based","It runs in a browser and needs connectivity. No offline mode."],["Scope by unit","Piece-level and carton/B2B operations need different scoping."],["Validate","Batch/expiry/FEFO depth, hardware compatibility and unusual workflows need specialist validation."]]},{"t":"chips","items":["What is the fulfilment unit: piece, carton, pallet or mixed?","Normal and peak volumes (orders ≠ pieces)?","Which step limits throughput?","How much checking and rework?","Which transactions cause stock variance?","How fast is returned stock available after inspection?","Brand- or 3PL-controlled?"]}]}],"quiz":[{"q":"How does Increff prevent wrong-item picks?","o":["Supervisors check everything","Pick scan + blind pack scan, with product images","Random audits","RFID only"],"a":1,"w":"Two-step validation."},{"q":"“Do you support batch and expiry?” Best answer?","o":["“Yes, everything, guaranteed.”","“Calls say yes, but let’s capture your exact rules for specialist validation.”","“No.”","“Only for fashion.”"],"a":1,"w":"Depth needs validation."},{"q":"Can the AWB scan be skipped?","o":["Never","Yes, from a configuration screen","Only offline","Only for B2B"],"a":1,"w":"Many steps are configurable."},{"q":"“Can you verify returns at the gate?”","o":["Yes","Not currently supported: don’t say yes","Only with RFID","Coming next week"],"a":1,"w":"It’s on the do-not-claim list."},{"q":"A prospect’s connectivity drops for hours daily. What do you say?","o":["No problem","It’s browser-based and needs connectivity; be honest if offline is essential","Offline mode is coming","Buy a generator"],"a":1,"w":"No offline mode."},{"q":"Why ask “orders or pieces?”","o":["It doesn’t matter","Orders ≠ pieces: a 5-item order is 5 picks, which changes scale and fit","For billing only","For marketing"],"a":1,"w":"Volume must be measured in the right unit."}]},"C6":{"title":"Order orchestration: OMS, channels and vendors","mins":15,"intro":"Getting every order to the best node, and keeping every channel’s stock right.","cards":[{"h":"OMS","sub":"Route every order to the best fulfilment node across all channels.","b":[{"t":"grid","items":[["Intelligent routing and splitting","Route orders by availability, proximity and cost to reduce multiple shipments and delivery time."],["Multi-node orchestration","Handles partial shipments, multi-location dispatch, store pickups and returns."],["Returns resolution","Track forward and reverse shipments with integrated quality checks and video capture for returns."],["Prebuilt dashboards","SLAs, order volumes, returns, sales and cancellations across nodes and channels: 80+ dashboards."]]},{"t":"tip","x":"Internal sources disagree on exactly which routing and splitting rules sit in Increff versus the client’s systems. Teach them as requirements to capture, and validate each rule. Don’t promise a full enterprise OMS replacement."}]},{"h":"Channel Management System","b":[{"t":"grid","items":[["1,300+ live integrations","Connectors already built, tested and running across webshops, POS, marketplaces and ERPs."],["Flexible listing management","Link one warehouse SKU to multiple marketplace listings."],["Under-10-second sync","Inventory and orders update across channels in under 10 seconds."],["OMS- and ERP-agnostic","Add it to the existing stack without replacing the current OMS or ERP."]]},{"t":"tip","x":"Sync speed is under 10 seconds: use that figure everywhere. Always confirm the exact connector, version and flows rather than quoting the integration count as proof of fit."}]},{"h":"Vendor Inventory Management & Fulfilment","b":[{"t":"grid","items":[["Direct vendor fulfilment","Marketplace, D2C and B2B orders fulfilled directly from vendor locations, with no warehousing on your side."],["Cross-docking ready","B2C orders fulfilled as soon as inventory arrives, with no putaway or picking."],["APIs","REST APIs to connect vendor OMS, WMS or ERP systems."],["Volume surges","Intelligent allocation and vendor task panels to absorb order spikes."]]},{"t":"reveal","q":"What is Vendor Inventory Management, in one line?","a":"Brands expose stock from their own (or a vendor’s) warehouse without moving it, for example by CSV upload on a vendor portal, and orders are fulfilled through stock transfer notes."}]},{"h":"Questions prospects ask","b":[{"t":"reveal","q":"“How do you avoid overselling? Do I need a safety buffer?”","a":"Near-zero buffer exposure (100% inventory exposure). A store-level buffer can still be set, and stock pools can be split for B2B and B2C."},{"t":"reveal","q":"“Can I reserve stock for B2B?”","a":"Yes. Create virtual inventory pools and map a pool to B2B, for example exposing 50 of 100 units."},{"t":"reveal","q":"“Are OMS and WMS one product or separate?”","a":"They’re integrated in the Omnichannel Fulfilment System but can be bought separately by use case. Some clients keep their own WMS and use only the order layer."},{"t":"reveal","q":"“Can you route orders by tag or order type, not just PIN code?”","a":"Currently routing uses PIN-code proximity and inventory availability. Routing by tag is not confirmed: needs an owner. Don’t promise it."},{"t":"reveal","q":"“Can I edit an order after dispatch?”","a":"Only before invoicing. After invoicing: cancel and recreate, then re-scan and repack."},{"t":"reveal","q":"“Do you do financial reconciliation, stock transfer notes and GST?”","a":"No. Increff is a workflow system; the ERP handles reconciliation, STNs and credit notes. Raise this early: one prospect was dissatisfied because a competitor automated it."}]},{"h":"Discovery for order flows","b":[{"t":"chips","items":["Where is the order created?","Which system reserves inventory?","Who decides the fulfilment node?","Can the order move to another node?","Are split shipments acceptable?","How do cancellations release inventory?","How do status and returns flow back?"]}]}],"quiz":[{"q":"How can a brand keep 50 of 100 units for B2B?","o":["Not possible","Virtual inventory pools mapped to B2B","Manual spreadsheet","Separate warehouse only"],"a":1,"w":"Pools split exposure by channel."},{"q":"Can a client use Increff OMS with their own WMS?","o":["No","Yes: they can be bought separately by use case"],"a":1,"w":"Some clients use only the order layer."},{"q":"“Route orders by tag?”","o":["Yes, standard","Not confirmed: routing uses PIN-code proximity and availability today","Only offline","Only for B2B"],"a":1,"w":"Needs an owner; don’t promise."},{"q":"An invoiced order needs a change. What happens?","o":["Edit freely","Cancel and recreate, then re-scan and repack","Impossible ever","Call the courier"],"a":1,"w":"Edits only before invoicing."},{"q":"What does Vendor Inventory Management let a brand do?","o":["Plan markdowns","Fulfil orders from vendor locations without moving stock into its own warehouse","Run payroll","Replace the ERP"],"a":1,"w":"Direct vendor fulfilment."},{"q":"What should you NOT do with the “1,300+ integrations” figure?","o":["Mention it in the Overview","Use it as proof that their exact system and flows are covered","Know it","Read it"],"a":1,"w":"Always confirm the exact connector and flows."}]},"C7":{"title":"Store & omnichannel","mins":12,"intro":"Turning stores into fulfilment hubs and shopping nodes.","cards":[{"h":"Ship from store","b":[{"t":"grid","items":[["Shop beyond shelves","Stores become omnichannel centres handling walk-ins, pickups, online orders, endless-aisle browsing and returns."],["Real-time, mobile-first","Inventory synced across channels; staff use mobile, scan-based workflows and single-screen order processing."],["Intelligent routing","Orders go automatically to the nearest store, dark store or warehouse, based on real-time stock, order type and promised SLA."]]}]},{"h":"BOPIS and BORIS","b":[{"t":"grid","items":[["Flexible buy & collect","Customers buy online and pick up at any store, with click-and-collect routed to the nearest location based on live stock and pickup availability."],["In-store returns","Online purchases returned or exchanged at any store, with pre-set refund, grading and stock re-entry steps."]]}]},{"h":"Endless aisle and self-checkout","b":[{"t":"grid","items":[["Remote catalogue","Customers browse and buy out-of-stock or off-location items on their phone."],["Network-wide visibility","See what is available, where and at what price, in real time."],["Compliance-safe pricing","Prices and promotions synced so customers see accurate pricing at the point of sale."],["Scan-and-go checkout","Customers scan, check prices and pay on their phones."],["Security clearance","Scan-verified exit approval on successful payment."],["Free up counters","Less load on billing counters, so staff focus on customers and shelves."]]}]},{"h":"Questions to ask, and limits","b":[{"t":"chips","items":["Is store stock reliable?","Who picks and packs in the store?","How are walk-in sales protected?","What are the accept/reject rules?","What happens when a store can’t fulfil?"]},{"t":"tip","x":"Confirm the live feature list for each journey before promising it. Store inventory management (backroom vs floor, store receiving) is a different need from ship-from-store: route the meeting accordingly."}]}],"quiz":[{"q":"A customer buys online and returns the item at a store. What is this?","o":["BOPIS","BORIS","Endless aisle","Cross-docking"],"a":1,"w":"Buy online, return in store."},{"q":"Which feature lets a customer buy an item not stocked in this store?","o":["Endless aisle","Self-checkout","BOPIS","Label software"],"a":0,"w":"Remote catalogue across the network."},{"q":"Ship from store routes orders based on…","o":["Random choice","Real-time stock, order type and promised SLA","Staff preference","Price only"],"a":1,"w":"Intelligent routing."},{"q":"A retailer’s real problem is store receiving and backroom stock. Is that ship-from-store?","o":["Yes","No: it’s a store inventory management need; route accordingly"],"a":1,"w":"A classic mis-routed demo."},{"q":"What does scan-and-go do?","o":["Prints labels","Lets customers scan and pay on their phones","Counts stock","Routes couriers"],"a":1,"w":"Self-checkout."}]},"D1":{"title":"Industry use cases","mins":15,"intro":"What each industry struggles with, which products fit, and what to ask.","cards":[{"h":"Fashion, footwear and lifestyle","b":[{"t":"tabs","items":[["Apparel & fashion","Many stores and SKUs, seasonal collections, size-specific stock-outs, returns, Excel planning, marketplace overselling.","AI Planning OS (allocation, replenishment, markdown) + piece-level WMS + OMS / store fulfilment.","Are stock-outs size-specific? How are winners replenished? How much planning happens in Excel?"],["Footwear & sportswear","Size curves and broken size runs, residual stock, high online returns, stock spread across stores and marketplaces.","AI Planning OS + piece-level WMS + OMS / store fulfilment.","How do you identify incomplete assortments? Where do returns go?"],["Jewellery","High value per piece, attributes, item-level traceability, stock across many counters or stores.","AI Planning OS + piece-level WMS.","Which controls and item identifiers are mandatory?"],["Eyewear","Huge SKU variety (frames × lenses), store replenishment, online + store orders.","AI Planning OS + piece-level WMS.","How do you replenish stores across so many variants?"],["Fashion accessories","Small, high-SKU items, D2C and marketplace orders.","Piece-level WMS + OMS.","How many orders a day, across which channels?"]],"labels":["What they struggle with","Products that fit","Ask"]}]},{"h":"Beauty, home and general merchandise","b":[{"t":"tabs","items":[["Beauty & cosmetics","Batches and expiry, gift sets / kits, many small SKUs, channel-specific shelf-life rules.","AI Planning OS + WMS (piece-level or carton/pallet).","What remaining shelf life does each channel require? (FEFO, batches and bundles need validation.)"],["Home décor & furnishing","Slow-moving items, bulky goods, one product in several boxes (kitting), long lead times.","AI Planning OS + piece-level WMS.","Is fulfilment limited by stock, components or delivery?"],["Sporting goods & toys","Seasonal peaks, many SKUs, stores plus marketplaces.","Piece-level WMS; AI Planning OS, qualify carefully.","What changes at peak?"],["Department stores & multi-brand","Many brands and categories, Excel allocation, online orders from stores.","OMS / store fulfilment; AI Planning OS, qualify carefully.","How is allocation done across brands?"],["Books & stationery","Very large SKU counts in one big warehouse.","WMS.","How many SKUs, and how are they located?"]],"labels":["What they struggle with","Products that fit","Ask"]}]},{"h":"Distribution, FMCG, pharma and electronics","b":[{"t":"tabs","items":[["FMCG / food & beverage (distributor side)","Batches, FEFO / expiry, pallets, long cycle counts, distributor orders.","Carton/pallet WMS (piece-level for B2C).","Which units are bought, stored and dispatched? How long do cycle counts take?"],["Pharma & healthcare distribution","Batch and expiry compliance, recalls.","WMS (piece-level or carton/pallet). Not qualified if B2B-only.","What are the batch/recall requirements?"],["Electronics & appliances","Serial numbers and warranty, bundles, return verification, dealer / B2B dispatch.","WMS (piece-level or carton/pallet).","Where must serial identity be captured?"],["Spare parts","Large SKU counts, cartons, dealer dispatch.","Carton/pallet WMS.","How do dealer orders reach the warehouse?"],["Hypermarkets & supermarkets","Online orders picked from the store floor, express and slotted delivery, fresh produce, expiry.","WMS for store fulfilment (see the Lulu model).","How are online orders picked today, and how long does a pick take?"]],"labels":["What they struggle with","Products that fit","Ask"]}]},{"h":"Operating model changes everything","b":[{"t":"p","x":"Always identify the operating model as well as the industry: <b>D2C, store-led, wholesale/B2B, marketplace seller, 3PL or mixed</b>. A carton-based distributor and a piece-pick D2C brand need different discovery even in the same industry."},{"t":"tip","x":"An industry use case is not permission to sell every product everywhere. Check fit with your Increff partnerships contact before you book a meeting."}]}],"quiz":[{"q":"A footwear retailer’s stores keep running out of mid sizes. Which product area?","o":["AI Planning OS (size curves, allocation)","Label software only","TMS","Self-checkout"],"a":0,"w":"Broken size runs are a planning problem."},{"q":"A food distributor has 20-day cycle counts and expiry losses. Which product?","o":["Carton/pallet WMS","Endless aisle","MFP","Ship from store"],"a":0,"w":"Batches, FEFO and cycle counts."},{"q":"A pharma company supplies only hospitals. Qualified?","o":["Yes","No: B2B-only pharma is not qualified"],"a":1,"w":"Disqualifier."},{"q":"Which question fits an electronics prospect?","o":["“Where must serial identity be captured?”","“What is your size curve?”","“How long is your season?”","“Which fabrics?”"],"a":0,"w":"Serial and warranty tracking."},{"q":"Two shoe businesses: one ships pallets to dealers, one ships single parcels to consumers. Same discovery?","o":["Yes, same industry","No: operating model and unit change the discovery"],"a":1,"w":"Carton-based vs piece-pick."}]},"D2":{"title":"The Lulu supermarket model","mins":15,"intro":"How a hypermarket turned its stores into fulfilment hubs with Increff, and how to spot the next one.","cards":[{"h":"The problem: stores that are also warehouses","b":[{"t":"p","x":"When online orders are picked from the same shelves walk-in customers shop, everything that was invisible becomes expensive. Hypermarkets don’t have a warehouse problem; they have a <b>store-as-fulfilment-node</b> problem."},{"t":"table","head":["Symptom","What it costs","How Increff solves it"],"rows":[["Ghost inventory: one pool for walk-in and online; stock moves without the system knowing","Pickers can’t find items, orders go out short","Inventory down to shelf, bay and aisle; the ERP stays the source of truth while Increff knows where stock physically is"],["High “not found” rates","Picker time wasted searching; premature cancellations","A self-learning SKU-to-shelf map, plus alternative-location prompts in the app"],["No pick-path optimisation","Low items per hour; missed express windows","AI pick paths from store layout, order contents and pick history, aware of temperature zones"],["Manual substitution by phone","Minutes lost per substitution; abandoned orders","Suggested alternatives approved by the customer in-app, on WhatsApp or by auto-call"],["No batch / expiry control at the scan","Regulatory exposure from a single expired item","FEFO enforced at pick time; expired batches blocked before scanning"],["Fragmented apps","Duplicate training and integrations","One picker app for express, scheduled, courier, click-and-collect and made-to-order, in English and Arabic"]]}]},{"h":"What Increff runs","b":[{"t":"grid","items":[["Execution layer","Picking, packing and drop-zone execution across store zones (ambient, chiller, fruit & veg, butcher)."],["Fits the existing stack","Orders flow in from the retailer’s OMS; SAP remains the inventory source of truth. No rip-and-replace."],["One integration to delivery","A logistics aggregator / TMS integration for rider assignment and scan-based handover."],["Bag IDs","Bag IDs mapped to multi-bag express orders; store managers audit not-found cases."],["All delivery modes","Quick (express) and slotted deliveries, with substitution and catch-weight as later phases, then dark stores."]]}]},{"h":"The proof","b":[{"t":"stats","items":[["100","supermarket stores live within 2 months of go-live"],["~2 lakh","units processed per day"]]},{"t":"grid","items":[["How it rolled out","Two pilot stores first, then store by store and country by country across the GCC."],["Remote go-lives","A store went live with no Increff team on the ground. Store onboarding became remote and repeatable, which is what makes a 100+ store rollout realistic."],["Speed is the differentiator","A phased model: pilot stores live first, prove the numbers, then scale. Configuration, not code, for zones, waves and scan rules."]]},{"t":"tip","x":"Use only these figures. Modelled uplift percentages from internal decks are targets, not audited results, so don’t quote them."}]},{"h":"Spotting the next Lulu","b":[{"t":"grid","items":[["Who","Hypermarket, supermarket and grocery chains with a large store network, where walk-in and online orders come from the same store floor."],["Signals","Express + scheduled + courier delivery from stores · pickers hunting aisles · substitutions by phone · expiry checked by eye · two or more picking apps · quick-commerce or dark-store ambitions."],["Ask","“How are online orders picked today, and how long does a pick take?” · “What happens when an item isn’t found?” · “How do you handle substitutions and expiry?”"]]},{"t":"reveal","q":"A hypermarket asks: “Do we have to replace SAP?”","a":"<b>No.</b> SAP stays the source of truth for inventory and finance. Increff plugs in as the execution layer for store fulfilment."}]}],"quiz":[{"q":"What is a hypermarket’s core fulfilment problem?","o":["Not enough warehouses","Stores acting as fulfilment nodes for online orders","No ERP","No marketing"],"a":1,"w":"Store-as-fulfilment-node."},{"q":"How many Lulu stores went live within 2 months of go-live?","o":["6","20","100","1,000"],"a":2,"w":"100 supermarket stores."},{"q":"About how many units a day are processed?","o":["~2,000","~20,000","~2 lakh","~2 crore"],"a":2,"w":"~2 lakh units a day."},{"q":"Does the retailer have to replace SAP?","o":["Yes","No: SAP stays the source of truth; Increff is the execution layer"],"a":1,"w":"No rip-and-replace."},{"q":"What made a 100+ store rollout realistic?","o":["Flying consultants to every store","Remote, repeatable store onboarding","Replacing SAP","Building a new ERP"],"a":1,"w":"A store went live with no Increff team on site."},{"q":"Which figures should you NOT quote?","o":["100 stores in 2 months","~2 lakh units a day","Modelled uplift percentages from internal decks"],"a":2,"w":"They are targets, not audited results."}]},"D3":{"title":"Customer proof: choosing and telling the story","mins":15,"intro":"Choose the story by fit, tell it in a fixed structure, and never stretch the numbers.","cards":[{"h":"How to choose and tell a story","b":[{"t":"grid","items":[["Selection method","Problem → relevant solution → operating model → scale / region → credible evidence. Use proof after understanding the issue; don’t lead every answer with a logo."],["Story structure","Context → Problem → Relevant intervention → Documented outcome → Relevance → Question."],["Before external use","Use the current approved asset and confirm exact metric wording, measurement, period and permission. Don’t invent details. No unmasking; no moving metrics between stories."]]}]},{"h":"Six case cards","sub":"Click a case.","b":[{"t":"tabs","items":[["GlobalBees · warehouse accuracy","D2C brand-house operations; the concern is inventory control across a growing fulfilment operation. Listed: 99.9% inventory accuracy.","“GlobalBees is a relevant reference for inventory accuracy. The useful question is how you measure the gap today and which workflow causes it.” Follow up: “How is your inventory accuracy measured, and where does variance enter?”","A guarantee of 99.9% everywhere, or a planning outcome. Inventory accuracy ≠ order accuracy or SLA."],["Brands For Less · supervision","Off-price fashion retail with operational complexity. Listed: 59% less supervision.","“Relevant when repeated supervision and checking consume capacity. Which checks does your team perform, and why?”","A 59% headcount reduction or a universal cost saving."],["Pintola · processing time","Non-fashion D2C food brand. Listed: 79% reduction in order processing time.","“The reduction relates to its process and baseline. Let’s define where processing begins and ends.” Follow up: “Are you measuring order processing, dispatch lead time, or delivery time?”","A 79% delivery-time reduction or a promise of repeatable results."],["Pepe Jeans · allocation effort","Apparel inventory decisions and planning workload. Listed: 3+ days saved per cycle and 85–90% stock utilisation (verify approved wording).","“Relevant when allocation and replenishment consume planning effort. Let’s compare it with your cycle.” Follow up: “Which steps take the most time in your replenishment cycle?”","Proof of warehouse picking productivity."],["Celio · full-price sell-through","Allocation/replenishment and availability in season. Listed: full-price sell-through 5% above plan.","“Relevant where the goal is availability and full-price selling. The comparison is against plan.” Follow up: “Is your priority availability, full-price selling, markdown reduction, or all three?”","A year-on-year sales increase, or “five percentage points” unless the asset says so."],["Masked sportswear cases","Transfers (rebalancing stock across locations) and markdowns (8.6 percentage-point improvement in sell-through margin).","“We have an anonymised example relevant to this decision. I’ll use the approved version without identifying the brand.”","Unmasking the brand, or claiming all growth came only from software."]],"labels":["Use when · evidence","Talk track","Never use as"]}]},{"h":"Choose the proof","sub":"Pick the story, then reveal.","b":[{"t":"reveal","q":"Repeated supervisor checks slow packing.","a":"<b>Brands For Less</b> supervision story."},{"t":"reveal","q":"Inventory variance harms availability.","a":"<b>GlobalBees</b> accuracy story."},{"t":"reveal","q":"Replenishment decisions take days.","a":"<b>Pepe Jeans.</b>"},{"t":"reveal","q":"Full-price selling is below plan.","a":"<b>Celio</b>, after clarifying the metric."},{"t":"reveal","q":"Blanket outlet discounts reduce margin.","a":"The approved <b>masked markdown</b> case."},{"t":"reveal","q":"ERP connector compatibility is uncertain.","a":"<b>Technical scope evidence</b>, not a revenue case study."}]},{"h":"Repair the unsafe claim","b":[{"t":"table","head":["Unsafe","Safe"],"rows":[["“We integrate with everything.”","“We will validate the exact connector and flows.”"],["“You’ll get the same 79% improvement.”","“That is a documented customer result; your baseline and scope need assessment.”"],["“The competitor can’t handle returns.”","“Let’s compare the specific return workflow using current evidence.”"],["“We can launch before your peak.”","“Implementation must validate dependencies and timing.”"],["“That feature is on the roadmap.”","“Let me confirm the approved current status; it is not a live commitment.”"],["“This saves five staff.”","“We must distinguish increased capacity from confirmed payroll savings.”"]]}]}],"quiz":[{"q":"A prospect’s supervisors re-check every packed order. Which story?","o":["Celio","Brands For Less","Pepe Jeans","Pintola"],"a":1,"w":"The supervision story."},{"q":"Can you say Brands For Less cut headcount by 59%?","o":["Yes","No: it documents 59% less supervision, not headcount"],"a":1,"w":"Never stretch the metric."},{"q":"A prospect doubts our ERP connector. What proof do you use?","o":["A revenue case study","Technical scope evidence","A testimonial","Nothing"],"a":1,"w":"Connector/flow evidence."},{"q":"What is the story structure?","o":["Logo → price → close","Context → Problem → Intervention → Outcome → Relevance → Question","Problem → discount","Demo → contract"],"a":1,"w":"Fixed structure, ending with a question."},{"q":"Celio’s result is measured against…","o":["Last year","Plan","Competitors","Nothing"],"a":1,"w":"5% above plan on full-price sell-through."},{"q":"Repair: “You’ll get the same 79% improvement.”","o":["“Guaranteed.”","“That is a documented customer result; your baseline and scope need assessment.”","“Even more.”","“Maybe.”"],"a":1,"w":"Results don’t transfer automatically."}]},"CX":{"title":"Part C checkpoint","mins":15,"cp":true,"intro":"15 scenario questions across the product family. Pass 80% to unlock Part D.","cards":[{"h":"Part C checkpoint","b":[{"t":"grid","items":[["15 questions","Scenarios that ask you to pick the right product, answer the question, and avoid the wrong claim."],["Pass mark","80% (12 of 15) unlocks Part D."]]}]}],"quiz":[{"q":"A 120-store fashion retailer plans buys in Excel, runs out of winners mid-season and holds big end-of-season sales. Which product family leads?","o":["Omnichannel Fulfilment System","Label software","Self-checkout","AI Planning OS (buying, replenishment, markdown)"],"a":3,"w":"Decision problems across buying, replenishment and markdown."},{"q":"A marketplace-heavy brand cancels orders because stock shown online isn’t really there. Which product leads?","o":["Range architecture","OMS and Channel Management","Markdown","MFP"],"a":1,"w":"One inventory view and under-10-second sync across channels."},{"q":"A food distributor wants batches and FEFO for pallets and doesn’t want to scan every unit. What do you propose?","o":["AI Planning OS","Non-serialized (carton/pallet) WMS, with batch rules validated by a specialist","Endless aisle","Serialized WMS"],"a":1,"w":"Carton/pallet tracking; capture the exact rules for validation."},{"q":"A prospect asks: “Can I keep 30% of stock just for my distributors?”","o":["Only with a new warehouse","No","Yes: map a virtual inventory pool to B2B","Only offline"],"a":2,"w":"Virtual pools split exposure."},{"q":"A planner asks how Increff forecasts a brand-new category. Best answer?","o":["Attribute-based forecasting that rolls up the hierarchy and benchmarks similar products, after a data-readiness check","We guess","We can’t","We copy last year"],"a":0,"w":"Attribute-level comparisons, then assess data."},{"q":"A prospect wants routing by order tag, editing after invoicing, and gate-entry return checks. Which can you confirm?","o":["Only tag routing","None of them as asked: tag routing isn’t confirmed, edits only before invoice, gate checks aren’t supported","All three","Only gate checks"],"a":1,"w":"Three classic do-not-claim items."},{"q":"A brand’s stores have stock but online orders get cancelled. Which capability could help, and what do you check first?","o":["Label software; check printers","Ship from store; first check whether store stock is reliable and eligible","MFP; check budgets","Markdown; check prices"],"a":1,"w":"Store fulfilment depends on reliable store stock."},{"q":"A packing team re-checks every order because of mis-ships. Which WMS capability addresses this?","o":["Markdown","OTB","3D view","Pick scan plus blind pack scan"],"a":3,"w":"Two-step validation catches the wrong item before dispatch."},{"q":"A planner fears losing control to “the AI”. What is accurate?","o":["No approvals exist","Planners are replaced","The AI decides alone","AI agents draft and flag risks; the team approves, sets permissions, and every recommendation is explained"],"a":3,"w":"AI that plans with you, not for you."},{"q":"A prospect wants to keep its own WMS but fix overselling across channels. Can it?","o":["Only with SAP","No, must buy both","Yes: the OMS and channel layer can be bought separately","Only in India"],"a":2,"w":"Products can be bought by use case."},{"q":"Which is the correct reason to ask “orders or pieces?”","o":["It doesn’t matter","For pricing only","For marketing","A 10-item order is 10 picks, so scale and fit depend on pieces, not orders"],"a":3,"w":"Measure volume in the right unit."},{"q":"Stores receive the right recommendations but stock still arrives late. Where do you look?","o":["Forecast model","Markdown","The logo","Execution and replenishment lead time"],"a":3,"w":"Planning logic isn’t the only cause."},{"q":"A prospect asks how much training warehouse staff need. Best answer?","o":["“Exactly 5 minutes.”","“It’s designed to be learned quickly; let’s walk through the real task with your team.”","“Six months.”","“None.”"],"a":1,"w":"Don’t guarantee training times."},{"q":"A retailer wants customers to buy an out-of-stock shirt in store and get it delivered from another location. Which feature?","o":["WSSI","Cross-docking","BORIS","Endless aisle"],"a":3,"w":"Remote catalogue across the network."},{"q":"Which product claim is safe in writing?","o":["“We integrate with everything.”","“Works offline.”","“Zero errors guaranteed.”","“Inventory and orders sync across channels in under 10 seconds.”"],"a":3,"w":"Under 10 seconds is the approved sync figure."}]},"DX":{"title":"Part D checkpoint","mins":10,"cp":true,"intro":"10 scenario questions on industries and customer proof. Pass 80% to unlock the final exam.","cards":[{"h":"Part D checkpoint","b":[{"t":"grid","items":[["10 questions","Pick the industry fit, the right proof and the safe claim."],["Pass mark","80% (8 of 10) unlocks the final exam."]]}]}],"quiz":[{"q":"An eyewear chain sells thousands of frame-lens combinations across 80 stores and online. Which fit?","o":["Carton/pallet WMS only","AI Planning OS plus piece-level WMS","TMS only","Not a fit"],"a":1,"w":"Huge variety, store replenishment, item tracking."},{"q":"A supermarket chain picks online orders from store shelves and checks expiry by eye. What is the closest proof story?","o":["Celio","Pepe Jeans","The Lulu store-fulfilment model","Brands For Less"],"a":2,"w":"Store-as-fulfilment-node with FEFO at the scan."},{"q":"A hypermarket asks whether it must replace SAP to use Increff for store fulfilment.","o":["Only in UAE","Yes","No: SAP stays the source of truth; Increff is the execution layer","Only for dark stores"],"a":2,"w":"No rip-and-replace."},{"q":"A prospect’s replenishment cycle takes four days of planner effort. Which story fits?","o":["GlobalBees","Pepe Jeans","Lulu","Pintola"],"a":1,"w":"Allocation and replenishment effort."},{"q":"A brand asks: “So we’ll get Pintola’s 79% too?”","o":["It’s a documented result for Pintola’s process and baseline; theirs needs assessment","More than 79%","No improvement","Yes"],"a":0,"w":"Results don’t transfer automatically."},{"q":"Which Lulu figures are safe to quote?","o":["Any number in a draft","100 stores live within 2 months; ~2 lakh units a day","Competitor figures","Modelled uplift % from internal decks"],"a":1,"w":"Use only the approved figures."},{"q":"A sportswear brand worries about blanket outlet discounts eating margin. Which proof?","o":["Pepe Jeans","The approved masked markdown case","GlobalBees","No proof needed"],"a":1,"w":"Use the masked case without naming the brand."},{"q":"A colleague says: “The masked case is obviously Brand Y, let’s name it.” You…","o":["Name it only in email","Ask the prospect to guess","Name it","Keep it masked"],"a":3,"w":"Never unmask."},{"q":"An electronics distributor ships to dealers in cartons and needs serial capture for warranty. Which question matters most?","o":["“What’s your size curve?”","“Where must serial identity be captured?”","“What’s your season?”","“How many stores?”"],"a":1,"w":"Serial/warranty capture point drives scope."},{"q":"In what order do you tell a customer story?","o":["Context, problem, intervention, outcome, relevance, then a question","Problem, discount","Outcome only","Logo, price, close"],"a":0,"w":"A fixed structure ending in a question."}]},"X1":{"title":"Final certification exam","mins":40,"exam":true,"intro":"25 questions across the products and industries modules. Score 80% to earn your certificate.","cards":[{"h":"Before you start","b":[{"t":"grid","items":[["25 questions","Scenario questions from Part C (our products) and Part D (industries and proof)."],["Pass mark","80% (20 of 25)."],["Certificate","Pass to unlock your Increff Learning Academy certificate, with your name and date."],["Tip","Use the glossary and the recap pages to revise first. Retake as often as you need."]]}]}],"quiz":[{"q":"“We oversell online.” Which module do you think of first?","o":["Markdown optimisation","OMS","Label software","MFP"],"a":1,"w":"One inventory view across channels is the OMS’s job."},{"q":"“Expiry losses and 20-day cycle counts.” Which module?","o":["WMS, carton/pallet","AI Planning OS","Endless aisle","MFP"],"a":0,"w":"Batches, FEFO and cycle counts are carton/pallet WMS territory."},{"q":"A prospect wants to keep their own forecasting algorithm. What do you say?","o":["Not possible","They can run their own scripts or swap individual algorithm blocks for their own logic","Only Increff models are allowed","Only in Excel"],"a":1,"w":"Algorithm Studio supports their own logic beside ours."},{"q":"“How accurate is your forecast?” Best answer?","o":["“Always 95%.”","“It depends on the client and their history; case studies show 85–90% from month 7, so let’s assess your data first.”","“We don’t measure it.”","“100% after a month.”"],"a":1,"w":"Never promise a figure."},{"q":"A brand launching new categories asks how we forecast without history. Answer?","o":["We can’t","Attribute-based forecasting rolls up the hierarchy and benchmarks against similar products; assess data readiness first","Copy last year","Ask the CEO"],"a":1,"w":"Attribute-level comparisons, then a data-readiness check."},{"q":"Who creates the stock transfer orders after a replenishment recommendation?","o":["AI Planning OS","The ERP","The courier","The POS"],"a":1,"w":"Recommendations are pushed to the ERP, which creates the transfer orders."},{"q":"An online-only brand with no stores asks for AI Planning OS. What should you know?","o":["It’s the perfect fit","It relies on geographic store sales data, so it suits omnichannel brands best","It needs no data","Only for pharma"],"a":1,"w":"Online-only is a weaker fit."},{"q":"A wholesaler wants bulk putaway. Which tracking mode?","o":["Serialized","Non-serialized"],"a":1,"w":"Bulk putaway and bulk return exist only in non-serialized mode."},{"q":"A luxury brand worries a sticker will spoil the product. Answer?","o":["Stickers are mandatory on the item","The code can go on outer packaging, a price tag or a sewn label, and the brand controls placement","We can’t help","Use RFID only"],"a":1,"w":"Placement i
