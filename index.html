ure by channel."},{"q":"Can a client use Increff OMS with their own WMS?","o":["No","Yes: they can be bought separately by use case"],"a":1,"w":"Some clients use only the order layer."},{"q":"“Route orders by tag?”","o":["Yes, standard","Not confirmed: routing uses PIN-code proximity and availability today","Only offline","Only for B2B"],"a":1,"w":"Needs an owner; don’t promise."},{"q":"An invoiced order needs a change. What happens?","o":["Edit freely","Cancel and recreate, then re-scan and repack","Impossible ever","Call the courier"],"a":1,"w":"Edits only before invoicing."},{"q":"What does Vendor Inventory Management let a brand do?","o":["Plan markdowns","Fulfil orders from vendor locations without moving stock into its own warehouse","Run payroll","Replace the ERP"],"a":1,"w":"Direct vendor fulfilment."},{"q":"What should you NOT do with the “1,300+ integrations” figure?","o":["Mention it in the Overview","Use it as proof that their exact system and flows are covered","Know it","Read it"],"a":1,"w":"Always confirm the exact connector and flows."}]},"C7":{"title":"Store & omnichannel","mins":12,"intro":"Turning stores into fulfilment hubs and shopping nodes.","cards":[{"h":"Ship from store","b":[{"t":"grid","items":[["Shop beyond shelves","Stores become omnichannel centres handling walk-ins, pickups, online orders, endless-aisle browsing and returns."],["Real-time, mobile-first","Inventory synced across channels; staff use mobile, scan-based workflows and single-screen order processing."],["Intelligent routing","Orders go automatically to the nearest store, dark store or warehouse, based on real-time stock, order type and promised SLA."]]}]},{"h":"BOPIS and BORIS","b":[{"t":"grid","items":[["Flexible buy & collect","Customers buy online and pick up at any store, with click-and-collect routed to the nearest location based on live stock and pickup availability."],["In-store returns","Online purchases returned or exchanged at any store, with pre-set refund, grading and stock re-entry steps."]]}]},{"h":"Endless aisle and self-checkout","b":[{"t":"grid","items":[["Remote catalogue","Customers browse and buy out-of-stock or off-location items on their phone."],["Network-wide visibility","See what is available, where and at what price, in real time."],["Compliance-safe pricing","Prices and promotions synced so customers see accurate pricing at the point of sale."],["Scan-and-go checkout","Customers scan, check prices and pay on their phones."],["Security clearance","Scan-verified exit approval on successful payment."],["Free up counters","Less load on billing counters, so staff focus on customers and shelves."]]}]},{"h":"Questions to ask, and limits","b":[{"t":"chips","items":["Is store stock reliable?","Who picks and packs in the store?","How are walk-in sales protected?","What are the accept/reject rules?","What happens when a store can’t fulfil?"]},{"t":"tip","x":"Confirm the live feature list for each journey before promising it. Store inventory management (backroom vs floor, store receiving) is a different need from ship-from-store: route the meeting accordingly."}]}],"quiz":[{"q":"A customer buys online and returns the item at a store. What is this?","o":["BOPIS","BORIS","Endless aisle","Cross-docking"],"a":1,"w":"Buy online, return in store."},{"q":"Which feature lets a customer buy an item not stocked in this store?","o":["Endless aisle","Self-checkout","BOPIS","Label software"],"a":0,"w":"Remote catalogue across the network."},{"q":"Ship from store routes orders based on…","o":["Random choice","Real-time stock, order type and promised SLA","Staff preference","Price only"],"a":1,"w":"Intelligent routing."},{"q":"A retailer’s real problem is store receiving and backroom stock. Is that ship-from-store?","o":["Yes","No: it’s a store inventory management need; route accordingly"],"a":1,"w":"A classic mis-routed demo."},{"q":"What does scan-and-go do?","o":["Prints labels","Lets customers scan and pay on their phones","Counts stock","Routes couriers"],"a":1,"w":"Self-checkout."}]},"D1":{"title":"Industry use cases","mins":15,"intro":"What each industry struggles with, which products fit, and what to ask.","cards":[{"h":"Fashion, footwear and lifestyle","b":[{"t":"tabs","items":[["Apparel & fashion","Many stores and SKUs, seasonal collections, size-specific stock-outs, returns, Excel planning, marketplace overselling.","AI Planning OS (allocation, replenishment, markdown) + piece-level WMS + OMS / store fulfilment.","Are stock-outs size-specific? How are winners replenished? How much planning happens in Excel?"],["Footwear & sportswear","Size curves and broken size runs, residual stock, high online returns, stock spread across stores and marketplaces.","AI Planning OS + piece-level WMS + OMS / store fulfilment.","How do you identify incomplete assortments? Where do returns go?"],["Jewellery","High value per piece, attributes, item-level traceability, stock across many counters or stores.","AI Planning OS + piece-level WMS.","Which controls and item identifiers are mandatory?"],["Eyewear","Huge SKU variety (frames × lenses), store replenishment, online + store orders.","AI Planning OS + piece-level WMS.","How do you replenish stores across so many variants?"],["Fashion accessories","Small, high-SKU items, D2C and marketplace orders.","Piece-level WMS + OMS.","How many orders a day, across which channels?"]],"labels":["What they struggle with","Products that fit","Ask"]}]},{"h":"Beauty, home and general merchandise","b":[{"t":"tabs","items":[["Beauty & cosmetics","Batches and expiry, gift sets / kits, many small SKUs, channel-specific shelf-life rules.","AI Planning OS + WMS (piece-level or carton/pallet).","What remaining shelf life does each channel require? (FEFO, batches and bundles need validation.)"],["Home décor & furnishing","Slow-moving items, bulky goods, one product in several boxes (kitting), long lead times.","AI Planning OS + piece-level WMS.","Is fulfilment limited by stock, components or delivery?"],["Sporting goods & toys","Seasonal peaks, many SKUs, stores plus marketplaces.","Piece-level WMS; AI Planning OS, qualify carefully.","What changes at peak?"],["Department stores & multi-brand","Many brands and categories, Excel allocation, online orders from stores.","OMS / store fulfilment; AI Planning OS, qualify carefully.","How is allocation done across brands?"],["Books & stationery","Very large SKU counts in one big warehouse.","WMS.","How many SKUs, and how are they located?"]],"labels":["What they struggle with","Products that fit","Ask"]}]},{"h":"Distribution, FMCG, pharma and electronics","b":[{"t":"tabs","items":[["FMCG / food & beverage (distributor side)","Batches, FEFO / expiry, pallets, long cycle counts, distributor orders.","Carton/pallet WMS (piece-level for B2C).","Which units are bought, stored and dispatched? How long do cycle counts take?"],["Pharma & healthcare distribution","Batch and expiry compliance, recalls.","WMS (piece-level or carton/pallet). Not qualified if B2B-only.","What are the batch/recall requirements?"],["Electronics & appliances","Serial numbers and warranty, bundles, return verification, dealer / B2B dispatch.","WMS (piece-level or carton/pallet).","Where must serial identity be captured?"],["Spare parts","Large SKU counts, cartons, dealer dispatch.","Carton/pallet WMS.","How do dealer orders reach the warehouse?"],["Hypermarkets & supermarkets","Online orders picked from the store floor, express and slotted delivery, fresh produce, expiry.","WMS for store fulfilment (see the Lulu model).","How are online orders picked today, and how long does a pick take?"]],"labels":["What they struggle with","Products that fit","Ask"]}]},{"h":"Operating model changes everything","b":[{"t":"p","x":"Always identify the operating model as well as the industry: <b>D2C, store-led, wholesale/B2B, marketplace seller, 3PL or mixed</b>. A carton-based distributor and a piece-pick D2C brand need different discovery even in the same industry."},{"t":"tip","x":"An industry use case is not permission to sell every product everywhere. Follow the ICP and region-product guidance in Part F."}]}],"quiz":[{"q":"A footwear retailer’s stores keep running out of mid sizes. Which product area?","o":["AI Planning OS (size curves, allocation)","Label software only","TMS","Self-checkout"],"a":0,"w":"Broken size runs are a planning problem."},{"q":"A food distributor has 20-day cycle counts and expiry losses. Which product?","o":["Carton/pallet WMS","Endless aisle","MFP","Ship from store"],"a":0,"w":"Batches, FEFO and cycle counts."},{"q":"A pharma company supplies only hospitals. Qualified?","o":["Yes","No: B2B-only pharma is not qualified"],"a":1,"w":"Disqualifier."},{"q":"Which question fits an electronics prospect?","o":["“Where must serial identity be captured?”","“What is your size curve?”","“How long is your season?”","“Which fabrics?”"],"a":0,"w":"Serial and warranty tracking."},{"q":"Two shoe businesses: one ships pallets to dealers, one ships single parcels to consumers. Same discovery?","o":["Yes, same industry","No: operating model and unit change the discovery"],"a":1,"w":"Carton-based vs piece-pick."}]},"D2":{"title":"The Lulu supermarket model","mins":15,"intro":"How a hypermarket turned its stores into fulfilment hubs with Increff, and how to spot the next one.","cards":[{"h":"The problem: stores that are also warehouses","b":[{"t":"p","x":"When online orders are picked from the same shelves walk-in customers shop, everything that was invisible becomes expensive. Hypermarkets don’t have a warehouse problem; they have a <b>store-as-fulfilment-node</b> problem."},{"t":"table","head":["Symptom","What it costs","How Increff solves it"],"rows":[["Ghost inventory: one pool for walk-in and online; stock moves without the system knowing","Pickers can’t find items, orders go out short","Inventory down to shelf, bay and aisle; the ERP stays the source of truth while Increff knows where stock physically is"],["High “not found” rates","Picker time wasted searching; premature cancellations","A self-learning SKU-to-shelf map, plus alternative-location prompts in the app"],["No pick-path optimisation","Low items per hour; missed express windows","AI pick paths from store layout, order contents and pick history, aware of temperature zones"],["Manual substitution by phone","Minutes lost per substitution; abandoned orders","Suggested alternatives approved by the customer in-app, on WhatsApp or by auto-call"],["No batch / expiry control at the scan","Regulatory exposure from a single expired item","FEFO enforced at pick time; expired batches blocked before scanning"],["Fragmented apps","Duplicate training and integrations","One picker app for express, scheduled, courier, click-and-collect and made-to-order, in English and Arabic"]]}]},{"h":"What Increff runs","b":[{"t":"grid","items":[["Execution layer","Picking, packing and drop-zone execution across store zones (ambient, chiller, fruit & veg, butcher)."],["Fits the existing stack","Orders flow in from the retailer’s OMS; SAP remains the inventory source of truth. No rip-and-replace."],["One integration to delivery","A logistics aggregator / TMS integration for rider assignment and scan-based handover."],["Bag IDs","Bag IDs mapped to multi-bag express orders; store managers audit not-found cases."],["All delivery modes","Quick (express) and slotted deliveries, with substitution and catch-weight as later phases, then dark stores."]]}]},{"h":"The proof","b":[{"t":"stats","items":[["100","supermarket stores live within 2 months of go-live"],["~2 lakh","units processed per day"]]},{"t":"grid","items":[["How it rolled out","Two pilot stores first, then store by store and country by country across the GCC."],["Remote go-lives","A store went live with no Increff team on the ground. Store onboarding became remote and repeatable, which is what makes a 100+ store rollout realistic."],["Speed is the differentiator","A phased model: pilot stores live first, prove the numbers, then scale. Configuration, not code, for zones, waves and scan rules."]]},{"t":"tip","x":"Use only these figures. Modelled uplift percentages from internal decks are targets, not audited results, so don’t quote them."}]},{"h":"Spotting the next Lulu","b":[{"t":"grid","items":[["Who","Hypermarket, supermarket and grocery chains with a large store network, where walk-in and online orders come from the same store floor."],["Signals","Express + scheduled + courier delivery from stores · pickers hunting aisles · substitutions by phone · expiry checked by eye · two or more picking apps · quick-commerce or dark-store ambitions."],["Ask","“How are online orders picked today, and how long does a pick take?” · “What happens when an item isn’t found?” · “How do you handle substitutions and expiry?”"]]},{"t":"reveal","q":"A hypermarket asks: “Do we have to replace SAP?”","a":"<b>No.</b> SAP stays the source of truth for inventory and finance. Increff plugs in as the execution layer for store fulfilment."}]}],"quiz":[{"q":"What is a hypermarket’s core fulfilment problem?","o":["Not enough warehouses","Stores acting as fulfilment nodes for online orders","No ERP","No marketing"],"a":1,"w":"Store-as-fulfilment-node."},{"q":"How many Lulu stores went live within 2 months of go-live?","o":["6","20","100","1,000"],"a":2,"w":"100 supermarket stores."},{"q":"About how many units a day are processed?","o":["~2,000","~20,000","~2 lakh","~2 crore"],"a":2,"w":"~2 lakh units a day."},{"q":"Does the retailer have to replace SAP?","o":["Yes","No: SAP stays the source of truth; Increff is the execution layer"],"a":1,"w":"No rip-and-replace."},{"q":"What made a 100+ store rollout realistic?","o":["Flying consultants to every store","Remote, repeatable store onboarding","Replacing SAP","Building a new ERP"],"a":1,"w":"A store went live with no Increff team on site."},{"q":"Which figures should you NOT quote?","o":["100 stores in 2 months","~2 lakh units a day","Modelled uplift percentages from internal decks"],"a":2,"w":"They are targets, not audited results."}]},"D3":{"title":"Customer proof: choosing and telling the story","mins":15,"intro":"Choose the story by fit, tell it in a fixed structure, and never stretch the numbers.","cards":[{"h":"How to choose and tell a story","b":[{"t":"grid","items":[["Selection method","Problem → relevant solution → operating model → scale / region → credible evidence. Use proof after understanding the issue; don’t lead every answer with a logo."],["Story structure","Context → Problem → Relevant intervention → Documented outcome → Relevance → Question."],["Before external use","Use the current approved asset and confirm exact metric wording, measurement, period and permission. Don’t invent details. No unmasking; no moving metrics between stories."]]}]},{"h":"Six case cards","sub":"Click a case.","b":[{"t":"tabs","items":[["GlobalBees · warehouse accuracy","D2C brand-house operations; the concern is inventory control across a growing fulfilment operation. Listed: 99.9% inventory accuracy.","“GlobalBees is a relevant reference for inventory accuracy. The useful question is how you measure the gap today and which workflow causes it.” Follow up: “How is your inventory accuracy measured, and where does variance enter?”","A guarantee of 99.9% everywhere, or a planning outcome. Inventory accuracy ≠ order accuracy or SLA."],["Brands For Less · supervision","Off-price fashion retail with operational complexity. Listed: 59% less supervision.","“Relevant when repeated supervision and checking consume capacity. Which checks does your team perform, and why?”","A 59% headcount reduction or a universal cost saving."],["Pintola · processing time","Non-fashion D2C food brand. Listed: 79% reduction in order processing time.","“The reduction relates to its process and baseline. Let’s define where processing begins and ends.” Follow up: “Are you measuring order processing, dispatch lead time, or delivery time?”","A 79% delivery-time reduction or a promise of repeatable results."],["Pepe Jeans · allocation effort","Apparel inventory decisions and planning workload. Listed: 3+ days saved per cycle and 85–90% stock utilisation (verify approved wording).","“Relevant when allocation and replenishment consume planning effort. Let’s compare it with your cycle.” Follow up: “Which steps take the most time in your replenishment cycle?”","Proof of warehouse picking productivity."],["Celio · full-price sell-through","Allocation/replenishment and availability in season. Listed: full-price sell-through 5% above plan.","“Relevant where the goal is availability and full-price selling. The comparison is against plan.” Follow up: “Is your priority availability, full-price selling, markdown reduction, or all three?”","A year-on-year sales increase, or “five percentage points” unless the asset says so."],["Masked sportswear cases","Transfers (rebalancing stock across locations) and markdowns (8.6 percentage-point improvement in sell-through margin).","“We have an anonymised example relevant to this decision. I’ll use the approved version without identifying the brand.”","Unmasking the brand, or claiming all growth came only from software."]],"labels":["Use when · evidence","Talk track","Never use as"]}]},{"h":"Choose the proof","sub":"Pick the story, then reveal.","b":[{"t":"reveal","q":"Repeated supervisor checks slow packing.","a":"<b>Brands For Less</b> supervision story."},{"t":"reveal","q":"Inventory variance harms availability.","a":"<b>GlobalBees</b> accuracy story."},{"t":"reveal","q":"Replenishment decisions take days.","a":"<b>Pepe Jeans.</b>"},{"t":"reveal","q":"Full-price selling is below plan.","a":"<b>Celio</b>, after clarifying the metric."},{"t":"reveal","q":"Blanket outlet discounts reduce margin.","a":"The approved <b>masked markdown</b> case."},{"t":"reveal","q":"ERP connector compatibility is uncertain.","a":"<b>Technical scope evidence</b>, not a revenue case study."}]},{"h":"Repair the unsafe claim","b":[{"t":"table","head":["Unsafe","Safe"],"rows":[["“We integrate with everything.”","“We will validate the exact connector and flows.”"],["“You’ll get the same 79% improvement.”","“That is a documented customer result; your baseline and scope need assessment.”"],["“The competitor can’t handle returns.”","“Let’s compare the specific return workflow using current evidence.”"],["“We can launch before your peak.”","“Implementation must validate dependencies and timing.”"],["“That feature is on the roadmap.”","“Let me confirm the approved current status; it is not a live commitment.”"],["“This saves five staff.”","“We must distinguish increased capacity from confirmed payroll savings.”"]]}]}],"quiz":[{"q":"A prospect’s supervisors re-check every packed order. Which story?","o":["Celio","Brands For Less","Pepe Jeans","Pintola"],"a":1,"w":"The supervision story."},{"q":"Can you say Brands For Less cut headcount by 59%?","o":["Yes","No: it documents 59% less supervision, not headcount"],"a":1,"w":"Never stretch the metric."},{"q":"A prospect doubts our ERP connector. What proof do you use?","o":["A revenue case study","Technical scope evidence","A testimonial","Nothing"],"a":1,"w":"Connector/flow evidence."},{"q":"What is the story structure?","o":["Logo → price → close","Context → Problem → Intervention → Outcome → Relevance → Question","Problem → discount","Demo → contract"],"a":1,"w":"Fixed structure, ending with a question."},{"q":"Celio’s result is measured against…","o":["Last year","Plan","Competitors","Nothing"],"a":1,"w":"5% above plan on full-price sell-through."},{"q":"Repair: “You’ll get the same 79% improvement.”","o":["“Guaranteed.”","“That is a documented customer result; your baseline and scope need assessment.”","“Even more.”","“Maybe.”"],"a":1,"w":"Results don’t transfer automatically."}]},"E1":{"title":"Competition: how buyers compare","mins":12,"intro":"Ask how they compare before you position. Never badmouth anyone.","cards":[{"h":"Who comes up on our calls","b":[{"t":"table","head":["Alternative","Mentions in our first and second calls"],"rows":[["Unicommerce","162 (in use at 103 of those organisations)"],["SAP","65"],["Blue Yonder","26"],["EasyEcom","19"],["Oracle","19"],["Odoo","17"],["Manhattan","13"],["Vinculum","12"]]},{"t":"p","x":"Source: our analysis of 1,243 first and second calls with 968 organisations. Counts are AI-extracted and approximate."}]},{"h":"Ask before you position","b":[{"t":"chips","items":["What works well today?","Which alternatives are you considering?","Which capability is essential?","What evidence would establish fit?","What are the total implementation and operating dependencies?","Who signs off business and technical fit?"]},{"t":"grid","items":[["Rules","Never badmouth a competitor or a customer. Ask what isn’t working today before positioning. Internal battle notes are orientation, not a verified feature audit."],["“They have the same features”","“Feature lists may overlap. Let’s identify two or three scenarios that matter in your operation and have each option demonstrate them.”"]]}]},{"h":"Scenarios to propose","b":[{"t":"grid","items":[["Split stock","One order with stock at several eligible nodes."],["Disputed return","A return needing verification and a status update."],["Size imbalance","A winning size out of stock in one store and excess elsewhere."],["Integration failure","An integration failure that needs recovery."],["New product","A replenishment decision for a product with little history."]]},{"t":"tip","x":"Presales confirms which scenarios Increff can demonstrate and where a partner or the current system takes part."}]},{"h":"Safe or unsafe?","sub":"Decide, then reveal.","b":[{"t":"reveal","q":"“Unicommerce orders never sync properly.”","a":"<b>Unsafe.</b> No blanket “never syncs” or superiority claims."},{"t":"reveal","q":"“Our win rate against Vinculum is 70%, so we’ll fit you.”","a":"<b>Unsafe.</b> A win rate is not proof of individual fit."},{"t":"reveal","q":"“Blue Yonder is always more expensive and slower.”","a":"<b>Unsafe.</b> Don’t claim enterprise suites are always slower or dearer. No competitor pricing as universal fact."},{"t":"reveal","q":"“Could you share the competitor’s proposal with us?”","a":"<b>Unsafe.</b> Never request confidential third-party material."},{"t":"reveal","q":"“Which return workflow matters most? Let’s have both options demonstrate it.”","a":"<b>Safe.</b> Compare on scenarios, using current evidence."},{"t":"reveal","q":"“Tally is a basic ERP, so you may need an execution layer alongside it.”","a":"<b>Safe</b>, if said neutrally."},{"t":"reveal","q":"“That competitor had a warehouse fire, you know.”","a":"<b>Unsafe.</b> Never disparage a competitor. Don’t repeat incidents you heard on calls."},{"t":"reveal","q":"“That industry case means we can sell you every product in your region.”","a":"<b>Unsafe.</b> Follow region-product and qualification guidance."}]}],"quiz":[{"q":"Which alternative comes up most on our calls?","o":["SAP","Unicommerce","Manhattan","Odoo"],"a":1,"w":"Unicommerce: 162 mentions."},{"q":"“They have the same features.” Best response?","o":["“Ours are better.”","“Let’s pick two or three scenarios that matter to you and have each option demonstrate them.”","“They’re cheap for a reason.”","“Let me see their proposal.”"],"a":1,"w":"Compare on scenarios."},{"q":"Is “Our win rate against them is 70%” a good argument?","o":["Yes","No: a win rate doesn’t prove fit for this prospect"],"a":1,"w":"Unsafe."},{"q":"What do you ask before positioning against a competitor?","o":["Their price","What works well today and what isn’t working","Their staff names","Nothing"],"a":1,"w":"Ask before you position."},{"q":"A prospect offers to forward a competitor’s proposal. You…","o":["Accept it","Politely decline: no confidential third-party material","Ask for two","Share ours too"],"a":1,"w":"Never request or use it."}]},"E2":{"title":"The alternatives you’ll meet","mins":15,"intro":"What to know about each alternative, the question to ask, and the line not to cross.","cards":[{"h":"Warehouse, order and channel alternatives","sub":"Click an alternative.","b":[{"t":"tabs","items":[["Unicommerce","A commonly encountered incumbent in Indian omnichannel.","Which current workflow needs to improve? Can both options demonstrate it?","No blanket “orders never sync” or superiority claim."],["EasyEcom","A multichannel inventory / warehouse alternative.","Which peak, returns and accuracy requirements drive the choice?","No unverified price, capacity or missing-feature assertions."],["Vinculum","OMS/WMS within a broader omnichannel evaluation.","Which OMS and B2B/B2C workflows are essential?","Clarify the exact module; don’t compare whole suites loosely."],["SAP / Dynamics / Infor","An existing ERP investment can motivate standardisation.","What is covered today, and what happens outside it?","Respect the ERP preference; connector scope needs validation."],["Manhattan / enterprise suites","Enterprise scope, architecture and formal evaluation may dominate.","Which use cases and geographies are in scope?","Don’t claim they are always slower or more expensive."],["3PL’s own WMS","The alternative may be an operating partner’s system, not a purchased product.","What data access, portability and accountability do you need?","Adoption and contractual rights can’t be assumed."],["Local / regional WMS","Local relationships, simple scope and cost may be compelling.","What does the all-in scope include, and how will fit be proven?","No assumptions from vendor size alone."],["Odoo / Zoho / Tally","Fine at small scale; Tally is a basic ERP.","What happens outside the ERP today?","Say it neutrally: an execution layer can sit alongside."]],"labels":["What to know","Ask","Boundary"]}]},{"h":"Planning alternatives","b":[{"t":"tabs","items":[["Excel / in-house","Flexible and familiar; assess effort, consistency and scalability.","How long does the decision cycle take, and what errors or constraints remain?"],["ERP planning","Some planning may be covered; find the work done outside it.","How much allocation happens outside the ERP?"],["SymphonyAI","A retail planning / AI alternative; an incumbent relationship may matter.","Which capability works well, and which gap remains?"],["Blue Yonder","Enterprise retail / supply-chain suite.","Which module is being evaluated, and what defines success?"],["o9","Enterprise planning; the exact scope must be understood.","Which planning decisions and data requirements are in scope?"],["Nextail","A retail planning alternative.","Which assortment, allocation or replenishment scenarios must be proven?"],["RELEX and other specialists","Don’t improvise a detailed comparison without current evidence.","Which module is under review, and can our specialist assess it?"]],"labels":["What to know","Ask"]}]},{"h":"Positioning that stays safe","b":[{"t":"grid","items":[["Against a cheaper tool","Compare scope, not price: under-10-second sync, near-zero buffer exposure, B2B + B2C in one flow, and the cost of overselling and cancellations."],["Against an ERP that’s just gone live","Don’t push a WMS replacement. Position Increff as an execution layer plus planning; if WMS isn’t an opening, pivot to planning and forecasting."],["Against Excel / zero cost","Quotes will be compared with zero. Quantify errors and mis-picks and discuss change management. Be honest if we haven’t handled their exact starting point before."],["Against enterprise suites","Compare on scenarios and implementation speed with evidence, not on reputation."]]}]}],"quiz":[{"q":"A prospect uses their 3PL’s own WMS. What do you ask?","o":["Their 3PL’s price","What data access, portability and accountability they need","For the 3PL’s staff list","Nothing"],"a":1,"w":"Adoption rights can’t be assumed."},{"q":"A prospect just went live on SAP. Best approach?","o":["Push a WMS replacement","Position Increff as an execution layer plus planning; pivot to planning if WMS isn’t an opening","Walk away forever","Criticise SAP"],"a":1,"w":"Respect the ERP investment."},{"q":"A planner says “Excel works for us, it’s free.” What do you do?","o":["Mock Excel","Ask how long the decision cycle takes and what errors remain","Offer it free","End the call"],"a":1,"w":"Assess effort, consistency and scalability."},{"q":"A prospect is evaluating o9. What do you ask?","o":["“Which planning decisions and data are in scope?”","“Why o9?”","“Did you see their pricing?”","Nothing"],"a":0,"w":"Understand the exact scope."},{"q":"Is it OK to say “Manhattan is always slower”?","o":["Yes","No"],"a":1,"w":"No “always” claims about competitors."}]},"E3":{"title":"Objection handling: LAER+","mins":15,"intro":"Diagnose the real concern before you answer it.","cards":[{"h":"What an objection really is","b":[{"t":"table","head":["Type","Meaning","Example"],"rows":[["Question","They need an explanation.","“How does your sync with the marketplace work?”"],["Misunderstanding","Their interpretation is incorrect or incomplete.","“So you’ll replace our ERP, right?”"],["Concern","They perceive a risk.","“Migrating before our sale season worries us.”"],["Constraint","Budget, timing, architecture or authority genuinely limits action.","“Our budget is frozen until next financial year.”"],["Mismatch","A required capability is unavailable.","“Our warehouse must run fully offline.”"],["Low priority","No compelling reason to change now.","“Things are fine. No reason to change.”"]]},{"t":"tip","x":"Don’t assume “too expensive” means “needs a discount”, or “we already have a system” means “needs competitive persuasion”."}]},{"h":"What our call data says","b":[{"t":"stats","items":[["~1,400","objections across our first two calls"],["~50%","not fully resolved on the call"],["~64%","of pricing objections unresolved"],["~58%","of integration objections unresolved"]]},{"t":"table","head":["Theme","Raised","Not fully resolved"],"rows":[["Business process alignment","534","268"],["Pricing and cost","242","155"],["Product feature limitations","180","89"],["Implementation and timeline","121","54"],["Technical integration","108","63"],["UX and adoption","38","18"],["Contract and terms","36","15"],["Legal and compliance","25","15"],["Service and support","24","8"]]},{"t":"p","x":"Where reps lose ground: <b>pricing without context</b>, <b>over-promising</b> on category experience or timelines, and <b>leaving integration questions unanswered</b>."}]},{"h":"LAER+: six steps","b":[{"t":"steps","items":[["Listen","Let them finish. Reflect the exact concern."],["Acknowledge","Recognise it without confirming an unverified fact. “That is a valid consideration” is safer than “Yes, the competitor is always cheaper.”"],["Explore","Ask a focused question to find the cause."],["Reframe","Explain the relevant trade-off or capability; use evidence only if it addresses this concern."],["Check","“Have I addressed that, or is another part unresolved?”"],["Advance","Offer the right validation, commercial review, proof step, later follow-up, or qualify out. Don’t force a meeting where there is no fit."]]}]},{"h":"Watch it work: “Your proposal will be expensive”","b":[{"t":"table","head":["Who","Says","Step"],"rows":[["Customer","“Your proposal will be expensive.”",""],["Rep","“The investment should be justified. Is the concern the available budget, a comparison with your current system, or uncertainty about the value?”","Acknowledge + Explore"],["Customer","“We are not convinced that moving improves anything.”",""],["Rep","“Then price negotiation would be premature. Let’s return to the peak verification problem you described. What is its current impact, and what evidence would show a different approach is worthwhile?”","Reframe"],["Customer","“We would need to see fewer checks without more errors.”",""],["Rep","“That gives us a useful evaluation criterion. We can ask Sales and Presales to demonstrate the verification workflow and agree how to assess it. Would that address the value concern?”","Check + Advance"]]},{"t":"tip","x":"Clarifying turned the response from discounting into proof of operational improvement."}]},{"h":"Clarify before you answer","sub":"One neutral question each. No rebuttals.","b":[{"t":"reveal","q":"“Too expensive.”","a":"“Which component, and compared with what?”"},{"t":"reveal","q":"“We already have it.”","a":"“Which capability is already covered, and what gap remains?”"},{"t":"reveal","q":"“It won’t integrate.”","a":"“Which exact flow or system compatibility concerns you?”"},{"t":"reveal","q":"“AI won’t understand us.”","a":"“Which decision is complex, and what evidence would establish trust?”"},{"t":"reveal","q":"“Just send a deck.”","a":"“Which issue or audience should the material address?”"}]}],"quiz":[{"q":"“Our warehouse must run fully offline.” What type of objection?","o":["Question","Mismatch","Low priority","Misunderstanding"],"a":1,"w":"A required capability is unavailable."},{"q":"“So you’ll replace our ERP, right?” What type?","o":["Misunderstanding","Constraint","Concern","Mismatch"],"a":0,"w":"Their interpretation is incorrect."},{"q":"What does the “+” in LAER+ add?","o":["Discount and close","Check and Advance","Price and pitch","Nothing"],"a":1,"w":"Check the concern is resolved, then advance."},{"q":"Which acknowledgement is safest?","o":["“Yes, the competitor is always cheaper.”","“That is a valid consideration.”","“You’re wrong.”","“Everyone says that.”"],"a":1,"w":"Acknowledge without confirming unverified facts."},{"q":"Which objection theme is least often resolved?","o":["Service and support","Pricing and cost (~64% unresolved)","UX","Contract"],"a":1,"w":"Pricing, then integration."},{"q":"Best clarifier for “It won’t integrate”?","o":["“It will.”","“Which exact flow or system compatibility concerns you?”","“We integrate with everything.”","“Ask IT.”"],"a":1,"w":"Find the specific flow."}]},"E4":{"title":"Objection cards: business","mins":15,"intro":"The eight business objections we hear most. Answer each in 60 seconds with LAER+, then reveal.","cards":[{"h":"Price and alternatives","b":[{"t":"reveal","q":"<b>1.</b> “Your price is too high.”","a":"<b>It may mean:</b> affordability, unclear value, implementation fee, minimum commitment, variable rate, or a non-comparable scope. <b>Explore:</b> “Which component is difficult? Compared with what scope? Is there a hard budget ceiling? What improvement would make evaluation worthwhile?” <b>Respond:</b> “We should compare the scope and the business problem, not defend a price in isolation. If it’s unaffordable at your scale, that’s important to know early. If value is unclear, let’s assess it on your own inputs.” <b>Advance:</b> Sales-led commercial or value review; nurture if appropriate. <b>Avoid:</b> automatic discounts, invented payback, unapproved pilots, “we are premium”. Never quote on a first call."},{"t":"reveal","q":"<b>2.</b> “Another vendor is cheaper.”","a":"<b>Explore:</b> “What is included in that comparison? Which workflows are non-negotiable? Are integrations, support and implementation included?” <b>Respond:</b> “A lower price can be the right choice if it meets your requirements. Let’s establish the workflows and total scope so you can compare fairly.” <b>Advance:</b> common evaluation scenarios and a Sales review. <b>Avoid:</b> stating competitor prices as fact, asking for confidential material, or claiming superiority without evidence."},{"t":"reveal","q":"<b>3.</b> “We are happy with our current system.” (our largest objection category)","a":"<b>Explore:</b> “What works well? What still happens outside it? What changes at peak? What future requirement is difficult?” Ask about errors, sync delays and seasonal peaks. <b>Respond:</b> “There may be no reason to replace something that meets your needs. If there’s a specific gap, let’s assess that gap without assuming a full replacement.” <b>Advance:</b> a focused gap assessment or a respectful close; if they truly don’t need a WMS, pivot to planning. <b>Avoid:</b> creating artificial dissatisfaction."},{"t":"reveal","q":"<b>4.</b> “Excel works; our planners know the business.”","a":"<b>Explore:</b> decision-cycle time, manual data preparation, exception detection, consistency, expansion, dependence on key people. <b>Respond:</b> “The planners’ expertise is valuable. The question is whether the process gives them the speed, visibility and capacity they need. Where does time go that could be better used on decisions?” Present it as decision support with approvals. <b>Proof:</b> the Pepe Jeans planning story. <b>Avoid:</b> “software knows better than your team”."}]},{"h":"Build, timing, deck, pricing model","b":[{"t":"reveal","q":"<b>5.</b> “We will build it internally.”","a":"<b>Explore:</b> desired ownership, funded team, deadline, progress so far, maintenance burden, which gap remains. <b>Respond:</b> “An internal build may make sense. Let’s compare what you want to own, the delivery requirements and the capabilities already available.” <b>Advance:</b> a scoped comparison if invited; otherwise a future checkpoint. <b>Avoid:</b> predicting failure or inventing development costs."},{"t":"reveal","q":"<b>6.</b> “Not now: peak season / other projects / an SAP go-live.”","a":"<b>Explore:</b> is it low priority, or is the cutover timing unsafe? What would change this? <b>Respond:</b> “We shouldn’t jeopardise peak operations. We can separate evaluation from implementation, or reconnect for your next feasible window.” <b>Advance:</b> a customer-agreed trigger or date. Don’t push: offer a tailored deck, an informal coffee, or a later date. <b>Avoid:</b> guaranteed deadlines or manufactured urgency."},{"t":"reveal","q":"<b>7.</b> “Send a deck / pricing first, then we’ll see a demo.”","a":"<b>Explore:</b> purpose, audience and scope, in one or two questions. <b>Respond:</b> “Happy to share the relevant material. Which issue should it help the team evaluate?” <b>Advance:</b> fulfil the request and suggest a follow-up without making it a condition. Pricing goes through Sales, who can share a budgetary range based on volume. <b>Avoid:</b> sending the whole catalogue, or withholding material to force a call."},{"t":"reveal","q":"<b>8.</b> “This pricing model doesn’t suit us / can we get a flat fee or a discount?”","a":"<b>Explore:</b> predictability, seasonality, variable-cost exposure, procurement policy or total spend. <b>Respond:</b> “Let’s capture the concern and have Sales confirm the approved options and terms in writing.” <b>Advance:</b> commercial review. <b>Avoid:</b> new pricing structures, discount percentages, caps or escalation claims without approval. Escalate rather than improvise."}]}],"quiz":[{"q":"“Your price is too high.” What is your first move?","o":["Offer 10% off","Explore: which component, and compared with what scope?","Say we are premium","End the call"],"a":1,"w":"Diagnose before responding."},{"q":"“We’re happy with our current system.” Best response?","o":["“You shouldn’t be.”","“There may be no reason to replace it; if there’s a specific gap, let’s assess that gap.”","“Everyone switches to us.”","Send a deck"],"a":1,"w":"Don’t create artificial dissatisfaction."},{"q":"“We’ll build it ourselves.” What do you avoid?","o":["Asking about their team","Predicting their failure","A future checkpoint","A scoped comparison"],"a":1,"w":"Never predict failure or invent costs."},{"q":"“Not now, we have an SAP go-live.” Best move?","o":["Push harder","Offer a later date or informal catch-up, tied to a trigger","Offer a discount","Disqualify forever"],"a":1,"w":"Don’t push; agree a trigger or date."},{"q":"“Send me pricing first.” What do you do?","o":["Quote a figure yourself","Route pricing through Sales (a budgetary range by volume) and ask which issue it should address","Refuse","Send the full price list"],"a":1,"w":"Pricing goes through the commercial owner."},{"q":"A prospect asks for a flat fee. You…","o":["Agree","Capture it and have Sales confirm approved options in writing","Invent a cap","Offer 20%"],"a":1,"w":"Escalate, don’t improvise."}]},"E5":{"title":"Objection cards: product, technical and change","mins":20,"intro":"Fifteen product and technical objections, from systems to scale.","cards":[{"h":"Systems and integration","b":[{"t":"reveal","q":"<b>9.</b> “We can’t replace our ERP / WMS.” “We just implemented SAP.”","a":"<b>Explore:</b> which system must remain? Which gap needs fixing? Who owns inventory and each order step? <b>Respond:</b> “Let’s separate the capability you need from the systems you must keep. Coexistence and integration scope must be validated for your architecture.” <b>Advance:</b> stack and flow review with IT and Presales. If WMS isn’t an opening, pivot to planning. <b>Avoid:</b> “no change will be required” or “we replace everything”."},{"t":"reveal","q":"<b>10.</b> “Do you integrate with our exact system?”","a":"<b>Explore:</b> version, country, required flows, custom fields, direction, update expectation, exception handling and technical owner. <b>Respond:</b> “The system name is only the start. We’ll confirm the connector and required flows rather than assume all workflows are covered.” <b>Avoid:</b> “We integrate with everything.”"},{"t":"reveal","q":"<b>11.</b> “Migration will disrupt operations.”","a":"<b>Explore:</b> downtime, stock reconciliation, data quality, training, 3PL coordination, timing and rollback. <b>Respond:</b> “That risk should be handled explicitly. The implementation team proposes testing, reconciliation, cutover and acceptance milestones for your environment.” <b>Avoid:</b> zero-downtime or fixed-duration promises."},{"t":"reveal","q":"<b>12.</b> “Our warehouse team won’t use it / the UI is harder.”","a":"<b>Explore:</b> which task? Language, device or accessibility needs? New vs experienced staff? <b>Respond:</b> “Let’s assess the actual receiving or pick/pack task with the people who will use it.” <b>Advance:</b> a relevant walkthrough or approved site visit. <b>Avoid:</b> guaranteed minutes-to-train."},{"t":"reveal","q":"<b>13.</b> “We need offline operation.”","a":"<b>Status:</b> offline mode is not supported. <b>Explore:</b> how often and how long connectivity drops, and which operations are essential. <b>Respond:</b> “It runs in the browser and needs connectivity. If offline is non-negotiable, we must be honest about that mismatch.” <b>Advance:</b> technical assessment; qualify out if essential. <b>Avoid:</b> “coming soon”."}]},{"h":"Capabilities and proof","b":[{"t":"reveal","q":"<b>14.</b> “We need batches / expiry / serials / special B2B workflows.”","a":"<b>Explore:</b> exact unit, rule, validation point, traceability requirement, reports. <b>Respond:</b> “Those need workflow-level validation. Let’s document what must happen at receiving, allocation, dispatch and return.” <b>Advance:</b> specialist scoping."},{"t":"reveal","q":"<b>15.</b> “Our range is new; we have little history.”","a":"<b>Explore:</b> available history, product attributes, comparable products, data gaps. <b>Respond:</b> “New products need a specific approach: attribute-level comparisons and shorter horizons. Fit and data readiness should be assessed before predicting performance.” <b>Avoid:</b> forecast-accuracy guarantees."},{"t":"reveal","q":"<b>16.</b> “The competitor has a feature you don’t.”","a":"<b>Explore:</b> what job does it do? Must-have at go-live or later? <b>Respond:</b> “If it’s essential, we should validate our support honestly, separating live functionality, a demo/mock-up and an approved roadmap item.” <b>Avoid:</b> calling a mock-up live, promising a custom build, or inventing a roadmap date."},{"t":"reveal","q":"<b>17.</b> “Can you guarantee these results?”","a":"“A case study documents a specific customer’s outcome. It isn’t a guarantee for your environment. Let’s agree a relevant baseline, scope and success measure.”"},{"t":"reveal","q":"<b>18.</b> “We need references / local support / security assurance.”","a":"<b>Explore:</b> similarity needed, support window, location, residency or certification requirement, questionnaire. <b>Respond:</b> “Let’s capture the exact requirement and confirm current evidence and support arrangements with the right team.” Support is 24/7 from India with on-site visits where needed. <b>Avoid:</b> unapproved customer calls, promising local staff, quoting certifications, or sharing sensitive reports."},{"t":"reveal","q":"<b>19.</b> “Our 3PL won’t adopt it.”","a":"<b>Explore:</b> who controls the system, contract, data, staff and process? What does the 3PL want or fear? <b>Respond:</b> “Let’s understand the 3PL’s constraints rather than assume the brand can impose a change.” <b>Advance:</b> a three-way discussion with brand, 3PL and an Increff specialist."}]},{"h":"From our own calls","b":[{"t":"reveal","q":"<b>20.</b> “Your clients are in a different category.”","a":"Increff isn’t category-specific; give analogues (sarees, luggage, jewellery, pharmacy, watches, home decor). Where we have no direct experience, say so, then cite the closest indirect experience. <b>Avoid:</b> over-promising category experience."},{"t":"reveal","q":"<b>21.</b> “Serialization adds time and cost.”","a":"Offer the non-serialized option and quote both. Bulk putaway and bulk return exist only in non-serialized mode. <b>Avoid:</b> claiming bulk operations in serialized mode."},{"t":"reveal","q":"<b>22.</b> “Your minimum is too high for a small brand.”","a":"AI Planning OS suits omnichannel brands at scale. Offer multi-channel fulfilment as a better fit, and let Sales share a proposal. <b>Avoid:</b> improvising a lower minimum or a discount."},{"t":"reveal","q":"<b>23.</b> “Our volume is too low for your minimum.”","a":"Increff doesn’t own facilities, so capex isn’t a concern. A 3PL route using Increff’s technology may fit. <b>Avoid:</b> quoting another client’s rates."}]},{"h":"Practice: three role plays","sub":"Read the brief, plan your response, then reveal what good looks like.","b":[{"t":"reveal","q":"<b>Fashion brand: incumbent and price.</b> A fictional fashion brand uses a cheaper incumbent and has peak delays. The prospect asks: “Why should we pay more?”","a":"Diagnose the value concern; keep what works; capture the peak-verification evidence. No competitor attacks, price promises or migration guarantees. Propose an operations-led workflow validation."},{"t":"reveal","q":"<b>Beauty brand: ERP and connectivity.</b> “Our ERP cannot change, and we need exact expiry rules.”","a":"Clarify flows, exact rules and units; mark expiry/batch requirements for validation; separate coexistence from replacement; no blanket “all supported” claim. Propose a requirements review with IT."},{"t":"reveal","q":"<b>Retail chain: Excel and planner trust.</b> “Our planners know demand. Software can’t replace that.”","a":"Respect their expertise; explore effort and stock imbalance; use a planning story only after understanding; propose a data and process review with the planners and the business owner."}]}],"quiz":[{"q":"“Do you integrate with our exact system?” Best response?","o":["“Yes, we integrate with everything.”","“The system name is only the start; we’ll confirm the connector and required flows.”","“No.”","“Ask the ERP vendor.”"],"a":1,"w":"Validate exact scope."},{"q":"“We need offline operation, it’s non-negotiable.” What do you do?","o":["Say it’s coming soon","Be honest about the mismatch; qualify out if essential","Promise a custom build","Ignore it"],"a":1,"w":"Offline is not supported."},{"q":"“The competitor has feature X.” What must you separate?","o":["Price and discount","Live functionality, a demo/mock-up, and an approved roadmap item","Sales and marketing","Nothing"],"a":1,"w":"Honest feature status."},{"q":"“Serialization adds cost.” Best move?","o":["Insist on serialization","Offer the non-serialized option and quote both","Drop the lead","Discount 50%"],"a":1,"w":"Quote both."},{"q":"A prospect asks for a reference call. You…","o":["Call a client yourself","Capture the requirement and use the approved reference process","Refuse","Share a client’s contract"],"a":1,"w":"No unapproved customer calls."},{"q":"“Migration will disrupt us.” What do you avoid?","o":["Asking about downtime","Zero-downtime or fixed-duration promises","An implementation risk review","Involving implementation"],"a":1,"w":"Handle the risk explicitly."}]},"G1":{"title":"Partner types and partnership models","mins":15,"intro":"Who partners with Increff, and the ways a partnership can work.","cards":[{"h":"Why partners matter","b":[{"t":"p","x":"Partners bring Increff into accounts it can’t reach alone, add local presence and language, and deliver or implement alongside us. Every partner-sourced lead still has to clear the same ICP and BANT bar."}]},{"h":"Types of partners","sub":"Click a type.","b":[{"t":"tabs","items":[["Referral / finder","An individual or firm that introduces Increff to a prospect.","A Finder Service Agreement: a fee or commission when an introduced account converts. Purely referral."],["Lead-gen agency","An agency that books meetings with target accounts for us.","Paid per lead or meeting (CPL), a monthly retainer, or a hybrid. Must apply our BANT criteria."],["Consulting firm / SI","Consultancies and system integrators advising retailers on transformation.","Co-sell: they bring the client relationship and solution design; Increff brings the product. Often a better fit than pure referral."],["Implementation partner","A firm that implements and supports Increff for clients.","Two versions: <b>Reseller</b>, or <b>Referral + Implementation</b>. Commercials differ by partner size."],["Technology / ISV","Software companies whose products sit next to ours (POS, ERP, logistics, carrier platforms).","Integration plus joint go-to-market and referrals."],["Logistics / 3PL","Warehouse operators that run fulfilment for brands.","The 3PL uses Increff’s technology; Increff charges the brand with a back-to-back agreement with the 3PL."],["Cloud marketplace","Cloud-provider marketplaces where enterprises buy software.","Listed as resell-enabled; joint account targeting with the cloud provider’s account managers (co-sell)."],["Partner platform / PRM","A partner-relationship platform and distribution network used to list Increff products for partners.","Partners register, refer and track leads through it."]],"labels":["Who they are","How it works"]}]},{"h":"The core partnership models","b":[{"t":"grid","items":[["Referral","The partner introduces; Increff sells and delivers. The partner earns a finder fee or commission."],["Co-sell","Partner and Increff pursue the account together; the partner owns the relationship, Increff the product."],["Revenue share (incl. cost-per-lead)","The partner earns a share of customer revenue for a period, or is paid per qualified lead or meeting."],["Reseller","The partner buys and resells Increff, owning billing and the client contract."],["Referral + implementation","The partner refers and also implements, earning both a share and services revenue."],["Joint marketing on top","Marketplace listings, joint webinars or events, agreed case by case."]]},{"t":"tip","x":"Ask which model fits their business before pitching one."}]},{"h":"Why pure referral rarely suits consulting firms","b":[{"t":"reveal","q":"A consulting firm asks: “Why wouldn’t a pure referral model work for us?”","a":"Clients rarely ask Increff for consulting-partner referrals; those mostly go to 3PL or payment-gateway providers. Better fits for a consulting firm are <b>co-sell</b>, <b>delivery</b> or <b>implementation</b> partnerships."},{"t":"reveal","q":"A partner asks: “Do you generate customers for us, or do we bring our own?”","a":"Both. Increff can front the discussion and bring brands, or the partner brings its own customers and uses Increff’s technology."}]}],"quiz":[{"q":"A firm only introduces prospects and earns a fee if they convert. What type?","o":["Reseller","Referral / finder","Implementation partner","3PL"],"a":1,"w":"A Finder Service Agreement is purely referral."},{"q":"In a 3PL model, who does Increff charge?","o":["The 3PL","The brand, with a back-to-back agreement with the 3PL","The courier","Nobody"],"a":1,"w":"Increff’s core business is technology."},{"q":"Best model for a consulting firm?","o":["Pure referral","Co-sell, delivery or implementation partnership","Reseller only","None"],"a":1,"w":"Clients rarely ask for consulting referrals."},{"q":"Which partner owns billing and the client contract?","o":["Referral partner","Reseller","Lead-gen agency","Cloud marketplace"],"a":1,"w":"A reseller buys and resells."},{"q":"What must every partner-sourced lead still clear?","o":["Nothing","The same ICP and BANT bar","Only ICP","Only a booked meeting"],"a":1,"w":"No exceptions for partners."}]},"G2":{"title":"Commercial models explained","mins":18,"intro":"Revenue share, CPL, retainers and more: how each works, when to use it, and the traps.","cards":[{"h":"Paying partners who bring customers","b":[{"t":"tabs","items":[["Revenue share","The partner earns a % of the customer’s revenue to Increff for a set period (e.g. 12 months).","Partners who sell, co-sell or implement and stay involved with the account.","Agree in writing: account ownership, lead registration, the period, and when it is paid. Flexible case by case: lower for smaller clients, higher for large enterprise. Don’t quote a % unprompted."],["Finder fee / commission","A one-time fee or commission when an introduced account signs.","Individuals or firms who only introduce.","Define what counts as an introduction and for how long it stays valid."],["Reseller margin","The partner buys at a partner price and resells, keeping the difference.","Partners who own the client contract and billing.","Clarify who supports the client and who owns renewal."]],"labels":["How it works","Best for","Watch out"]}]},{"h":"Paying agencies who book meetings","b":[{"t":"tabs","items":[["CPL (cost per lead / meeting)","A fixed price for each lead or meeting delivered. Increff prefers paying per BANT-qualified meeting that actually takes place.","Pilots and new agencies; when management wants variable, performance-linked cost.","Define “qualified” in writing. Ask: are we paid-for only if the lead attends? What happens to drop-outs?"],["Monthly retainer","A fixed monthly fee, often per dedicated SDR, usually with a minimum number of meetings.","Long-term, high-volume outbound in a proven market.","Fixed cost whether or not meetings convert. Check refund terms and whether unmet quota carries over."],["Hybrid","A smaller retainer plus a fee per meeting booked.","Sharing risk between Increff and the agency.","Make sure the per-meeting fee is tied to qualified, held meetings."]],"labels":["How it works","Best for","Watch out"]},{"t":"tip","x":"Management is sensitive to fixed costs and prefers CPL or performance-based models over retainers. Ask for a pilot on pay-per-qualified-meeting terms."}]},{"h":"Compare the cost of a qualified meeting","sub":"Illustrative numbers: change them to compare offers.","b":[{"t":"calc","kind":"cpl"},{"t":"reveal","q":"An agency books 10 meetings a month for a fixed fee. 6 are held and 3 clear BANT. Which number do you judge them on?","a":"The cost per <b>BANT-qualified, held</b> meeting: the fee divided by 3, not by 10."}]}],"quiz":[{"q":"Which model ties cost most closely to results?","o":["Monthly retainer","CPL / pay per qualified meeting","Fixed annual fee","Free"],"a":1,"w":"Variable and performance-linked."},{"q":"What must be agreed in writing for a revenue share?","o":["Only the %","Account ownership, lead registration, the period and payment terms","Nothing","The partner’s logo"],"a":1,"w":"Clear written rules, no verbal assurances."},{"q":"A retainer agency books 12 meetings; 4 clear BANT. What do you divide the fee by?","o":["12","4","1","16"],"a":1,"w":"Judge on qualified, held meetings."},{"q":"Which model does management prefer for agencies?","o":["Large retainers","CPL or performance-based","Equity","Barter"],"a":1,"w":"Management is sensitive to fixed costs."},{"q":"A partner asks: “Is 20% revenue share right?” What do you do?","o":["Confirm 20%","Say it’s flexible case by case and don’t quote a % unprompted; escalate to partnerships leadership","Offer 30%","Refuse to discuss"],"a":1,"w":"Don’t quote unprompted."}]},"G3":{"title":"Questions partners ask","mins":15,"intro":"The questions 3PLs, consultants, resellers and platforms ask on first calls, and the recommended answers.","cards":[{"h":"The partnership and commercials","b":[{"t":"reveal","q":"“What partnership models does Increff offer?”","a":"Referral, co-sell, and revenue share (including cost-per-lead). Joint marketing can sit on top. Ask which fits their business first."},{"t":"reveal","q":"“Will Increff cut us out and go direct?”","a":"Aim for clear written rules: account ownership, lead registration, term of the revenue share. No verbal assurances. Escalate to partnerships leadership."},{"t":"reveal","q":"“Can you list us on your website?”","a":"It needs an owner. Don’t promise it."},{"t":"reveal","q":"“Do you do co-marketing or joint GTM?”","a":"Yes: marketplace listings, joint webinars or events. Specifics are case by case."},{"t":"reveal","q":"“How effective are your existing partnerships?”","a":"Use real, current figures only. For example, one referral partner produces about 2–3 referrals a month through founder-level relationships."},{"t":"reveal","q":"“Do you work with our competitors, or are we the first?”","a":"Be transparent about the category and ask the same of them."},{"t":"reveal","q":"“What do you expect from us on lead quality?”","a":"Strict BANT. A lead counts as SQL only after a qualification meeting validates all BANT criteria. Edge cases are discussed in a shared channel."}]},{"h":"3PL, logistics and carrier partners","b":[{"t":"reveal","q":"“Who owns the inventory?”","a":"The brand. The 3PL is a fulfilment provider, often for brands without a local entity."},{"t":"reveal","q":"“Can you handle multi-brand, multi-channel inventory?”","a":"Yes. SKU-channel mapping controls which stock is exposed on which channel. Inventory is centralised; pickers follow a path-optimised pick with product images."},{"t":"reveal","q":"“What is Vendor Inventory Management?”","a":"Brands expose stock from their own warehouse without moving it to the 3PL: CSV upload on a vendor portal, with orders fulfilled through stock transfer notes."},{"t":"reveal","q":"“Can we integrate our own carriers?”","a":"Directly, if the carrier has APIs. A logistics aggregator is recommended for long-term scalability."},{"t":"reveal","q":"“Who sends delivery notifications and COD status?”","a":"Ideally the carrier’s system. It needs a three-way integration: the brand’s OMS/website, Increff OMS and the carrier."},{"t":"reveal","q":"“Can packaging material be tracked?”","a":"It can be received and serialized, but that adds transaction cost. A lighter option: map packaging to products and track consumption by scanning against the order."},{"t":"reveal","q":"“Intelligent order splitting?”","a":"The OMS decides which warehouse ships based on real-time inventory and can split an order across warehouses."}]},{"h":"Product fit for partners’ clients","b":[{"t":"reveal","q":"“Which industries do you serve?”","a":"Retail verticals: fashion, FMCG, pharma, apparel, footwear, eyewear and more. Finished goods only: no manufacturing, work-in-progress or raw materials. Offer a partner referral for those."},{"t":"reveal","q":"“SAP, Oracle and others?”","a":"Yes. Increff can replace the stack or sit as an additional layer. No plug-and-play: each ERP needs its own flows."},{"t":"reveal","q":"“Do you do financial reconciliation, virtual stock transfers or GST?”","a":"No. It’s a workflow system; the ERP handles reconciliation, stock transfer notes and credit notes. Raise it early."},{"t":"reveal","q":"“Can we upgrade versions later?”","a":"All clients will eventually move as features are built; the non-serialized version rolls out in phases. Pricing impact needs an owner: don’t promise."},{"t":"reveal","q":"“Fraudulent returns, where a courier swaps the item?”","a":"Marked as fraudulent and received as a fresh GRN. It doesn’t solve the courier swap itself."},{"t":"reveal","q":"“Which brand references can we use?”","a":"Only approved references."}]},{"h":"Process, enablement and cloud co-sell","b":[{"t":"reveal","q":"“After the first call, will we have to re-explain requirements?”","a":"No. The team reviews call recordings and summaries internally before the next call."},{"t":"reveal","q":"“Can you do an on-site demo?”","a":"Yes, where travel allows. A full interface demo takes about an hour."},{"t":"reveal","q":"“Can we get decks, brochures and specialist contacts?”","a":"Yes. Send the minutes with the relevant decks after the call."},{"t":"reveal","q":"“What support and time zones do you cover?”","a":"Support from India with 24/7 coverage; on-site visits are possible."},{"t":"reveal","q":"“How do you choose accounts for cloud-marketplace co-sell?”","a":"The cloud provider shares live accounts with dedicated account managers. Increff targets fashion retail clients with roughly $20M+ annual revenue who are also that provider’s customers. After a co-sell referral is submitted on the portal, the provider’s engagement manager coordinates with the account managers."},{"t":"reveal","q":"“Which CRM and cloud do you use?”","a":"Salesforce for CRM. Google, Amazon and Azure are all possible for hosting."}]}],"quiz":[{"q":"A 3PL asks who owns the inventory in its warehouse.","o":["The 3PL","Increff","The brand","The courier"],"a":2,"w":"The 3PL is a fulfilment provider."},{"q":"“Will you list us on your website?”","o":["Yes, today","It needs an owner: don’t promise it","Never","Only resellers"],"a":1,"w":"No commitments without an owner."},{"q":"“Will Increff cut us out?”","o":["“Trust us.”","Clear written rules on ownership, registration and term; escalate to partnerships leadership","“Maybe.”","“Yes.”"],"a":1,"w":"No verbal assurances."},{"q":"How should carrier status and COD updates flow?","o":["Manually","A three-way integration: brand OMS/website, Increff OMS and the carrier","Only email","Not possible"],"a":1,"w":"Ideally from the carrier’s system."},{"q":"A partner’s client needs raw-material planning. You…","o":["Book AI Planning OS","Explain it’s out of scope and offer a partner referral","Promise a build","Book WMS"],"a":1,"w":"Finished goods only."},{"q":"When does a partner lead become an SQL?","o":["When booked","After a qualification meeting validates all BANT criteria","When the partner says so","After a deck is sent"],"a":1,"w":"Strict BANT."}]},"G4":{"title":"Partner lifecycle and enablement","mins":12,"intro":"From finding a partner to reviewing what they deliver.","cards":[{"h":"The lifecycle","b":[{"t":"steps","items":[["Source","Find partners who already reach our ICP: by region, segment and the services they sell."],["Evaluate","Check fit, reach, team size, track record and how they qualify leads."],["Agree","Sign the right agreement (referral, reseller, referral + implementation, agency contract) with written rules on ownership and terms."],["Enable","Train them on Increff, ICP and BANT (this academy, Partner edition), and share the handoff form."],["Hand off","Every lead comes with the handoff form filled and BANT graded. No form, no booking."],["Review","A monthly joint review of meetings held, BANT quality, no-shows and second calls."]]}]},{"h":"A 90-day plan for a new market","b":[{"t":"tabs","items":[["Weeks 1–2","Define the target list","Pick 2–3 segments from the target list that exist in the region. Build 50–80 named accounts and run the 2-minute pre-check (physical goods, operator, scale, no blocker). Check the DNC list and existing CRM ownership with Increff."],["Weeks 3–6","Reach the right person","Go to function heads (Merchandising, Supply Chain, Warehouse, E-commerce). Use the routing questions in the first conversation and fill the handoff form as you go."],["Weeks 6–10","Book only graded meetings","Hand off with BANT graded. All green → Sales Director call. Yellow → agree the plan with Increff. Red → keep scoping. Confirm attendees 24 hours before."],["Weeks 10–13","Review and adjust","Joint review: which segments converted to second calls, no-show rate, common reds. Drop segments that don’t convert; double down on those that do. Plan in-person visits around the strongest accounts."]],"labels":["Goal","What to do"]}]},{"h":"The five metrics we measure together","b":[{"t":"chips","items":["Meetings held with an ICP buyer","% of handoffs with all mandatory fields","% of meetings meeting the all-green BANT bar","No-show rate","Meetings that reach a second call"]},{"t":"tip","x":"We stop counting meetings booked as the goal."}]}],"quiz":[{"q":"What must come with every partner lead?","o":["A brochure","The handoff form filled and BANT graded","A discount","Nothing"],"a":1,"w":"No form, no booking."},{"q":"Which is NOT one of the five shared metrics?","o":["No-show rate","Meetings booked","Meetings reaching a second call","Meetings held with an ICP buyer"],"a":1,"w":"Booked meetings aren’t the goal."},{"q":"In weeks 1–2 of a new market, what do you check with Increff?","o":["Pricing","The DNC list and existing CRM ownership","Office space","Logos"],"a":1,"w":"Avoid contacting accounts we shouldn’t."},{"q":"How often is the joint partner review?","o":["Yearly","Monthly","Never","Daily"],"a":1,"w":"A monthly review."},{"q":"A segment isn’t converting after 10 weeks. What do you do?","o":["Keep going forever","Drop it and double down on segments that convert","Raise prices","Change the product"],"a":1,"w":"Review and adjust."}]},"AX":{"title":"Part A checkpoint","mins":15,"cp":true,"intro":"15 scenario questions across all of Part A. Pass 80% to unlock Part B.","cards":[{"h":"Part A checkpoint","b":[{"t":"grid","items":[["15 questions","Real-call scenarios that mix everything in Part A: retail basics, business models, vocabulary, metrics and systems."],["Pass mark","80% (12 of 15) unlocks Part B."],["Revise first","Use the glossary and each module’s recap page."]]}]}],"quiz":[{"q":"A 60-store apparel brand says: “Our website shows sizes we can’t find in the warehouse, and stores are short of M and L while XS piles up.” Which two problem areas are at play?","o":["Only an ERP issue","Execution (stock not where the system says) and inventory decisions (size mix)","Connectivity and markdown","Only a courier issue"],"a":1,"w":"Two separate failures: physical stock accuracy, and the size mix sent to stores."},{"q":"A D2C beauty brand ships single items to consumers and also sends cartons to two marketplaces’ warehouses. What is its operating model?","o":["Store-led","Wholesale only","Mixed: D2C plus B2B/marketplace","3PL"],"a":2,"w":"Most businesses run more than one model; find out each, and the unit each ships in."},{"q":"A store received 400 units of a style and sold 240, of which 40 were on discount. What is the full-price sell-through?","o":["50%","60%","40%","10%"],"a":0,"w":"Full-price units = 240 − 40 = 200. 200 ÷ 400 = 50%."},{"q":"Weekly sales are 30 units and 90 units are on hand. A replenishment takes 4 weeks to arrive. What should worry you?","o":["Stock covers 3 weeks but top-up takes 4, so a stock-out is likely","Too much stock","Nothing","The SLA"],"a":0,"w":"Weeks of cover = 90 ÷ 30 = 3, shorter than the 4-week lead time."},{"q":"An undelivered COD parcel comes back, and separately a customer returns a dress she didn’t like. How should you describe them?","o":["The first is an RTO, the second a customer return","Both are RTOs","Both are customer returns","Both are cross-docking"],"a":0,"w":"RTO = undelivered forward shipment; a customer return was delivered first."},{"q":"A prospect wants one system to decide which of its three warehouses ships each online order. What kind of system is that?","o":["OMS","WMS","ERP","POS"],"a":0,"w":"Choosing the fulfilment node across locations is order coordination."},{"q":"Their audit shows 98% of SKU-locations match the system, and they ask if that means 98% of orders ship correctly. Answer?","o":["Yes","No: that is inventory accuracy; order/pick accuracy is measured separately","Only on weekends","Only for B2B"],"a":1,"w":"Inventory accuracy ≠ order accuracy."},{"q":"A planner says: “We moved 50 units from our Pune store to our Mumbai store last week.” What is that?","o":["Markdown","Putaway","Inter-store transfer (IST)","Allocation"],"a":2,"w":"Store-to-store movement is an IST."},{"q":"Supplier trucks arrive unannounced and the team can’t check them against orders. Which two documents would fix this?","o":["ASN, matched to the PO","POS and ERP","OTB and WSSI","AWB and RTO"],"a":0,"w":"The ASN tells you what’s coming; match it to the purchase order."},{"q":"A prospect says: “Can Increff replace our accounting and do GST filings?” What’s true?","o":["No: finance, reconciliation and GST stay in the ERP; Increff is the execution and decision layer","Only for D2C","Yes","Only with WMS"],"a":0,"w":"Increff is not an ERP or accounting tool."},{"q":"Conversion went from 2% to 3%. A colleague writes “a 1% increase” in the call notes. What should it say?","o":["Correct as written","A 1 percentage-point increase, which is 50% relative","A 150% increase","A 3% increase"],"a":1,"w":"Percentage points vs relative change."},{"q":"A jewellery brand must trace each individual ring from receiving to sale. Which tracking approach fits?","o":["Non-serialized","Serialized: a unique code per item","By carton only","No tracking"],"a":1,"w":"Item-level traceability needs a unique identifier per piece."},{"q":"A brand says: “We’ll buy more of everything next season because we keep running out.” What do you check first?","o":["Their courier","Their logo","Whether stock is in the wrong place, size mix or timing, since excess may exist elsewhere","Nothing; agree"],"a":2,"w":"Too much and too little often exist together."},{"q":"Which pair is in the right order for a product arriving at a warehouse?","o":["Dispatch, then receiving","Pick, then GRN","GRN, then putaway into a bin","Packing, then putaway"],"a":2,"w":"Receive and record (GRN), then put away into a recorded location."},{"q":"An integration with the prospect’s ERP exists. Which statement is safe?","o":["“No setup needed.”","“The connector exists; we’ll confirm the exact flows, frequency and exceptions you need.”","“Every workflow is covered.”","“It replaces the ERP.”"],"a":1,"w":"A connector doesn’t establish flow coverage."}]},"BX":{"title":"Part B checkpoint","mins":10,"cp":true,"intro":"10 scenario questions on Increff and how we work. Pass 80% to unlock Part C.","cards":[{"h":"Part B checkpoint","b":[{"t":"grid","items":[["10 questions","Scenarios on who Increff is, what we sell and don’t, and who owns what in a deal."],["Pass mark","80% (8 of 10) unlocks Part C."]]}]}],"quiz":[{"q":"A prospect in Riyadh asks if Increff works in their region. What do you say?","o":["Yes: Increff is active in India, MEA, SEA, the US and ANZ","We don’t know","India only","Only the US"],"a":0,"w":"MEA is an active region."},{"q":"A CEO asks you to explain Increff in one line. Which is best?","o":["“We do everything.”","“We are an AI platform solution.”","“We help retail brands decide what stock to buy and where to put it, then get every order out of the right warehouse or store accurately.”","“We are an ERP.”"],"a":2,"w":"Plain language, no buzzwords, linked to their problem."},{"q":"A prospect asks for installation requirements for their servers. What’s true?","o":["Needs Increff hardware","On-premise only","It’s cloud, browser-based: no installation; they supply printers and handhelds","Only on Mac"],"a":2,"w":"Browser-based on desktop, mobile, tablets and handhelds."},{"q":"A prospect asks whether a module they saw on LinkedIn is live and when a missing feature will ship. Who confirms?","o":["Nobody","You, from memory","Presales confirms current status; never give roadmap dates","Marketing"],"a":2,"w":"State only confirmed status."},{"q":"A prospect asks for 18% off and a go-live in three weeks on the first call. What do you own here?","o":["Neither: discounts go to Sales, timelines to the implementation team","Only the timeline","Both","Only the discount"],"a":0,"w":"You diagnose, explain and advance; commercials and timelines belong to others."},{"q":"Which of these would you NOT say on a first call?","o":["“Support is 24/7 from India.”","“We sit alongside your ERP.”","“We guarantee 99.9% accuracy for you.”","“Finished goods only.”"],"a":2,"w":"Proof points are documented results, not guarantees."},{"q":"A prospect asks: “Do you have an official MCP server and work offline?”","o":["Yes MCP, no offline","Yes to both","Coming soon","No to both: APIs exist but no official MCP server, and it needs connectivity"],"a":3,"w":"Both are on the do-not-claim list."},{"q":"What should Sales get from you after a first call?","o":["The problem in their words, an example, scale, impact, systems and owners, why now, stakeholders and what the next call must establish","Just the contact’s phone","“They want a demo.”","A price"],"a":0,"w":"A useful handover, not just a demo request."},{"q":"A prospect’s IT head sends a security questionnaire and asks about data residency. You…","o":["Answer it yourself","Ignore it","Capture the requirement and route it to Security and Legal","Promise local hosting"],"a":2,"w":"Security assurances aren’t yours to give."},{"q":"A prospect asks: “What does Brand X pay you?”","o":["Never share another client’s price","Share a range","Share it","Ask Brand X"],"a":0,"w":"Client pricing is confidential."}]},"CX":{"title":"Part C checkpoint","mins":15,"cp":true,"intro":"15 scenario questions across the product family. Pass 80% to unlock Part D.","cards":[{"h":"Part C checkpoint","b":[{"t":"grid","items":[["15 questions","Scenarios that ask you to pick the right product, answer the question, and avoid the wrong claim."],["Pass mark","80% (12 of 15) unlocks Part D."]]}]}],"quiz":[{"q":"A 120-store fashion retailer plans buys in Excel, runs out of winners mid-season and holds big end-of-season sales. Which product family leads?","o":["Omnichannel Fulfilment System","Label software","Self-checkout","AI Planning OS (buying, replenishment, markdown)"],"a":3,"w":"Decision problems across buying, replenishment and markdown."},{"q":"A marketplace-heavy brand cancels orders because stock shown online isn’t really there. Which product leads?","o":["Range architecture","OMS and Channel Management","Markdown","MFP"],"a":1,"w":"One inventory view and under-10-second sync across channels."},{"q":"A food distributor wants batches and FEFO for pallets and doesn’t want to scan every unit. What do you propose?","o":["AI Planning OS","Non-serialized (carton/pallet) WMS, with batch rules validated by a specialist","Endless aisle","Serialized WMS"],"a":1,"w":"Carton/pallet tracking; capture the exact rules for validation."},{"q":"A prospect asks: “Can I keep 30% of stock just for my distributors?”","o":["Only with a new warehouse","No","Yes: map a virtual inventory pool to B2B","Only offline"],"a":2,"w":"Virtual pools split exposure."},{"q":"A planner asks how Increff forecasts a brand-new category. Best answer?","o":["Attribute-based forecasting that rolls up the hierarchy and benchmarks similar products, after a data-readiness check","We guess","We can’t","We copy last year"],"a":0,"w":"Attribute-level comparisons, then assess data."},{"q":"A prospect wants routing by order tag, editing after invoicing, and gate-entry return checks. Which can you confirm?","o":["Only tag routing","None of them as asked: tag routing isn’t confirmed, edits only before invoice, gate checks aren’t supported","All three","Only gate checks"],"a":1,"w":"Three classic do-not-claim items."},{"q":"A brand’s stores have stock but online orders get cancelled. Which capability could help, and what do you check first?","o":["Label software; check printers","Ship from store; first check whether store stock is reliable and eligible","MFP; check budgets","Markdown; check prices"],"a":1,"w":"Store fulfilment depends on reliable store stock."},{"q":"A packing team re-checks every order because of mis-ships. Which WMS capability addresses this?","o":["Markdown","OTB","3D view","Pick scan plus blind pack scan"],"a":3,"w":"Two-step validation catches the wrong item before dispatch."},{"q":"A planner fears losing control to “the AI”. What is accurate?","o":["No approvals exist","Planners are replaced","The AI decides alone","AI agents draft and flag risks; the team approves, sets permissions, and every recommendation is explained"],"a":3,"w":"AI that plans with you, not for you."},{"q":"A prospect wants to keep its own WMS but fix overselling across channels. Can it?","o":["Only with SAP","No, must buy both","Yes: the OMS and channel layer can be bought separately","Only in India"],"a":2,"w":"Products can be bought by use case."},{"q":"Which is the correct reason to ask “orders or pieces?”","o":["It doesn’t matter","For pricing only","For marketing","A 10-item order is 10 picks, so scale and fit depend on pieces, not orders"],"a":3,"w":"Measure volume in the right unit."},{"q":"Stores receive the right recommendations but stock still arrives late. Where do you look?","o":["Forecast model","Markdown","The logo","Execution and replenishment lead time"],"a":3,"w":"Planning logic isn’t the only cause."},{"q":"A prospect asks how much training warehouse staff need. Best answer?","o":["“Exactly 5 minutes.”","“It’s designed to be learned quickly; let’s walk through the real task with your team.”","“Six months.”","“None.”"],"a":1,"w":"Don’t guarantee training times."},{"q":"A retailer wants customers to buy an out-of-stock shirt in store and get it delivered from another location. Which feature?","o":["WSSI","Cross-docking","BORIS","Endless aisle"],"a":3,"w":"Remote catalogue across the network."},{"q":"Which product claim is safe in writing?","o":["“We integrate with everything.”","“Works offline.”","“Zero errors guaranteed.”","“Inventory and orders sync across channels in under 10 seconds.”"],"a":3,"w":"Under 10 seconds is the approved sync figure."}]},"DX":{"title":"Part D checkpoint","mins":10,"cp":true,"intro":"10 scenario questions on industries and customer proof. Pass 80% to unlock Part E.","cards":[{"h":"Part D checkpoint","b":[{"t":"grid","items":[["10 questions","Pick the industry fit, the right proof and the safe claim."],["Pass mark","80% (8 of 10) unlocks Part E."]]}]}],"quiz":[{"q":"An eyewear chain sells thousands of frame-lens combinations across 80 stores and online. Which fit?","o":["Carton/pallet WMS only","AI Planning OS plus piece-level WMS","TMS only","Not a fit"],"a":1,"w":"Huge variety, store replenishment, item tracking."},{"q":"A supermarket chain picks online orders from store shelves and checks expiry by eye. What is the closest proof story?","o":["Celio","Pepe Jeans","The Lulu store-fulfilment model","Brands For Less"],"a":2,"w":"Store-as-fulfilment-node with FEFO at the scan."},{"q":"A hypermarket asks whether it must replace SAP to use Increff for store fulfilment.","o":["Only in UAE","Yes","No: SAP stays the source of truth; Increff is the execution layer","Only for dark stores"],"a":2,"w":"No rip-and-replace."},{"q":"A prospect’s replenishment cycle takes four days of planner effort. Which story fits?","o":["GlobalBees","Pepe Jeans","Lulu","Pintola"],"a":1,"w":"Allocation and replenishment effort."},{"q":"A brand asks: “So we’ll get Pintola’s 79% too?”","o":["It’s a documented result for Pintola’s process and baseline; theirs needs assessment","More than 79%","No improvement","Yes"],"a":0,"w
