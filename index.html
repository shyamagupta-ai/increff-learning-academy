":"Results don’t transfer automatically."},{"q":"Which Lulu figures are safe to quote?","o":["Any number in a draft","100 stores live within 2 months; ~2 lakh units a day","Competitor figures","Modelled uplift % from internal decks"],"a":1,"w":"Use only the approved figures."},{"q":"A sportswear brand worries about blanket outlet discounts eating margin. Which proof?","o":["Pepe Jeans","The approved masked markdown case","GlobalBees","No proof needed"],"a":1,"w":"Use the masked case without naming the brand."},{"q":"A colleague says: “The masked case is obviously Brand Y, let’s name it.” You…","o":["Name it only in email","Ask the prospect to guess","Name it","Keep it masked"],"a":3,"w":"Never unmask."},{"q":"An electronics distributor ships to dealers in cartons and needs serial capture for warranty. Which question matters most?","o":["“What’s your size curve?”","“Where must serial identity be captured?”","“What’s your season?”","“How many stores?”"],"a":1,"w":"Serial/warranty capture point drives scope."},{"q":"In what order do you tell a customer story?","o":["Context, problem, intervention, outcome, relevance, then a question","Problem, discount","Outcome only","Logo, price, close"],"a":0,"w":"A fixed structure ending in a question."}]},"EX":{"title":"Part E checkpoint","mins":15,"cp":true,"intro":"15 scenario questions on competitors and objections. Pass 80% to unlock Part F.","cards":[{"h":"Part E checkpoint","b":[{"t":"grid","items":[["15 questions","Respond to competitors and objections the way a buyer would trust."],["Pass mark","80% (12 of 15) unlocks Part F."]]}]}],"quiz":[{"q":"A prospect on a cheaper incumbent says: “Why pay more?” What is your first move?","o":["Criticise the incumbent","Discount","Explore what’s included in the comparison and which workflows are non-negotiable","End the call"],"a":2,"w":"Clarify scope before responding."},{"q":"“We just went live on SAP EWM.” Which response is best?","o":["“Call us in 5 years.”","“Let’s separate what you must keep from the gap you need fixed; if warehouse isn’t open, planning may be.”","“SAP is clunky.”","“Replace it.”"],"a":1,"w":"Respect the ERP investment; look for the gap."},{"q":"Which competitive statement is safe?","o":["“They had a warehouse fire.”","“They’re always slower.”","“They never sync.”","“Let’s pick two scenarios that matter and have both options demonstrate them.”"],"a":3,"w":"Compare on scenarios, never disparage."},{"q":"Label the step: “Have I addressed that, or is another part unresolved?”","o":["Listen","Check","Reframe","Explore"],"a":1,"w":"LAER+ checks before advancing."},{"q":"“Our budget is frozen until next financial year.” What type of objection?","o":["Question","Misunderstanding","Mismatch","Constraint"],"a":3,"w":"A real limit on action."},{"q":"“Your team will never use it, our pickers aren’t tech-savvy.” Best response?","o":["Ignore it","“They’ll learn in 10 minutes.”","“Let’s assess the actual pick/pack task with the people who will use it.”","“Hire new staff.”"],"a":2,"w":"Test the floor workflow; no training guarantees."},{"q":"A prospect evaluating Blue Yonder asks how we compare. You…","o":["Say they’re always expensive","Ask which module is being evaluated and what defines success","Refuse to discuss","Ask for their proposal"],"a":1,"w":"Understand scope before positioning."},{"q":"“Can you guarantee the 99.9% accuracy?”","o":["A case documents one customer’s result; let’s agree your baseline, scope and success measure","Only if you pay more","No idea","Yes"],"a":0,"w":"Evidence-based evaluation."},{"q":"“Send me a deck and pricing.” Best move?","o":["Send the full catalogue and a price","Send nothing","Refuse until they meet","Ask which issue it should help them evaluate; pricing goes through Sales"],"a":3,"w":"Fulfil with focus; route pricing."},{"q":"“Excel is free and works fine.” What do you explore?","o":["Decision-cycle time, manual preparation, errors and dependence on key people","Nothing","Their laptop brand","Their Excel version"],"a":0,"w":"Effort, consistency and scale."},{"q":"A prospect needs fully offline warehouse operation. What do you do?","o":["Be honest it isn’t supported; qualify out if it’s essential","Say coming soon","Ignore it","Promise it"],"a":0,"w":"A real mismatch."},{"q":"“The competitor has feature X, do you?” You’re not sure. You…","o":["Say yes","Separate live, demo/mock-up and roadmap; have Presales confirm current status","Promise a custom build","Give a date"],"a":1,"w":"Honest feature status."},{"q":"“We’ll build this in-house.” What do you avoid?","o":["A future checkpoint","Asking about their team","Predicting their failure or inventing their costs","A scoped comparison"],"a":2,"w":"Respect the option."},{"q":"“It won’t integrate with our ERP.” Which reply follows LAER+?","o":["“Ask your IT team.”","“We integrate with everything.”","“Yes it will.”","“Which exact flow or system compatibility concerns you?”, then confirm scope with Presales"],"a":3,"w":"Explore before you reframe."},{"q":"A prospect offers to forward a competitor’s proposal “for comparison”. You…","o":["Share ours with them","Ask for two","Politely decline: no confidential third-party material","Accept"],"a":2,"w":"Never request or use it."}]},"FX":{"title":"Part F checkpoint","mins":15,"cp":true,"intro":"15 scenario questions on ICP, BANT and running the call. Pass 80% to unlock Part G.","cards":[{"h":"Part F checkpoint","b":[{"t":"grid","items":[["15 questions","Qualify real-looking leads end to end: ICP, routing, BANT grade, next step."],["Pass mark","80% (12 of 15) unlocks Part G."]]}]}],"quiz":[{"q":"A 25-store retailer (₹150 Cr revenue) plans in Excel; the Head of Planning joined; budget unknown; they’ll pick a vendor in about 6 months. BANT?","o":["All red","All green","Disqualify","B yellow/red to check, A yellow (Champion), N green, T green → discuss with Increff before booking"],"a":3,"w":"Champion and unknown budget keep it yellow at best."},{"q":"A brand ships 4,000 orders a month, mostly single items, from its own warehouse. Fit for piece-level WMS?","o":["Always yes for D2C","Check: the bar is 30,000 pieces a month, so likely below unless pieces per order are high","Yes, easily","Only with AI Planning OS"],"a":1,"w":"Measure in pieces against the floor."},{"q":"The only contact is a warehouse supervisor who says the COO “might join later”. Accepted?","o":["Not yet: a User needs evidence (driving a funded initiative, clear influence, or a warm intro)","Disqualify forever","Hand to Sales Director","Yes"],"a":0,"w":"Users count only with evidence."},{"q":"They’ll evaluate vendors in about 11 months. Timeline grade?","o":["Yellow","Green","Red"],"a":0,"w":"9–12 months is yellow."},{"q":"A partner books a meeting but the decision-maker drops out the day before. Best move?","o":["Reschedule rather than run without the decision-maker","Send a deck","Run it with whoever comes","Cancel the account"],"a":0,"w":"Stand-in meetings stalled."},{"q":"A prospect asks for a “POC on dummy data first”. What is that, really?","o":["A demo or workshop; a POC needs their data, NDA, LOI and the right stakeholders","A free POC","A contract","A paid POC"],"a":0,"w":"Name it right."},{"q":"Which lead should you drop at qualification?","o":["A contract manufacturer making goods only for other brands","A D2C brand shipping 50k pieces a month","A food distributor with its own warehouses","A 200-store retailer planning in Excel"],"a":0,"w":"Manufacturer for others only is out of ICP."},{"q":"All BANT letters are green, ICP fits, and the next call is agreed. Next step?","o":["Hand straight to the Sales Director as a qualified opportunity","Nurture","Disqualify","Hold"],"a":0,"w":"All green goes to the Sales Director."},{"q":"Best open question to uncover Need?","o":["“Do you have inventory problems?”","“Are you happy?”","“Can you afford us?”","“What isn’t working today, and what would make you change systems?”"],"a":3,"w":"Open, specific, change-oriented."},{"q":"A rep pitches features for 15 minutes on a 30-minute discovery call. What went wrong?","o":["Too few slides","Nothing","The prospect should talk ~70%; positioning comes last and links only to named pains","Too short"],"a":2,"w":"Discover before positioning."},{"q":"The handoff form is missing Budget and Decision ownership. Can the meeting be booked?","o":["Yes","Only for partners","Only on Fridays","No: all seven mandatory items are needed"],"a":3,"w":"No form, no booking."},{"q":"A prospect went live on a new WMS four months ago. Status?","o":["Disqualify forever","POC","Qualified","Nurture: systems replaced in the last 12 months rarely change"],"a":3,"w":"Under 12 months = nurture."},{"q":"Which is the best budget question?","o":["“What do you spend on systems today, and how are projects like this usually funded?”","Skip it","“What’s your budget?”","“Are you rich?”"],"a":0,"w":"Ask about current spend and funding."},{"q":"“Dispatch is slow.” Which follow-up climbs the probing ladder correctly?","o":["“Send me data.”","“What’s your budget?”","“Buy our WMS.”","“Compared with which target? Walk me through the last delayed order.”"],"a":3,"w":"Clarify, then ask for an incident."},{"q":"A partner says “they’re very keen, book it!” but no pain or stakeholder is confirmed. Status?","o":["Qualified","Hand to Sales","Not qualified yet: run your own discovery","Disqualify"],"a":2,"w":"Partner enthusiasm isn’t BANT."}]},"GX":{"title":"Part G checkpoint","mins":15,"cp":true,"intro":"15 scenario questions on partnerships and commercial models. Pass 80% to unlock the final exam.","cards":[{"h":"Part G checkpoint","b":[{"t":"grid","items":[["15 questions","Partner types, commercial models, partner questions and the partner lifecycle."],["Pass mark","80% (12 of 15) unlocks the final exam."]]}]}],"quiz":[{"q":"A boutique consultancy advising retailers on transformation wants to partner. Best-fit model?","o":["Pure referral","Co-sell, delivery or implementation partnership","Lead-gen agency","Reseller only"],"a":1,"w":"Consulting firms rarely get referral requests from clients."},{"q":"A firm wants to buy Increff, bill the client itself and own the contract. Which type?","o":["Finder","Lead-gen agency","Reseller","Referral"],"a":2,"w":"Resellers own billing and the contract."},{"q":"A 3PL runs a warehouse for a brand using Increff. Who does Increff charge?","o":["The 3PL","The brand, with a back-to-back agreement with the 3PL","Nobody","The courier"],"a":1,"w":"Technology is billed to the brand."},{"q":"An agency offers 20 meetings a month on a fixed retainer. What is the right way to judge them?","o":["Meetings booked","Cost per BANT-qualified, held meeting","Their logo list","Number of emails sent"],"a":1,"w":"Judge on qualified, held meetings."},{"q":"An agency charges a fixed monthly fee. 10 meetings are booked, 5 held, 2 clear BANT. What do you divide the fee by?","o":["17","10","2","5"],"a":2,"w":"Only qualified, held meetings count."},{"q":"Which commercial model does management prefer for agencies?","o":["Large fixed retainers","CPL or performance-based, ideally pay per qualified meeting","Equity","Annual prepayment"],"a":1,"w":"Management is sensitive to fixed costs."},{"q":"A partner asks: “Will you go direct and cut us out?” Best answer?","o":["“Yes.”","“Trust us.”","Clear written rules on account ownership, lead registration and the revenue-share term; escalate to partnerships leadership","“Maybe later.”"],"a":2,"w":"No verbal assurances."},{"q":"A partner asks for a website listing and a fixed 20% revenue share on the first call.","o":["Refuse to partner","Listing needs an owner; revenue share is case by case: don’t quote a % unprompted","Agree to both","Agree to 20% only"],"a":1,"w":"No commitments without owners."},{"q":"A 3PL partner asks who owns the stock in its warehouse.","o":["The brand","The carrier","Increff","The 3PL"],"a":0,"w":"The 3PL is a fulfilment provider."},{"q":"A partner’s client needs raw-material planning for its factory.","o":["Out of scope: finished goods only; offer a partner referral","Book AI Planning OS","Book WMS","Promise a build"],"a":0,"w":"Finished goods only."},{"q":"When does a partner-sourced lead become an SQL?","o":["When the partner says so","After a deck is sent","When booked","After a qualification meeting validates all BANT criteria"],"a":3,"w":"Strict BANT for everyone."},{"q":"Opening a new market with a partner: what happens in weeks 1–2?","o":["Sign the contract only","Run ads","Define 50–80 target accounts, run the pre-check, and check DNC and CRM ownership with Increff","Book as many meetings as possible"],"a":2,"w":"Build the right list first."},{"q":"Which metric should NOT be the goal of a partner programme?","o":["Meetings held with an ICP buyer","Meetings reaching a second call","Meetings booked","No-show rate"],"a":2,"w":"Booked meetings alone count for nothing."},{"q":"A partner’s carrier needs to send COD and delivery status back. How should it flow?","o":["By email","Not possible","A three-way integration: brand OMS/website, Increff OMS and the carrier","Through WhatsApp"],"a":2,"w":"Ideally from the carrier’s system."},{"q":"What must come with every lead a partner hands over?","o":["A deck","A logo","The handoff form filled and BANT graded","A discount request"],"a":2,"w":"No form, no booking."}]},"X1":{"title":"Final certification exam","mins":40,"exam":true,"intro":"30 questions drawn at random from every module. Score 80% to earn your certificate.","cards":[{"h":"Before you start","b":[{"t":"grid","items":[["30 questions","Scenario questions drawn from every part of the academy."],["Pass mark","80% (24 of 30)."],["Certificate","Pass to unlock your Increff Learning Academy certificate, with your name and date."],["Tip","Use the glossary and the recap pages to revise first. Retake as often as you need."]]}]}],"quiz":[{"q":"A store chain has 40% more stock than last year and still loses sales on best-sellers. What is the most likely explanation?","o":["They need to buy more of everything","Stock is in the wrong place, size mix or time","Their stores are too small","It can’t happen; excess means no stock-outs"],"a":1,"w":"Excess and stock-outs often exist together. Buying more of everything usually makes excess worse."},{"q":"“Orders download from our website manually every morning. The warehouse itself runs fine.” Which problem category is this?","o":["Inventory decisions","Connectivity","Execution","Markdown"],"a":1,"w":"Information isn’t moving between systems. Investigate the order flow before proposing anything for the warehouse."},{"q":"A 3PL asks to use Increff for its warehouses. Who owns the stock inside?","o":["The 3PL","Increff","The brands whose goods they store","The courier"],"a":2,"w":"A 3PL is a fulfilment provider. The brand owns the inventory."},{"q":"A planner says: “We send the first lot to stores at launch, then top up weekly.” Which two terms describe this?","o":["Markdown, then IST","Allocation, then replenishment","OTB, then WSSI","Putaway, then picking"],"a":1,"w":"The first distribution is allocation. Weekly top-ups are replenishment."},{"q":"A regional head is keen, but every tech decision is made at global HQ. Verdict?","o":["Qualified","Nurture: ask for an intro to HQ","Disqualify","Hand to Sales Director"],"a":1,"w":"Authority sits elsewhere."},{"q":"Best model for a consulting firm?","o":["Pure referral","Co-sell, delivery or implementation partnership","Reseller only","None"],"a":1,"w":"Clients rarely ask for consulting referrals."},{"q":"A wholesaler moves full cartons and finds scanning every single unit too slow. Which tracking approach fits better?","o":["Serialized, every unit scanned","Non-serialized, tracked by SKU and unit of measure","RFID on every item","No tracking"],"a":1,"w":"Non-serialized tracking by SKU and UoM suits bulk, carton-based operations."},{"q":"A store sold 84 units in 4 weeks and has 63 units left. Roughly how many weeks of cover does it have?","o":["1 week","3 weeks","4 weeks","21 weeks"],"a":1,"w":"ROS = 84 ÷ 4 = 21 a week. Cover = 63 ÷ 21 = 3 weeks."},{"q":"A prospect’s SLA adherence went from 80% to 92%. How should you describe it?","o":["A 12% rise","A 12 percentage-point rise (15% relative)","A 92% rise","A 15 percentage-point rise"],"a":1,"w":"92 − 80 = 12 points. 12 ÷ 80 = 15% relative."},{"q":"“We can’t decide which warehouse should ship an order that has stock in two places.” Which system’s job is this?","o":["OMS","POS","ERP","Carrier"],"a":0,"w":"Choosing the fulfilment node across locations is order coordination: the OMS."},{"q":"When does a partner lead become an SQL?","o":["When booked","After a qualification meeting validates all BANT criteria","When the partner says so","After a deck is sent"],"a":1,"w":"Strict BANT."},{"q":"A prospect asks: “What’s your exact forecast accuracy?” Best answer?","o":["“95%, guaranteed”","It depends on the client and their history; case studies show 85–90% from month 7, but we’d assess their data first","“We don’t measure it”","Refuse to answer"],"a":1,"w":"Never promise a figure for their business."},{"q":"On a first call, the prospect asks for a 15% discount if they sign this month. What do you do?","o":["Agree to 10% as a middle ground","Note it and route it to Sales, the commercial owner","Refuse to discuss","Promise 15%"],"a":1,"w":"Discounts aren’t yours to give. Escalate rather than improvise."},{"q":"A prospect asks if a feature they saw in a demo video is live today. You’re not sure. What do you say?","o":["Yes, it’s live","It’s on the roadmap for next quarter","I’ll confirm the current status with Presales","We can build it for you"],"a":2,"w":"State only confirmed status; never give roadmap dates."},{"q":"“We oversell online.” Which module do you think of first?","o":["Markdown optimisation","OMS","Label software","MFP"],"a":1,"w":"One inventory view across channels is the OMS’s job."},{"q":"Who creates the stock transfer orders after a replenishment recommendation?","o":["AI Planning OS","The ERP","The courier","The POS"],"a":1,"w":"Recommendations are pushed to the ERP, which creates the transfer orders."},{"q":"A wholesaler wants bulk putaway. Which tracking mode?","o":["Serialized","Non-serialized"],"a":1,"w":"Bulk putaway and bulk return exist only in non-serialized mode."},{"q":"How can a brand keep 50 of 100 units for B2B?","o":["Not possible","Virtual inventory pools mapped to B2B","Manual spreadsheet","Separate warehouse only"],"a":1,"w":"Pools split exposure by channel."},{"q":"A retailer’s real problem is store receiving and backroom stock. Is that ship-from-store?","o":["Yes","No: it’s a store inventory management need; route accordingly"],"a":1,"w":"A classic mis-routed demo."},{"q":"Two shoe businesses: one ships pallets to dealers, one ships single parcels to consumers. Same discovery?","o":["Yes, same industry","No: operating model and unit change the discovery"],"a":1,"w":"Carton-based vs piece-pick."},{"q":"Does the retailer have to replace SAP?","o":["Yes","No: SAP stays the source of truth; Increff is the execution layer"],"a":1,"w":"No rip-and-replace."},{"q":"“Send me something and I’ll share it internally.” No pain, no next step. Best move?","o":["Send the full catalogue","Push for a specific next step or who else to involve before sending","Mark Qualified","Disqualify"],"a":1,"w":"The polite no: get a next step first."},{"q":"“They have the same features.” Best response?","o":["“Ours are better.”","“Let’s pick two or three scenarios that matter to you and have each option demonstrate them.”","“They’re cheap for a reason.”","“Let me see their proposal.”"],"a":1,"w":"Compare on scenarios."},{"q":"“So you’ll replace our ERP, right?” What type?","o":["Misunderstanding","Constraint","Concern","Mismatch"],"a":0,"w":"Their interpretation is incorrect."},{"q":"“Your price is too high.” What is your first move?","o":["Offer 10% off","Explore: which component, and compared with what scope?","Say we are premium","End the call"],"a":1,"w":"Diagnose before responding."},{"q":"“Do you integrate with our exact system?” Best response?","o":["“Yes, we integrate with everything.”","“The system name is only the start; we’ll confirm the connector and required flows.”","“No.”","“Ask the ERP vendor.”"],"a":1,"w":"Validate exact scope."},{"q":"A brand says: “Our 3PL runs the warehouse and their WMS is fine.” What do you do?","o":["Book a WMS demo","Don’t book WMS; look for order (multi-channel stock) or planning pain","Disqualify the brand forever","Offer to run their warehouse"],"a":1,"w":"The brand isn’t the WMS buyer."},{"q":"A COO is keen on AI Planning OS and is your only contact. Accept the lead?","o":["Yes","No: a COO / Head of Supply Chain is a WMS / OMS buyer, not an AI Planning OS buyer","Only in India","Only if they have 20 stores"],"a":1,"w":"Find the merchandising or planning owner."},{"q":"They will choose a vendor in about 10 months. Timeline?","o":["Green","Yellow","Red"],"a":1,"w":"A 9–12 month evaluation timeline is yellow."},{"q":"Budget green, Authority green, Need green, Timeline red. What happens?","o":["Hand to Sales Director","Discuss with Increff","Hold: do not hand off","Book a POC"],"a":2,"w":"Any red means hold."}]}};
const GLOSSARY=[["3PL","Third-party logistics: a company that runs warehousing and fulfilment for brands. It doesn’t own the stock.","A2"],["Allocation","The initial distribution of stock to stores or channels.","A3"],["ASN","Advance shipping notice: the supplier’s note of what is coming.","A4"],["Assortment width / depth","Width = variety of options; depth = units per option.","A3"],["AWB","Air waybill: the shipment tracking reference.","A4"],["B2B / wholesale","Selling in bulk to other businesses.","A2"],["Bin","A recorded storage location in a warehouse.","A4"],["BOPIS","Buy online, pick up in store (click-and-collect).","A4"],["BORIS","Buy online, return in store.","A4"],["Broken size run","A style missing key sizes in a location.","A3"],["Cancellation rate","Cancelled orders or units ÷ total; split customer vs seller-side.","A5"],["Channel","Where a customer buys: store, website/app, marketplace, wholesale.","A1"],["COD","Cash on delivery.","A4"],["Cross-docking","Shipping goods out on arrival, with no putaway or picking.","A4"],["Cycle count","Regularly counting part of the stock.","A4"],["D2C","Direct-to-consumer: a brand selling straight to customers online.","A2"],["Dark store","A small fulfilment hub near customers, closed to walk-ins.","A4"],["Demand forecast","An estimate of future sales.","A3"],["Endless aisle","Selling items not in this store from the wider network.","A4"],["ERP","The core business system for records, procurement and finance; usually the system of record.","A6"],["FEFO","First expired, first out.","A4"],["FIFO","First in, first out.","A4"],["Full-price sell-through","Sell-through counting only units sold without markdown.","A5"],["GRN","Goods received note.","A4"],["Inventory accuracy","Match between recorded and actual stock, under a stated method.","A5"],["Inventory turns","COGS ÷ average inventory at cost.","A5"],["IST","Inter-store transfer.","A3"],["Item / serial identifier","An ID for one physical unit, not just its SKU.","A3"],[  root.querySelectorAll("[data-calc]").forEach(c=>{const k=c.dataset.calc,o=c.querySelector(".out"),v=s=>parseFloat((c.querySelector("["+s+"]")||{}).value)||0;
  const f=n=>(Math.round(n*10)/10).toLocaleString("en-IN");

   if(k==="st")o.innerHTML=a>0?`Sell-through <b>${f(b/a*100)}%</b> &nbsp;\u00b7&nbsp; Full-price sell-through <b>${f(Math.max(b-cc,0)/a*100)}%</b>`:"Enter units received.";

   if(k==="cpl"){const q=a*(b/100)*(cc/100),d=v("data-d"),e=v("data-e");o.innerHTML=q>0?`Qualified meetings: <b>${f(q)}</b> &nbsp;\u00b7&nbsp; Retainer cost per qualified meeting <b>${f(d/q)}</b> &nbsp;\u00b7&nbsp; CPL cost per qualified meeting <b>${f(e*a/q)}</b>`:"No qualified meetings at these rates.";}
   if(k==="pp")o.innerHTML=a>0?`Change: <b>${f(b-a)} percentage points</b>, which is <b>${f((b-a)/a*100)}%</b> relative`:"Enter a starting %.";};

/* ---------- recap ---------- */
function recap(M){
 const rows=[],qa=[],tabs=[];
 M.cards.forEach(c=>c.b.forEach(b=>{
  if(b.t==="flip")b.items.forEach(i=>rows.push([i[0],i[1]]));
  if(b.t==="grid")b.items.forEach(i=>rows.push([i[0],i[1]]));
  if(b.t==="people")b.items.forEach(i=>rows.push([i[0],i[1]]));
  if(b.t==="steps")b.items.forEach(i=>rows.push([i[0],i[1]]));
  if(b.t==="stats")b.items.forEach(i=>rows.push([i[0],i[1]]));
  if(b.t==="flow")b.steps.forEach(i=>rows.push([i[0],i[1]+" <i>Where Increff fits:</i> "+i[2]]));
  if(b.t==="tabs")tabs.push(b);
  if(b.t==="table")tabs.push({tbl:b});
  if(b.t==="bant")b.ex.forEach(e=>qa.push([e[0]+" \u2192 "+e[1].split("").map((k,i)=>"BANT"[i]+":"+({G:"Green",Y:"Yellow",R:"Red"})[k]).join(" "),e[2]]));
  if(b.t==="reveal")qa.push([b.q,b.a]);
  if(b.t==="tip")qa.push(["Remember",b.x]);
 }));
 let h=`<div class="card"><h2>Recap before the quiz</h2><div class="sub">Everything in this module on one page. The quiz only tests what is here.</div>`;
 if(rows.length)h+=`<div class="blk"><table class="rc">${rows.map(r=>`<tr><th>${r[0]}</th><td>${r[1]}</td></tr>`).join("")}</table></div>`;
 tabs.forEach(b=>{if(b.tbl){h+=`<div class="blk">${blk(b.tbl)}</div>`;return;}const lab=b.labels||["Recognise","Ask","Validate"];h+=`<div class="blk"><table class="rc"><tr><th></th>${lab.map(l=>`<th>${l}</th>`).join("")}</tr>${b.items.map(i=>`<tr><th>${i[0]}</th>${i.slice(1).map(v=>`<td>${v}</td>`).join("")}</tr>`).join("")}</table></div>`;});
 if(qa.length)h+=`<div class="blk">${qa.map(x=>`<div class="rcq"><b>${x[0]}</b><div>${x[1]}</div></div>`).join("")}</div>`;
 return h+`</div>`;}
/* ---------- lesson ---------- */
function lesson(id,step){
 const M=MODULES[id],C_=M.cards.length,R_=(M.exam||M.cp)?-1:C_,n=C_+((M.exam||M.cp)?1:2);
 const seen=S["seen_"+id]||0;
 let h=`<div class="lhead"><button class="back" id="bk">\u2190 All modules</button><div class="t"><small>Module ${id}</small>${M.title}</div></div>
 <div class="steps-bar">${Array.from({length:n},(_,i)=>`<span data-s="${i}" class="${i===step?"on":i<=seen?"seen":""}" title="${i<C_?esc(M.cards[i].h):i===R_?"Recap":"Quiz"}"></span>`).join("")}</div>`;
 if(step===R_){h+=recap(M)+`<div class="nav"><button class="btn ghost" id="pv">\u2190 Back</button><span style="color:var(--muted);font-size:14px">${step+1} / ${n}</span><button class="btn c" id="nx">Take the quiz \u2192</button></div>`;}
 else if(step<C_){const C=M.cards[step];
  h+=`<div class="card"><h2>${C.h}</h2>${C.sub?`<div class="sub">${C.sub}</div>`:""}${C.b.map(b=>`<div class="blk">${blk(b)}</div>`).join("")}</div>
  <div class="nav"><button class="btn ghost" id="pv" ${step?"":"disabled"}>\u2190 Back</button><span style="color:var(--muted);font-size:14px">${step+1} / ${n}</span><button class="btn ${step===C_-1&&(M.exam||M.cp)?"c":""}" id="nx">${step===C_-1?(M.exam?"Start the exam \u2192":M.cp?"Start the checkpoint \u2192":"Recap \u2192"):"Next \u2192"}</button></div>`;
 } else h+=quizHTML(id);
 app.innerHTML=h;window.scrollTo(0,0);
 if(step>seen){S["seen_"+id]=step;save();}
 document.getElementById("bk").onclick=home;
 app.querySelectorAll(".steps-bar span").forEach(s=>s.onclick=()=>lesson(id,+s.dataset.s));
 if(step<C_||step===R_){document.getElementById("nx").onclick=()=>lesson(id,step+1);const pv=document.getElementById("pv");if(step)pv.onclick=()=>lesson(id,step-1);wire(app);}
 else wireQuiz(id);
}
function quizHTML(id){const M=MODULES[id];
 return`<div class="card qz" id="qz"><h2>Quiz: ${M.title}</h2><div class="sub">${M.quiz.length} questions. Score 80% to pass and unlock the next module.</div>
 ${M.quiz.map((q,i)=>`<div class="qi" data-q="${i}"><div class="qt"><span>Q${i+1}.</span>${q.q}</div>${q.o.map((o,j)=>`<button class="opt" data-o="${j}">${String.fromCharCode(97+j)}) ${o}</button>`).join("")}<div class="why">${q.w}</div></div>`).join("")}
 <div id="qres"></div><div class="nav"><button class="btn ghost" id="qback">\u2190 Back</button>${REVIEW?`<button class="btn" id="akey">Show answer key (reviewer)</button>`:""}<button class="btn c" id="qsub">Submit answers</button></div></div>`;}
function wireQuiz(id){const M=MODULES[id],ans={};
 app.querySelectorAll(".qi").forEach(qi=>qi.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{if(document.getElementById("qz").classList.contains("graded"))return;qi.querySelectorAll(".opt").forEach(z=>z.classList.remove("sel"));o.classList.add("sel");ans[qi.dataset.q]=+o.dataset.o;}));
 document.getElementById("qback").onclick=()=>lesson(id,(M.exam||M.cp)?M.cards.length-1:M.cards.length);
 const ak=document.getElementById("akey");if(ak)ak.onclick=()=>{app.querySelectorAll(".qi").forEach(qi=>{const q=M.quiz[+qi.dataset.q];qi.querySelectorAll(".opt").forEach(o=>{if(+o.dataset.o===q.a)o.classList.add("ok");});});document.getElementById("qz").classList.add("graded");ak.remove();};
 document.getElementById("qsub").onclick=()=>{
  if(Object.keys(ans).length<M.quiz.length){document.getElementById("qres").innerHTML=`<div class="tip" style="margin-top:14px">Answer all ${M.quiz.length} questions first.</div>`;return;}
  let c=0;app.querySelectorAll(".qi").forEach(qi=>{const i=+qi.dataset.q,q=M.quiz[i];qi.querySelectorAll(".opt").forEach(o=>{const j=+o.dataset.o;if(j===q.a)o.classList.add("ok");else if(j===ans[i])o.classList.add("bad");});if(ans[i]===q.a)c++;});
  document.getElementById("qz").classList.add("graded");
  const pc=Math.round(c/M.quiz.length*100),pass=pc>=80,i=ORDER.indexOf(id),nxt=ORDER[i+1];
  if(!REVIEW){S.att[id]=(S.att[id]||[]).concat([{s:pc,t:Date.now()}]);save();}
  if(pass&&!REVIEW){S.done[id]=Math.max(S.done[id]||0,pc);if(M.exam)S.cert={name:S.name||"",date:new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"}),score:pc};save();}
  push({type:M.exam?"exam":M.cp?"checkpoint":"quiz",module:id,title:M.title,score:pc,passed:pass,attempt:(S.att[id]||[]).length});
  const certH=(pass&&M.exam)?cert(REVIEW?{name:S.name||"Reviewer",date:new Date().toLocaleDateString("en-GB"),score:pc}:S.cert):"";
  document.getElementById("qres").innerHTML=certH+`<div class="res ${pass?"pass":"fail"}"><b>${pc}%</b><div style="flex:1">${pass?`Passed${S.name?", "+esc(S.name):""}. ${nxt?"Next module unlocked.":"You\u2019ve finished every module available so far."}`:"Not yet. Read the explanations below each question, then retake."}</div>
   ${pass&&nxt?`<button class="btn c" id="gonext">Start ${nxt} \u2192</button>`:`<button class="btn" id="retry">${pass?"Back to home":"Retake quiz"}</button>`}</div>`;
  const s=document.getElementById("qsub");s.style.display="none";
  const g=document.getElementById("gonext");if(g)g.onclick=()=>lesson(nxt,0);
  const r=document.getElementById("retry");if(r)r.onclick=()=>pass?home():lesson(id,(M.exam||M.cp)?M.cards.length:M.cards.length+1);
  document.getElementById("qres").scrollIntoView({behavior:"smooth",block:"center"});
 };}

</svg></div><div class="ck">Certificate of completion</div><div class="cn">${esc(c.name||"Your name")}</div><div class="ct">has completed the <b>Increff Learning Academy</b>${EDITION==="internal"?"":" (Partner edition)"}, covering retail fundamentals, Increff products, competition, BANT qualification and partnerships, and passed the final certification exam with <b>${c.score}%</b>.</div><div class="cd">${c.date}</div></div>`;}
/* ---------- admin tracker ---------- */
function topbar(){const b=document.getElementById("trBtn");if(b){b.style.display=ISADMIN&&DB?"":"none";b.onclick=tracker;}}
const fmtD=t=>t?new Date(t).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}):"";
async function tracker(){if(!ISADMIN||!DB)return;app.innerHTML=`<div class="lhead"><button class="back" id="bk">\u2190 Home</button><div class="t"><small>Admin</small>Learner tracker \u00b7 ${EDITION} edition</div></div><div class="card" id="trc">Loading\u2026</div>`;document.getElementById("bk").onclick=home;
 const box=document.getElementById("trc");const timer=setTimeout(()=>{box.textContent="Can\u2019t reach the data yet. Try again in a minute.";},10000);
 let L=[],roster="";try{const q=await DB.collection("learners").get();L=q.docs.map(d=>d.data());const r=await DB.doc("admin/roster").get();if(r.exists)roster=r.data().text||"";}catch(e){clearTimeout(timer);box.textContent="Couldn\u2019t load the tracker ("+(e&&e.code||"error")+").";return;}
 clearTimeout(timer);const N=ORDER.length;
 const rows=L.map(d=>{const a=d.attempts||{};let tot=0,mods=0,retake=0;for(const k in a){const n=(a[k]||[]).length;tot+=n;if(n)mods++;retake+=Math.max(0,n-1);}
  const ex=(a.X1||[]),best=ex.length?Math.max(...ex.map(x=>x.s)):null,passed=Object.keys(d.passed||{}).filter(k=>MODULES[k]).length;
  return{name:d.name||"",email:d.email||"",org:d.org||"",passed,tot,retake,exA:ex.length,best,cert:d.cert?d.cert.date:"",last:d.lastActive,status:d.cert?"Certified":passed>=N?"Completed":tot?"In progress":"Registered"};}).sort((x,y)=>(y.last||0)-(x.last||0));
 const emails=new Set(rows.map(r=>r.email.toLowerCase()));
 const ros=roster.split(/\n/).map(l=>l.trim()).filter(Boolean).map(l=>{const p=l.split(",").map(x=>x.trim());const em=p.find(x=>x.includes("@"))||"";return{line:l,email:em.toLowerCase(),name:p[0]&&!p[0].includes("@")?p[0]:"",org:p[2]||p[1]&&!p[1].includes("@")?p[p.length-1]:""};});
 const notStarted=ros.filter(r=>r.email&&!emails.has(r.email));
 const head=["Name","Email","Organisation","Status","Modules passed","Quiz attempts","Retakes","Exam attempts","Best exam %","Certified on","Last active"];
 const csv=[head.join(",")].concat(rows.map(r=>[r.name,r.email,r.org,r.status,r.passed+"/"+N,r.tot,r.retake,r.exA,r.best??"",r.cert,fmtD(r.last)].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(","))).concat(notStarted.map(r=>['"'+r.name+'"','"'+r.email+'"','"'+r.org+'"','"Not started"',"","","","","","",""].join(","))).join("\n");
 box.innerHTML=`<div class="stats"><div><b>${rows.length}</b><span>registered</span></div><div><b>${rows.filter(r=>r.tot).length}</b><span>attempted at least one quiz</span></div><div><b>${rows.filter(r=>r.cert).length}</b><span>certified</span></div><div><b>${notStarted.length}</b><span>on roster, not started</span></div><div><b>${rows.reduce((s,r)=>s+r.retake,0)}</b><span>total retakes</span></div></div>
 <div class="blk tw" style="margin-top:16px"><table class="rc tbl"><tr>${head.map(h=>`<th>${h}</th>`).join("")}<th></th></tr>${rows.map((r,i)=>`<tr><th>${esc(r.name)}</th><td>${esc(r.email)}</td><td>${esc(r.org)}</td><td>${r.status}</td><td>${r.passed}/${N}</td><td>${r.tot}</td><td>${r.retake}</td><td>${r.exA}</td><td>${r.best??""}</td><td>${esc(r.cert)}</td><td>${fmtD(r.last)}</td><td><button class="lnk" data-dt="${i}">Details</button></td></tr>`).join("")}${notStarted.map(r=>`<tr><th>${esc(r.name)}</th><td>${esc(r.email)}</td><td>${esc(r.org)}</td><td><span class="pill p-c">Not started</span></td><td colspan="8"></td></tr>`).join("")}</table></div>
 <div id="dt"></div>
 <div class="nav"><button class="btn" id="cpcsv">Copy as CSV</button><span></span></div>
 <h2 style="margin-top:24px;font-size:20px">Expected learners (roster)</h2><div class="sub">One per line: <i>Name, email, Organisation</i>. Anyone here who hasn\u2019t registered shows as <b>Not started</b>.</div>
 <textarea id="rost" style="width:100%;min-height:140px;border:1.5px solid var(--line);border-radius:10px;padding:10px;font:inherit">${esc(roster)}</textarea>
 <div class="nav"><span id="rsm" style="color:var(--muted);font-size:14px"></span><button class="btn c" id="rsave">Save roster</button></div>`;
 const raw=L.slice().sort((x,y)=>(y.lastActive||0)-(x.lastActive||0));
 box.querySelectorAll("[data-dt]").forEach(b=>b.onclick=()=>{const d=raw[+b.dataset.dt],a=d.attempts||{};document.getElementById("dt").innerHTML=`<div class="blk"><b>${esc(d.name)}</b> \u00b7 attempts per module<table class="rc tbl" style="margin-top:8px"><tr><th>Module</th><th>Attempts</th><th>Scores (in order)</th><th>Passed</th></tr>${ORDER.map(m=>{const x=a[m]||[];return`<tr><th>${m} ${esc(MODULES[m].title)}</th><td>${x.length}</td><td>${x.map(z=>z.s+"%").join(" \u2192 ")}</td><td>${(d.passed||{})[m]?d.passed[m]+"%":""}</td></tr>`;}).join("")}</table></div>`;document.getElementById("dt").scrollIntoView({behavior:"smooth"});});
 document.getElementById("cpcsv").onclick=e=>{navigator.clipboard.writeText(csv).then(()=>{e.target.textContent="Copied";}).catch(()=>{e.target.textContent="Copy failed";});};
 document.getElementById("rsave").onclick=async()=>{const m=document.getElementById("rsm");m.textContent="Saving\u2026";try{await DB.doc("admin/roster").set({text:document.getElementById("rost").value,updatedAt:Date.now()});m.textContent="Saved.";tracker();}catch(e){m.textContent="Couldn\u2019t save ("+(e&&e.code||"error")+").";}};
}
/* ---------- glossary ---------- */
const gl=document.getElementById("gl"),glL=document.getElementById("glL"),glQ=document.getElementById("glQ");
function renderGl(){const q=glQ.value.toLowerCase();glL.innerHTML=GLOSSARY.filter(g=>MODULES[g[2]]&&(g[0]+" "+g[1]).toLowerCase().includes(q)).sort((a,b)=>a[0].localeCompare(b[0])).map(g=>`<div class="it"><b>${g[0]}</b>${g[1]} <a data-gm="${g[2]}">Module ${g[2]} \u2192</a></div>`).join("")||"<p style='color:var(--muted)'>No match.</p>";
 glL.querySelectorAll("[data-gm]").forEach(a=>a.onclick=()=>{const m=a.dataset.gm;gl.classList.remove("open");if(unlocked(m))lesson(m,0);});}
document.getElementById("glBtn").onclick=()=>{gl.classList.add("open");glQ.value="";renderGl();glQ.focus();};
document.getElementById("glX").onclick=()=>gl.classList.remove("open");
gl.onclick=e=>{if(e.target===gl)gl.classList.remove("open");};
glQ.oninput=renderGl;
document.getElementById("homeBtn").onclick=home;
document.addEventListener("keydown",e=>{if(e.key==="Escape")gl.classList.remove("open");});
home();
</script>
