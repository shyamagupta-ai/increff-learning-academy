its own","“We broker deals between manufacturers and retailers.”"],["Out-of-ICP industry","Oil & gas, BFSI, insurance, pure services or pure digital / software","The company sells a service or software, not goods."],["Makes goods for other brands only","A manufacturer with no retail stores and no owned brand","“We are a contract manufacturer for global brands.”"],["B2B-only pharma","Pharma with only B2B distribution is not qualified, even though pharma distribution is a WMS fit","“We only supply hospitals and distributors.”"],["Below the floor","Below the product’s revenue / volume floor with no funded growth plan","“About 3,000 orders a month” or “we are just launching”."],["Wrong use case","TMS-only, PLM, QSR, manpower management, space planning or visual merchandising","“We need help planning shelf space in small stores.”"],["AI Planning OS: wholesale-led or tiny","Majority-wholesale business, a single store, or a handful of styles","“80% of our sales go through distributors.”"],["AI Planning OS: no sales history","No historical sales data to plan from","“We don’t track sales by store or style yet.”"],["On-premise only","Increff is cloud-only","“Everything must run on our own servers.”"],["No one with influence","No Economic Buyer, Champion or Evaluator can be identified","Only junior staff respond; nobody can name who decides."],["Fundamental blocker","Competitor-owned, mid-acquisition, or in administration","“We’re being acquired; all IT decisions are frozen.”"]]}]},{"h":"Who to book the meeting with","b":[{"t":"grid","items":[["Book with","Head level and above: Founder / CXO; Heads of Supply Chain, Operations, Warehouse, Logistics, E-commerce, Merchandising, Planning, Buying; IT / Digital leaders."],["Not as the primary contact","Managers, junior coordinators and analysts; stand-ins for the real owner; engineers only; procurement with no business owner; consultants without the client on the call. Retail operations is not a target role."]]}]},{"h":"Buying roles: score every contact","sub":"Click a product to see the titles for each role.","b":[{"t":"tabs","items":[["WMS, piece-level","Founder, Co-founder, CEO (D2C); COO, Head / VP Supply Chain, Head of Operations (mid-market)","Head of Operations, Warehouse Head, Founder’s Office, Head of Fulfilment, Digital Transformation Head","E-commerce Manager, Head of E-commerce, CTO, CIO, Head of IT, CFO, Finance Head","Warehouse Manager, Inventory Manager, Fulfilment Centre Manager, Operations Manager","Tax Head"],["WMS, carton/pallet","COO, Head / VP Supply Chain, Director Operations, Managing Director (mid-size distributors)","Head of Warehousing, Head of Distribution, Logistics Head, Digital Transformation Head","CTO, Head of IT, ERP / SAP Lead, CFO","Warehouse Manager, DC Manager, Inventory Controller","Tax Head"],["AI Planning OS","CEO, Founder, Business Head, Merchandising Director, VP Merchandising, CFO (co-signer), Group Strategy Director (international)","Head of Planning, Central Planner, Replenishment Manager, Allocation Manager","Buying Head, Head of Buying, Analytics / Data Lead, Head of IT","Merchandise Planner, Allocator, Assortment Planner","IT (data ownership), ERP owner, Procurement (on international RFPs)"]],"labels":["Economic Buyer · accepted","Champion · accepted","Evaluator · accepted","User · only with evidence","Blocker · never a lead (flag only)"]},{"t":"grid","items":[["Economic Buyer","Controls or signs off on budget; can say yes."],["Champion","Feels the pain and pushes the deal internally; doesn’t control budget."],["Evaluator","Assesses technically or functionally; can block or recommend."],["User","Operates the system day to day; no budget or evaluation authority."],["Blocker","Can stall or kill the deal."]]},{"t":"reveal","q":"A warehouse supervisor is very keen and books a call. Is that an accepted lead?","a":"Not on its own. A User counts only with <b>evidence</b>: they are driving a funded initiative, have clear influence on the decision, or give a warm intro to the Economic Buyer, Champion or Evaluator. Otherwise, ask them to bring in their head."}]}],"quiz":[{"q":"A 12-store fashion brand plans in Excel and wants AI Planning OS. What is the issue?","o":["None","Below the AI Planning OS bar of minimum 20 stores; flag it to Increff before booking","They need a WMS","They are a 3PL"],"a":1,"w":"AI Planning OS needs at least 20 stores. Exceptions are flagged, not assumed."},{"q":"A beverage distributor ships pallets to retailers from its own warehouse. Which product?","o":["WMS, carton/pallet","AI Planning OS only","Store fulfilment","Not a fit"],"a":0,"w":"Carton/pallet movement from their own warehouse points to the carton/pallet WMS."},{"q":"A brand says: “Our 3PL runs the warehouse and their WMS is fine.” What do you do?","o":["Book a WMS demo","Don’t book WMS; look for order (multi-channel stock) or planning pain","Disqualify the brand forever","Offer to run their warehouse"],"a":1,"w":"The brand isn’t the WMS buyer."},{"q":"A COO is keen on AI Planning OS and is your only contact. Accept the lead?","o":["Yes","No: a COO / Head of Supply Chain is a WMS / OMS buyer, not an AI Planning OS buyer","Only in India","Only if they have 20 stores"],"a":1,"w":"Find the merchandising or planning owner."},{"q":"A prospect insists the system must run on their own servers. What is this?","o":["Fine","A disqualifier: Increff is cloud-only","A yellow on Budget","A Timeline issue"],"a":1,"w":"On-premise-only is a disqualifier."},{"q":"A pharma company supplies only hospitals and distributors. Qualified for WMS?","o":["Yes","No: B2B-only pharma is not qualified","Only for AI Planning OS","Yes, carton/pallet"],"a":1,"w":"B2B-only pharma is a disqualifier."},{"q":"What is the minimum deal for AI Planning OS in India?","o":["₹50k MRR","≥ ₹3L MRR","₹1.5L one-time","No minimum"],"a":1,"w":"≥ ₹3L MRR in India; ~US$3.5k MRR internationally."},{"q":"Which buying role is never a lead?","o":["Champion","Evaluator","User","Blocker"],"a":3,"w":"Blockers are flagged, never counted as leads."}]},"F3":{"title":"BANT in detail","mins":20,"intro":"Each letter: what it means, how to ask, and what green, yellow and red sound like.","cards":[{"h":"The rule","b":[{"t":"p","x":"<b>An opportunity counts only when the meeting is held and it clears the BANT gate.</b> A booked meeting alone doesn’t count. Ten weak meetings are worth less than three strong ones."},{"t":"grid","items":[["B · Budget","Can they fund it? Can they clear the minimum deal?"],["A · Authority","Who decides and signs?"],["N · Need","Is the pain real and costly?"],["T · Timeline","Why now, and when will they choose a vendor?"]]},{"t":"tip","x":"Weave BANT into the conversation. It is not an interrogation or a form read out loud."}]},{"h":"N · Need","sub":"Start here. Without a real need, the other letters don’t matter.","b":[{"t":"reveal","q":"How do we know a pain is real, not just nice to have?","a":"They can <b>name it in their own words</b>, it has a <b>cost to the business</b>, and they’ve <b>already tried to fix it</b>."},{"t":"table","head":["Green","Yellow","Red"],"rows":[["Clear, specific, quantified problem that matches warehouse/order operations or planning","General interest; pain not quantified, or only a partial overlap","No real problem, curiosity only, or outside scope (ERP, TMS-only, PLM)"]]},{"t":"chips","items":["“What is this costing you today?”","“What have you tried so far?”","“Tell me more about that.”","“How does that impact the business?”","“What isn’t working today, and what would make you change systems?”"]}]},{"h":"A · Authority","b":[{"t":"reveal","q":"Your contact says “I’ll take this to my boss.” What’s your next question?","a":"Map who <b>decides</b>, who <b>influences</b> and who <b>signs</b>, and ask who else should <b>join the next call</b>. For example: “Who else would be involved in a decision like this?”"},{"t":"table","head":["Green","Yellow","Red"],"rows":[["Economic Buyer on the call, or a formal RFP","A Champion or Evaluator (accepted, usually yellow until the Economic Buyer is engaged), or multi-layer approval with a known owner","No one owns this internally, or never discussed"]]},{"t":"tip","x":"Ask: “Which team owns this, and does a parent or group company sign off?” A parent company can hold most of the decision."}]},{"h":"B · Budget","b":[{"t":"reveal","q":"Why is “What’s your budget?” a bad question?","a":"It invites a guess or a shutdown. Instead ask <b>what the problem costs them today</b>, or <b>what they already spend</b> on systems. For example: “How are projects like this usually funded?”"},{"t":"table","head":["Green","Yellow","Red"],"rows":[["Already paying for something similar, budget confirmed, or open to an enterprise-level commitment","No budget yet but open to it; needs approval; hesitant on commitment","No budget, no appetite, or never discussed"]]},{"t":"tip","x":"Budget is checked against the product’s minimum deal. A very small current system spend is a warning sign."}]},{"h":"T · Timeline","b":[{"t":"reveal","q":"What makes a prospect act now instead of next year?","a":"A <b>trigger</b>: store or channel expansion, a new warehouse, a system renewal or contract end, peak-season deadlines, a new IT head, an ERP go-live, or the current system no longer scaling."},{"t":"table","head":["Green","Yellow","Red"],"rows":[["Clear trigger; will evaluate and choose within 0–9 months","Evaluation timeline of 9–12 months","12+ months out, no timeline, or “someday, not now”"]]},{"t":"tip","x":"Ask about the <b>evaluation</b> timeline (when they will choose a vendor), not the go-live date. Prospects can’t pin down implementation dates while they’re still evaluating."}]},{"h":"Grade it, and the decision follows","sub":"Click one cell per row, or load a real (anonymised) case.","b":[{"t":"bant","ex":[["3PL-run wholesaler","RYRR","Need red: the gap was in their own ERP and a 3PL runs the warehouse. Own warehouse only in ~2 years; budget never discussed."],["Brand buying a 3PL","YYRG","Need red: buying a full-service 3PL (warehouse + manpower), which we don’t sell. Decision sits with the global parent."],["Distributor “just looking”","RGRR","Head of supply chain on the call, but the current ERP’s WMS “works perfectly”, no project and no timeline. Curiosity, not need."],["12-store retailer","RYYY","~3,000 items a month; minimum billing was beyond budget the moment it came up. Sub-scale."],["D2C brand under a parent","YYGR","Real planning pain, but a manager on the call, most of the decision with the parent, and no timeline."],["Just replaced systems","RYYR","Just went live on new systems, so no replacement budget or timeline. The real need differed from the demo booked."],["Food distributor, budget never asked","RYGY","Strong, quantified need (95% vs 99% accuracy, 8 warehouses), but budget was never asked. One question before booking would have helped."],["FMCG brand, ERP go-live","YGGG","New Head of IT, FEFO picking errors, ERP going live in two months as the trigger. Budget not yet discussed: discuss with Increff before booking."],["Fashion retailer, 1–2 years out","YYGR","Clear warehouse pain, but no budget yet, board approval needed, and a 1–2 year horizon."],["200-store retailer","YGGG","Head of Supply Chain, 200+ stores on Excel, planning work starting. Budget is the gap, being closed through a paid POC."]]},{"t":"grid","items":[["Any red","Hold. Do not hand off; keep scoping."],["One or more yellow","Discuss with Increff before booking; agree how to close the gap."],["All green + ICP fit + next call agreed","Hand straight to the Sales Director as a qualified opportunity."]]}]}],"quiz":[{"q":"“We lose a lot to markdowns, maybe 15% of revenue, and we tried a consultant last year.” How do you grade Need?","o":["Green","Yellow","Red"],"a":0,"w":"Named, costed and already tried to fix: a green Need."},{"q":"A Head of Planning (Champion) says the CFO signs off and will join the next call. Authority?","o":["Green","Yellow: accepted, but the Economic Buyer isn’t engaged yet","Red"],"a":1,"w":"Champions and Evaluators are usually yellow until the EB is engaged."},{"q":"Which is the best budget question?","o":["“What’s your budget?”","“What does this problem cost you today?”","“Can you afford us?”","Skip budget entirely"],"a":1,"w":"Ask what the problem costs or what they spend today."},{"q":"They will choose a vendor in about 10 months. Timeline?","o":["Green","Yellow","Red"],"a":1,"w":"A 9–12 month evaluation timeline is yellow."},{"q":"They might evaluate “in a year or two”. Timeline?","o":["Green","Yellow","Red"],"a":2,"w":"12+ months is red."},{"q":"Budget green, Authority green, Need green, Timeline red. What happens?","o":["Hand to Sales Director","Discuss with Increff","Hold: do not hand off","Book a POC"],"a":2,"w":"Any red means hold."},{"q":"All four letters are yellow. What happens?","o":["Hold forever","Discuss with Increff before booking","Hand straight to the Sales Director","Disqualify"],"a":1,"w":"One or more yellow: agree the plan with Increff first."}]},"F4":{"title":"BANT in the field: what works and what doesn’t","mins":25,"intro":"What a year of partner-sourced meetings taught us, and the questions that would have caught each miss early.","cards":[{"h":"What the numbers say","b":[{"t":"stats","items":[["~80%","of partner-sourced first meetings never reach a second meeting"],["0 of 8","accounts from one partner moved past the first meeting in four months"],["6 → 1","meetings a month for one partner once BANT handoffs began: fewer, but each must progress"]]},{"t":"p","x":"In one market, a partner set up meetings with <b>33 accounts</b> (46 recorded meetings) over 12 months: 9 still progressing (3 at proposal), 0 closed-won so far, and 6 meetings lost to no-shows, failed calls or calls cut short."},{"t":"grid","items":[["Why first meetings stall","The prospect isn’t looking, the wrong person attends, the scale is too small, or the problem sits outside Increff. All of these can be caught before booking."],["What BANT changes","We pay for and plan around meetings that can become opportunities. One well-qualified meeting is worth more than five exploratory ones."],["Where prospects are guarded","In some markets buyers won’t share budget or volumes cold. Give context on why the meeting matters, use the call to fill the gaps, and flag what’s missing in the handoff."]]}]},{"h":"What worked: five things in common","sub":"Click each.","b":[{"t":"tabs","items":[["Function head on call one","A food distributor’s supply chain head shared everything in one call: 8 warehouses, ~1M cases a month, 95–96% accuracy against a 99% requirement. A demo was booked before the call ended.","Meetings with stand-ins stalled."],["A concrete, countable pain","“Accuracy is 95%, we need 99%”, “loaders pick the wrong expiry batch”, “planning is all in Excel across 200 stores”, “cycle counts take 15–30 days”.","Numbers give Increff something to demo against."],["A trigger with a date","A new Head of IT, an ERP going live in two months, a new warehouse or channel launch.","A dated trigger turns interest into a timeline."],["Running their own operations","Multi-store retailers planning in spreadsheets (AI Planning OS) and FMCG / food distributors running their own warehouses (carton/pallet WMS) moved furthest.","These are the segments to target first."],["In person at the right moment","An onsite workshop or warehouse visit after a good demo moved deals forward. Some prospects only share real requirements face to face.","Plan visits around the strongest accounts."]],"labels":["What we saw","Why it matters"]}]},{"h":"What didn’t work: six patterns","sub":"Click each pattern for the fix.","b":[{"t":"tabs","items":[["Pain outside Increff","ERP problems, production planning, buying a full-service 3PL, or space planning for small stores.","Ask “is this ERP, warehouse, stores or planning?” before booking."],["“We’re happy with what we have”","A distributor said its ERP’s WMS module “works perfectly” and joined just to see the market. Another had just gone live on a new WMS.","Ask what would make them change, and when they last changed systems. Under 12 months = nurture."],["Warehouse run by a 3PL","The brand isn’t the WMS buyer; at best it needs an OMS, and it was already talking to a competitor.","Ask who runs the warehouse; if a 3PL, qualify for OMS or AI Planning OS instead."],["Below the scale bar","A 12-store retailer shipping ~3,000 items a month; a brand still launching with 120 SKUs.","Get stores, pieces a month and current system spend before booking."],["Wrong person, team or parent","A supply chain head when e-commerce sat with another team; a manager whose parent company holds 70% of the decision.","Ask who owns the problem and who signs off."],["Nobody turned up","The prospect was unwell, a prior call overran, a no-show on the first slot, a decision-maker who dropped off.","Reconfirm the decision-maker 24 hours before; reschedule rather than run without them."]],"labels":["What happened","The fix"]}]},{"h":"Questions to ask before booking","b":[{"t":"table","head":["Ask before booking","A worrying answer","What it tells you"],"rows":[["“Who runs your warehouse today: your team or a 3PL?”","“A 3PL, and we’re happy with it”","Not a WMS buyer; look for OMS or planning pain"],["“Is the problem in your ERP or in warehouse / store operations?”","“Our ERP can’t record lots / we’re migrating ERP”","ERP project, outside Increff"],["“When did you last change your WMS / OMS?”","“We went live last quarter”","No replacement soon; nurture"],["“How many pieces / orders a month, and how many stores?”","“About 50 SKUs” / “a few thousand pieces”","Below the scale bar"],["“Who signs off, and can they join the first call?”","“I’m standing in for my colleague”","Authority gap; get the owner on the call"],["“Is there a date driving this?”","“Maybe in 1–2 years”","Timeline red"],["“Is budget set aside? What do you spend on systems today?”","“Not yet” / a very small current spend","Budget gap or sub-scale"],["“Are you buying software, or an outsourced warehouse service? Who else has bid?”","“Three 3PLs have sent proposals”","3PL tender, not our buyer"],["“What isn’t working today, and what would make you change systems?”","“Our current system works fine, just exploring”","Need red: curiosity, not a project"],["“Which team owns this, and does a parent or group company sign off?”","“E-commerce sits with another team” / “the parent decides”","Authority gap; find the real owner"],["“Will you share data under NDA so we can show results on your numbers?”","“We want to test first, no data”","Workshop at most; no POC"],["“Can [decision-maker] confirm they’ll join? May I reconfirm the day before?”","“They’ll try to make it”","No-show risk; reconfirm or reschedule"]]}]},{"h":"Case clinic (1/2)","sub":"Read what we heard, decide what was really going on, then reveal.","b":[{"t":"reveal","q":"<b>Wholesale chain.</b> A 14-store wholesale/retail chain wants to discuss WMS. The contact runs the DC and transport, and is interested in lot numbers, shelf life and catch weight for fresh food.","a":"A <b>3PL runs the warehouse</b> and its WMS already handles lots and shelf life. The gap was their own <b>ERP</b> (“it’s not an issue of the WMS, it’s an issue from my side”). Own warehouse only in ~2 years. <b>Ask:</b> who runs the warehouse? Is the gap ERP or operations? How do you allocate to stores (Excel allocation = possible AI Planning OS lead)? <b>Outcome:</b> nurture with a trigger, not a WMS meeting."},{"t":"reveal","q":"<b>Footwear brand.</b> A large footwear brand with 300–400k SKUs wants a WMS & OMS discussion. Its sister company in another country is an Increff client, so it felt like an easy fit.","a":"The local business was <b>buying a full-service 3PL</b>: warehouse, manpower, WMS and OMS in one contract. Three 3PLs had already bid; the decision sat with the global parent. Increff sells software only, so it couldn’t bid. <b>Ask:</b> software, or an outsourced warehouse service? Who has bid, and when is the decision? How do you plan and allocate stock to stores? <b>Outcome:</b> not a fit for this RFP."},{"t":"reveal","q":"<b>Direct-selling retailer.</b> 80+ retail shops with daily inventory mismatches between ERP and stores. A ship-from-store demo was booked.","a":"They had <b>just gone live on a new WMS and commerce platform</b>, so no replacement. Online orders were handled. The real need was <b>store inventory management</b> (warehouse-to-store replenishment, expiry, backroom vs floor). <b>Ask:</b> what did you change in the last 12 months? Is the problem online orders or stock inside the stores? <b>Outcome:</b> right account, wrong product demo."},{"t":"reveal","q":"<b>Sportswear brand.</b> 20 stores, 60–70k orders a month, 80% from marketplaces. A WMS discussion was booked.","a":"The first attendee <b>managed the ERP and was standing in</b> for a colleague. Priority was an <b>ERP migration next year</b>; WMS after that; no WMS budget yet. The fit is real, the timing isn’t. <b>Ask:</b> who owns warehouse operations, and can they join? What projects run in the next 12 months? Is there budget for WMS this year? <b>Outcome:</b> nurture to the ERP go-live."}]},{"h":"Case clinic (2/2)","b":[{"t":"reveal","q":"<b>Food distributor (worked).</b> A Middle East food manufacturer-distributor with 8 warehouses and ~1M cases a month, 90%+ via direct store delivery. A WMS intro was booked with the supply chain function.","a":"A clear, quantified pain: <b>inventory accuracy 95–96% vs a 99% requirement</b>, with returns mixing into stock and breaking FEFO. A non-negotiable was stated upfront (a live scorecard). A demo was booked as the qualification checkpoint. <b>Gap:</b> budget and timeline were never asked; they could have been closed before booking. <b>Outcome:</b> first meeting → demo."},{"t":"reveal","q":"<b>Distributor “just looking”.</b> An electrical distributor with 5 warehouses and ~400–500 orders a day. The head of supply chain agreed to a WMS introduction.","a":"Their ERP’s WMS module was <b>“perfectly working”</b>. Not looking to change; joined to see what’s in the market. No timeline. Increff’s read after the call: “a very long shot”. <b>Ask:</b> what isn’t working today? What would make you change systems, and when? Is there a project or budget? <b>Outcome:</b> Need red; should have stayed in nurture."},{"t":"reveal","q":"<b>Lifestyle retailer (worked).</b> 200+ stores, 100k+ SKUs, mostly fashion-like products changing every 4–6 months.","a":"The <b>Head of Supply Chain</b> attended. Planning ran in <b>Excel</b>. A clear AI Planning OS fit, well above the bar. A board follow-up and an in-person meeting led to <b>proposal and paid-POC talks</b>. It worked because the pain was named upfront, the right buyer was on call one, and scale was confirmed before the demo."}]},{"h":"Lessons for working with partners and agencies","b":[{"t":"grid","items":[["Partner enthusiasm isn’t BANT","“They’re very interested” is not a confirmed pain or stakeholder. Run your own discovery before booking a Sales call."],["No retail presence = not a customer lead","A logistics or tech company with no retail operation may be a partner conversation, not a customer lead."],["Screen twice","Leads that pass an agency’s first screen get an extra discovery call from our team before they go to Sales."],["No form, no booking","The handoff form goes with every invite. The partner probes for the missing BANT answers on the call; they don’t pitch features."],["Partners probe, not just translate","In local-language markets the partner joins as an extended team member who asks the BANT questions."],["Measure the right things","Meetings held with an ICP buyer · % of handoffs with all mandatory fields · % meeting the all-green bar · no-show rate · meetings reaching a second call. Not meetings booked."]]}]},{"h":"Target and avoid","b":[{"t":"grid","items":[["Target","Multi-brand / multi-store fashion & lifestyle retailers (100+ stores) planning in Excel → AI Planning OS · Beverage, food and FMCG distributors running their own warehouses → carton/pallet WMS · Fashion brands with their own warehouse, B2C + marketplaces, ≥30k pieces a month → piece-level WMS + OMS · Companies with a trigger: new warehouse, contract ending, current system too costly or not scaling."],["Avoid","Warehouse fully outsourced to a 3PL with no OMS or planning pain · ERP projects in flight, or “our ERP can’t do X” · Systems that went live in the last 12 months · Single-store or very small assortments · Manufacturing / production-planning asks."],["How to run it","2-minute website + LinkedIn pre-check before outreach · Route the product before booking; name the meeting after the real pain · Send the handoff form with the invite · Confirm the decision-maker 24 hours before."]]}]}],"quiz":[{"q":"Roughly what share of partner-sourced first meetings never reach a second meeting?","o":["~20%","~50%","~80%","~5%"],"a":2,"w":"About 80%. Most could be caught before booking."},{"q":"A prospect says their 3PL runs the warehouse and its WMS is fine. Which meeting do you book?","o":["WMS demo","None for WMS; check for order (multi-channel stock) or planning pain","Store fulfilment","Production planning"],"a":1,"w":"The brand isn’t the WMS buyer."},{"q":"“We went live on a new WMS last quarter.” What do you do?","o":["Book a replacement demo","Nurture: systems replaced in the last 12 months rarely change","Disqualify forever","Offer a discount"],"a":1,"w":"Under 12 months since a change = nurture."},{"q":"The decision-maker “will try to make it” to tomorrow’s demo. Best move?","o":["Run it anyway","Reconfirm 24 hours before; reschedule rather than run without them","Cancel the account","Send a deck instead"],"a":1,"w":"Meetings with stand-ins stalled."},{"q":"In the food-distributor case that worked, what was the gap?","o":["No pain","Budget and timeline were never asked","Wrong product","A 3PL ran the warehouse"],"a":1,"w":"Strong need, but two BANT letters were left open."},{"q":"Which metric should a partner programme NOT optimise for?","o":["Meetings held with an ICP buyer","No-show rate","Meetings booked","Meetings reaching a second call"],"a":2,"w":"Booked meetings alone count for nothing."},{"q":"A prospect wants help planning packaging materials for their factory. What do you say?","o":["Book AI Planning OS","Out of scope: our planning is for selling inventory, not the factory","Book WMS","Book OMS"],"a":1,"w":"Production planning is outside Increff’s scope."}]},"F5":{"title":"Qualified or not? Scenario practice","mins":15,"intro":"Decide before you reveal: Qualified, Nurture, Disqualify, or Not qualified yet. Name the weak letter.","cards":[{"h":"Round 1","b":[{"t":"reveal","q":"<b>The committed chain.</b> The Head of Merchandising at a 200-store apparel chain is frustrated with markdowns and wants a solution before next season. The CFO is already involved.","a":"<b>Qualified.</b> Strong on all four."},{"t":"reveal","q":"<b>The fan with no project.</b> An analyst at a large retailer loves the demo, but doesn’t know who decides and says there’s “no project yet”.","a":"<b>Nurture.</b> Need maybe, but no Authority or Timeline."},{"t":"reveal","q":"<b>The small boutique.</b> The founder of a 5-store boutique wants help with inventory but has no budget this year.","a":"<b>Disqualify</b> (or long-term nurture). Below the ICP, and no Budget."},{"t":"reveal","q":"<b>The renewal window.</b> The CIO says their current system contract ends in 6 months and they’re evaluating options, but can’t share pain points yet.","a":"<b>Qualified.</b> Authority and Timeline are clear. The next step must uncover Need."},{"t":"reveal","q":"<b>The brochure grab.</b> An event lead took a brochure and said “call me sometime”.","a":"<b>Not qualified yet.</b> An interest signal only. Do discovery first."},{"t":"reveal","q":"<b>The eager intern.</b> A merchandising intern at a large retailer booked the meeting and is very keen, but says leadership “doesn’t know yet”.","a":"<b>Nurture.</b> No Authority, no Timeline. Ask them to bring in their manager."},{"t":"reveal","q":"<b>The ticking clock.</b> The Supply Chain Director at a 150-store footwear brand says their warehouse system fails during sales and must be fixed before festive season. The COO signs off on tech spends.","a":"<b>Qualified.</b> All four are strong."}]},{"h":"Round 2","b":[{"t":"reveal","q":"<b>The tyre kicker.</b> A VP says “we’re just benchmarking what’s out there” and has no problem to share.","a":"<b>Nurture.</b> No clear Need or Timeline."},{"t":"reveal","q":"<b>Budget frozen.</b> A CFO confirms heavy markdown losses and wants a fix, but budget is frozen until next financial year, 7 months away.","a":"<b>Nurture.</b> Strong Need and Authority; Budget and Timeline are delayed. Set a dated follow-up."},{"t":"reveal","q":"<b>The competitor user.</b> A retailer uses a competitor, is unhappy with forecast accuracy, and renews in 4 months. The Head of Planning leads the evaluation.","a":"<b>Qualified.</b> A switching trigger with clear Timeline and Authority."},{"t":"reveal","q":"<b>Wrong industry.</b> An electronics distributor with no retail stores and no D2C wants “inventory software”.","a":"<b>Disqualify.</b> Outside our ICP."},{"t":"reveal","q":"<b>The badge scan.</b> A contact scanned their badge at our booth and left without talking.","a":"<b>Not qualified.</b> No signal at all. Treat it as a cold lead."},{"t":"reveal","q":"<b>Big name, no pain.</b> A top-5 fashion retailer’s IT manager takes the call but says everything works fine today.","a":"<b>Nurture.</b> A great logo but no Need. Probe other functions later."},{"t":"reveal","q":"<b>Silent on money.</b> The CEO of a 60-store brand clearly feels the pain and wants to move this quarter, but won’t discuss spend.","a":"<b>Qualified, with a gap.</b> Follow up on Budget by asking what the problem costs them."}]},{"h":"Round 3","b":[{"t":"reveal","q":"<b>The global maze.</b> A regional manager of an international brand is keen, but all tech decisions happen at global HQ abroad.","a":"<b>Nurture.</b> Authority sits elsewhere. Ask for an intro to HQ."},{"t":"reveal","q":"<b>Just launched.</b> An online-only D2C brand launched 8 months ago and is growing fast. The founder wants to “get ready for scale” someday.","a":"<b>Nurture.</b> Likely too early, and no clear Timeline."},{"t":"reveal","q":"<b>The RFP.</b> A retailer sends an RFP with a deadline in 3 weeks, but you’ve never spoken to anyone there.","a":"<b>Qualify before investing.</b> Timeline is clear. Check Need and Authority, and whether a competitor wrote the RFP."},{"t":"reveal","q":"<b>Multiple champions.</b> Planning, IT and Finance all joined the call, agree on the stock-out problem, and want a proposal by month end.","a":"<b>Qualified.</b> Strong buying-committee alignment."},{"t":"reveal","q":"<b>The polite no.</b> “Interesting, send me something and I’ll share it internally.” No pain discussed, no next step.","a":"<b>Not qualified.</b> Push for a specific next step, or who else to involve, before sending anything."},{"t":"reveal","q":"<b>The partner push.</b> A partner refers a retailer and says “they’re very interested”, but the retailer hasn’t confirmed any pain or stakeholder.","a":"<b>Not qualified yet.</b> Partner enthusiasm isn’t BANT. Run your own discovery."},{"t":"reveal","q":"<b>The rehire.</b> The Head of Supply Chain used Increff at a previous company and wants it here, but the company is mid-reorganisation.","a":"<b>Qualify cautiously.</b> A strong champion, but uncertain Authority and Timeline. Map the new structure."}]}],"quiz":[{"q":"A regional head is keen, but every tech decision is made at global HQ. Verdict?","o":["Qualified","Nurture: ask for an intro to HQ","Disqualify","Hand to Sales Director"],"a":1,"w":"Authority sits elsewhere."},{"q":"Planning, IT and Finance all joined, agree on the problem, and want a proposal by month end. Verdict?","o":["Qualified","Nurture","Not qualified yet","Disqualify"],"a":0,"w":"Strong buying-committee alignment."},{"q":"“Send me something and I’ll share it internally.” No pain, no next step. Best move?","o":["Send the full catalogue","Push for a specific next step or who else to involve before sending","Mark Qualified","Disqualify"],"a":1,"w":"The polite no: get a next step first."},{"q":"An RFP arrives with a 3-week deadline from a retailer you’ve never spoken to. What first?","o":["Submit immediately","Qualify before investing: check Need, Authority, and who wrote the RFP","Ignore it","Discount the proposal"],"a":1,"w":"Timeline is clear; the rest isn’t."},{"q":"A top-5 retailer’s IT manager says everything works fine. Verdict?","o":["Qualified (great logo)","Nurture: no Need; probe other functions later","Hand to Sales","POC"],"a":1,"w":"A great logo without Need is nurture."}]},"F6":{"title":"The handoff and the conversation stages","mins":12,"intro":"What Sales needs before the first Increff call, and what must be true to move from one stage to the next.","cards":[{"h":"The handoff form","sub":"No form, no booking. All seven mandatory items are needed.","b":[{"t":"table","head":["Item","What to capture","Required?"],"rows":[["Contact details","Company, website, industry, name, title, email, LinkedIn, phone, country","Mandatory"],["Company fit","What they do, contact’s role, planning vs warehouse/orders, stores / online / both","Mandatory"],["Business scale","Revenue, stores & warehouses, monthly orders, piece vs carton, geography","Mandatory"],["Budget","Money set aside? Paying for a tool now? Replacing something?","Mandatory"],["Decision ownership","Who decides / owns budget; who else is in the buying journey","Mandatory"],["Pain point","A real pain with a specific example of the struggle","Mandatory"],["Timeline","0–6, 6–12 months or later","Mandatory"],["Evaluation type","Formal RFP or casual exploring","Good to know"],["Buying trigger","New warehouse, contract ending, launch, peak season","Good to know"],["Red flags","Price pushback, unsure tone, competitor named","Good to know"]]}]},{"h":"Five stages of a conversation","sub":"Use these names with prospects and in pipeline reviews.","b":[{"t":"tabs","items":[["1. Discovery","First conversation(s) to understand the business and agree whether there’s a problem worth solving. Not a product pitch.","Handoff form complete, BANT graded, ICP passed; a decision-influencing person attends.","Pain confirmed in writing (recap within 24h); basic data shared (volumes, stores, systems); demo dated with named attendees.","Showing videos or a demo before the pain is understood."],["2. Demo","A tailored demonstration against the prospect’s confirmed use cases, not a generic tour.","Discovery recap acknowledged; agenda and success criteria confirmed by email 24h before; evaluator and someone close to the decision-maker attending.","Prospect ranks decision criteria; decision-maker named; next step dated (workshop/visit, NDA, proposal).","Running the demo with stand-ins; a second “intro” demo because discovery was skipped."],["3. NDA","A mutual NDA so the prospect can share real data and Increff can show it back.","The prospect wants to see the product on their data, or a POC is being scoped.","NDA signed; data owner on their side named; data template shared.","Treating a signed NDA as buying intent. It only unlocks data."],["4. Workshop","Onsite or deep-dive session: walk their flows, solution their process, or visit a live Increff site, on sample or their data under NDA.","Demo done; technical fit agreed; operations or planning head engaged; agenda agreed in writing.","Decision-maker or senior evaluator attends; prospect confirms fit in writing; pricing inputs shared and proposal review dated.","Calling it a “POC”. A workshop has no LOI, no success criteria and no fee."],["5. POC","Time-boxed proof on the prospect’s own data, with written success metrics, under a signed LOI. AI Planning OS by default; Omnichannel only by exception.","Signed LOI; named Economic Buyer sponsor; 3–5 written success criteria; data under NDA with a data owner; fixed end date (≤ 90 days); commercial path agreed.","Success criteria met and signed off; Economic Buyer readout held; contract path agreed.","Free, open-ended POCs. Paid is the default; a free POC needs Business Head / CRO approval."]],"labels":["What it is","Entry: must be true first","Exit: move on only when","Not this"]}]},{"h":"A workshop is not a POC","b":[{"t":"table","head":["","Workshop","Paid POC (standard)","Free POC"],"rows":[["What it is","Walk their flows, solution their process, show the product on sample data","Time-boxed proof on their own data against written criteria","Same as a POC, but unpaid"],["Paperwork","None (NDA only if their data is shown)","Signed LOI + data NDA + POC charter","LOI + NDA + Business Head / CRO approval"],["Who attends","Function head + users","Named Economic Buyer sponsors kickoff and readout","Same"],["Success criteria","Prospect confirms fit","3–5 measurable criteria in writing","Same"],["Duration","A day or two","≤ 90 days incl. data onboarding; clock starts when data arrives","Same"],["Commercials","Free","Paid pilot; scope and fee set by Increff","Not offered by default: free POCs turn into free consulting"]]},{"t":"reveal","q":"A prospect asks to “test the system” with sample data before sharing anything of theirs. Is that a POC?","a":"<b>No.</b> That’s a workshop or sandbox. A POC starts only with their data, an NDA, an LOI and the right stakeholders."}]}],"quiz":[{"q":"How many mandatory items does the handoff form have?","o":["3","5","7","10"],"a":2,"w":"Seven mandatory items; three more are good to know."},{"q":"Which item is “good to know”, not mandatory?","o":["Pain point","Budget","Buying trigger","Decision ownership"],"a":2,"w":"Evaluation type, buying trigger and red flags are good to know."},{"q":"An NDA has just been signed. What does it mean?","o":["They will buy","It only unlocks data sharing","The POC has started","Skip the demo"],"a":1,"w":"An NDA is not buying intent."},{"q":"What must be in place before a paid POC starts?","o":["Just a demo","Signed LOI, Economic Buyer sponsor, 3–5 written success criteria, data under NDA, fixed end date","Only an NDA","A discount"],"a":1,"w":"That is the POC entry bar."},{"q":"A prospect wants a free, open-ended trial. What’s the rule?","o":["Always agree","Paid is the default; a free POC needs Business Head / CRO approval","Free POCs are standard","Offer two"],"a":1,"w":"Free POCs turn into free consulting."}]},"F7":{"title":"Running a discovery call","mins":15,"intro":"Prepare, run a 30-minute call, handle the first objections, and log it.","cards":[{"h":"Before the call: a hypothesis, not a pitch","b":[{"t":"grid","items":[["Research the company","Size, stores and channels, recent news, current systems."],["Research the contact","Role, tenure, LinkedIn activity."],["Form a hypothesis","What’s their likely pain, before you dial?"],["Prepare questions","3–4 tailored questions and one relevant customer story."]]},{"t":"tip","x":"Aim for about 15 minutes of prep per call."}]},{"h":"The 30-minute call: six steps","b":[{"t":"steps","items":[["Opening (2 min)","Thank them, confirm time, state the agenda and goal."],["Their context (5 min)","Business, role, priorities."],["Pain discovery (10–12 min)","Open questions, then dig deeper. The biggest block."],["BANT checks (5 min)","Woven in naturally, not an interrogation."],["Positioning (3–4 min)","Connect Increff only to the pains they named."],["Next step (2–3 min)","A concrete step with a date, and who joins."]]},{"t":"reveal","q":"In a great discovery call, how much should the prospect talk?","a":"About <b>70%</b>. If you’re talking most, you’re pitching, not discovering."}]},{"h":"Open questions, and digging deeper","b":[{"t":"table","head":["Closed","Open"],"rows":[["“Do you have inventory issues?”","“How are you managing stock across stores today?”"],["“Is this a priority?”","“What happens if this isn’t solved by next season?”"],["“Are you happy with your current system?”","“What would you change about how your current system works?”"],["“Do you have a budget for this?”","“How are projects like this usually funded?”"],["“Are you the decision maker?”","“Who else would be involved in a decision like this?”"]]},{"t":"chips","items":["“Tell me more about that.”","“How does that impact the business?”","“What have you tried so far?”"]},{"t":"tip","x":"The first answer is rarely the real pain. Go two or three layers down before moving on."}]},{"h":"The probing ladder","sub":"Symptom → Example → Process → Scale → Impact → Why now → Outcome","b":[{"t":"grid","items":[["Clarify language","“What does ‘manual’ mean in this step?”"],["Ask for an incident","“What happened most recently?”"],["Explore the workaround","“What do people do when it fails?”"],["Contrast","“What changes by store, channel or peak?”"],["Test an alternative","“Is stock missing everywhere, or only at that location?”"]]},{"t":"tip","x":"Not seven mandatory questions: follow the strongest thread. Ask permission for sensitive information. Estimates are fine if labelled; never pressure anyone to invent a number."}]},{"h":"Worked dialogue: “Dispatch is slow”","sub":"A fictional example. Notice no product claim was needed.","b":[{"t":"table","head":["Who","Says"],"rows":[["Customer","“Dispatch is slow.”"],["Rep","“Compared with which target?”"],["Customer","“Orders should leave the same day; during sales some leave two days later.”"],["Rep","“Walk me through the last delayed order, from release to dispatch.”"],["Customer","“Picking was completed, but packing waited for verification.”"],["Rep","“What was being verified, and why?”"],["Customer","“Supervisors check every item because we have had mis-ships.”"],["Rep","“How different is the queue on a normal day versus peak?”"],["Customer","“Normal is manageable. Peak creates a large backlog.”"],["Rep","“What does that backlog cause, and who measures it?”"],["Customer","“Marketplace SLA misses; the e-commerce team tracks them.”"],["Rep","“So our working hypothesis is a verification bottleneck during peak, not slow order ingestion. Let’s validate pick/pack with your warehouse manager and the SLA baseline with e-commerce. Is that accurate?”"]]}]},{"h":"Discovery by persona","b":[{"t":"table","head":["Persona","What to understand","Good question"],"rows":[["Founder / business head","Growth, economics, risk, timing","“What becomes harder as the business scales?”"],["Operations / supply chain","Accuracy, throughput, exceptions","“Which step requires the most checking or recovery?”"],["E-commerce manager","Channel availability, cancellations, SLAs","“Where does the channel view diverge from actual availability?”"],["Warehouse manager","Daily execution and adoption","“Show me what a new operator finds difficult.”"],["Planner / merchandising head","Availability, decision cycles, assortment","“How do you decide what to send where?”"],["IT","Integration ownership, security, dependencies","“Which system owns each event, and what customisation exists?”"],["Finance","Cost, cash, affordability, measurement","“Which impact can we establish from your records?”"]]},{"t":"tip","x":"A title suggests questions; it doesn’t prove decision authority. Ask who evaluates, uses, approves and signs."}]},{"h":"The initial presentation","sub":"Reflect → Explain → Link → Prove → Validate → Advance (about 5 minutes)","b":[{"t":"steps","items":[["Reflect (1 min)","Play back their current state in their words."],["Explain + link (2 min)","The relevant capability and the operational change it makes."],["Prove (1 min)","One relevant customer story. Baseline and exact fit still need validation."],["Validate + advance (1 min)","Check understanding and define the next discussion."]]},{"t":"reveal","q":"Example: warehouse","a":"“You described a peak packing queue created by repeated manual verification. The relevant WMS discussion is how inventory and pick/pack verification are controlled. We should walk through that workflow, compare it with your operating requirements, and establish what could change.”"},{"t":"reveal","q":"Example: planning","a":"“Your stores have stock-outs and excess at the same time, and replenishment takes substantial manual effort. Allocation, replenishment and transfers are the relevant areas to explore. We should review how the decisions are made and the sales and stock data available, then show a focused use case.”"},{"t":"tip","x":"If challenged: “That is exactly the part we should validate, rather than assume.”"}]},{"h":"First objections","sub":"Try your answer, then reveal.","b":[{"t":"reveal","q":"“Just send me a deck.”","a":"“Happy to. So I send something relevant, what’s the one problem you’d want it to address?”"},{"t":"reveal","q":"“We already use SAP.”","a":"“Many of our customers run SAP too; we work alongside it. Where does it fall short for planning or allocation today?”"},{"t":"reveal","q":"“We have no budget.”","a":"“Understood. What is the problem costing you today? That often shapes whether a budget gets made.”"},{"t":"reveal","q":"“Now’s not the right time.”","a":"“Fair. What would need to change for this to become a priority, and when should we reconnect?”"}]},{"h":"After the call","b":[{"t":"grid","items":[["Log it the same day","In the CRM: BANT notes, status, next step."],["Qualify honestly","A weak fit goes to nurture, not the pipeline."],["Hand over cleanly","Pain, stakeholders and timeline in one summary."]]}]},{"h":"What Sales needs from your handover","b":[{"t":"chips","items":["The problem in the customer’s words","A recent example","Scale","Impact","Systems and owners","Why now","Stakeholders","A working hypothesis","What the next call must establish"]},{"t":"reveal","q":"Is “unknown” acceptable in a handover?","a":"<b>Yes.</b> “Unknown” is better than invented certainty. Separate facts from hypotheses."},{"t":"reveal","q":"Is a generic full demo a good next-call objective?","a":"<b>No.</b> Propose a specific workflow, a success question and the right stakeholders."}]}],"quiz":[{"q":"A prospect says “dispatch is slow”. What is the best first follow-up?","o":["Pitch the WMS","“Compared with which target?”","“What’s your budget?”","Send a deck"],"a":1,"w":"Clarify the symptom against a target before anything else."},{"q":"Which persona would you ask: “Which system owns each event, and what customisation exists?”","o":["Founder","IT","Warehouse manager","Finance"],"a":1,"w":"IT owns integration and dependencies."},{"q":"What is the order of the initial presentation?","o":["Prove, Explain, Advance","Reflect, Explain + link, Prove, Validate + advance","Price, Demo, Close","Explain, Reflect, Close"],"a":1,"w":"Play back their words first, then link, prove and advance."},{"q":"Which step of the call gets the most time?","o":["Opening","Pain discovery","Positioning","Next step"],"a":1,"w":"Pain discovery: 10–12 of 30 minutes."},{"q":"Which is the best open version of “Are you the decision maker?”","o":["“Can you sign?”","“Who else would be involved in a decision like this?”","“Are you senior?”","Skip it"],"a":1,"w":"Open questions map the buying committee without putting the contact on the spot."},{"q":"“We already use SAP.” Best response?","o":["“SAP is bad”","“Many customers run SAP too; we work alongside it. Where does it fall short for planning or allocation?”","“Then we can’t help”","Offer a discount"],"a":1,"w":"Work alongside the ERP and find the gap."},{"q":"When should you connect Increff to their problems in the call?","o":["In the opening","Only to the pains they named, near the end","Before asking any question","Never"],"a":1,"w":"Positioning comes after discovery and only links to named pains."},{"q":"What must every call end with?","o":["A price","A concrete next step with a date and who joins","A brochure","A POC"],"a":1,"w":"A dated next step and attendees."}]},"C1":{"title":"The product map","mins":12,"intro":"Two product families: plan the inventory, then run it. Every module, and the pain it answers.","cards":[{"h":"Plan the inventory, then run it","b":[{"t":"grid","items":[["AI Planning OS","Demand forecasting, financial, assortment and inventory planning in one connected, AI-native workflow. Answers: what to buy, how much, where to send it, when to top up, move or discount it."],["Omnichannel Fulfilment System","Exposes every piece of inventory across all channels and gets each order out: warehouse operations, order orchestration, logistics and store & omnichannel."]]},{"t":"reveal","q":"Give the 30-second overall pitch.","a":"“Increff helps retail businesses improve inventory decisions and fulfilment. AI Planning OS supports what to buy and where to place stock. The Omnichannel Fulfilment System runs the warehouse, order and channel processes. The useful starting point is the part of your operation causing the problem, not the entire catalogue.”"}]},{"h":"Everything inside the two families","b":[{"t":"table","head":["Family","Area","Modules"],"rows":[["AI Planning OS","Financial planning","Demand forecasting · Merchandise financial planning (MFP) · OTB planning / WSSI · Reviews & approvals"],["AI Planning OS","Assortment planning","Range architecture · Buying · Reordering"],["AI Planning OS","Inventory planning","Allocation & replenishment · Inter-store / warehouse transfers · Markdown optimisation"],["Omnichannel Fulfilment","Warehouse operations","WMS · Label software"],["Omnichannel Fulfilment","Order orchestration","OMS · Channel Management System · Vendor Inventory Management & Fulfilment"],["Omnichannel Fulfilment","Store & omnichannel","Ship from store · BOPIS / BORIS · Endless aisle · Self-checkout"]]}]},{"h":"Each module: the pain, the buyer, the question","sub":"Click a module.","b":[{"t":"tabs","items":[["Financial planning (MFP)","Sets top-down sales, margin and inventory targets by season, channel and category.","Targets built in Excel; no link between plan and buying.","Head of Merchandising / Planning, CFO","“How do you set next season’s sales and inventory budget today?”"],["OTB / WSSI","Tracks open-to-buy and weekly sales-stock-intake against plan.","Over-buying; no live view of budget left to spend.","Head of Planning, Head of Buying","“How do you know how much budget is left to buy mid-season?”"],["Assortment & buying","Decides which styles, sizes and depth to buy, driven by attributes and true rate of sale.","Buying on gut feel; dead stock and broken sizes.","Head of Buying, Head of Merchandising","“How do you decide which styles and how many to buy?”"],["Allocation & replenishment","Sends the right stock to each store and refills it from sales.","Stores with too much of one item and none of another; Excel allocation.","Head of Merchandising, Head of Planning, Head of Supply Chain","“How do you decide what each store gets?”"],["Markdown optimisation","Recommends when and how much to discount, per item and store.","Blanket end-of-season sales eating margin.","Head of Merchandising, CEO","“How do you decide when to discount slow sellers?”"],["WMS, piece-level (serialized)","Scan-based warehouse: every piece barcoded from receiving to dispatch, fully traceable.","Stock mismatches, manual pick lists, slow picking for B2C and marketplaces.","Head of Warehouse, Head of Supply Chain, COO","“Do you pick one item at a time, and how accurate is your stock count?”"],["WMS, carton/pallet (non-serialized)","Warehouse for boxes and pallets: batches, FEFO/FIFO, forklift tasks, B2B dispatch.","Expiry losses, long cycle counts, paper-based putaway.","Head of Warehouse, Head of Logistics, Head of Supply Chain","“Do goods move as cartons and pallets? How do you handle expiry?”"],["OMS","One inventory view across warehouses, stores and marketplaces; routes each order to the best location.","Overselling online; stock not synced across channels.","Head of E-commerce / Omnichannel, CTO / CIO","“Do you ever sell online something that’s actually out of stock?”"],["Store fulfilment","Lets stores ship online orders, BOPIS/BORIS, endless aisle; exposes store stock online.","Online stock-outs while stores sit on inventory.","Head of Omnichannel, Head of E-commerce, COO","“Can your stores fulfil online orders today?”"],["B2B / cross-dock","Wholesale and distributor dispatch, box-level cross-docking.","Manual B2B order entry (orders taken by email).","Head of Logistics, Head of Distribution, Head of Supply Chain","“How do distributor orders reach the warehouse?”"]],"labels":["What it does","Pain it solves","Who buys","Ask this"]}]},{"h":"The four problems, mapped to products","b":[{"t":"table","head":["Where the journey failed","Typical symptom","Where to look"],"rows":[["Inventory decisions","Wrong buy, size mix, location, replenishment, transfer or markdown","AI Planning OS"],["Connectivity","Information doesn’t move reliably between systems","Channel Management / integrations"],["Order coordination","Orders and stock not coordinated across channels and nodes","OMS, store fulfilment"],["Execution","Receiving, storage, picking, packing, dispatch or returns unreliable","WMS"]]},{"t":"tip","x":"A capability leads to an operational change, which leads to a business consequence. Example: scan verification → a mismatched pick is caught before dispatch → potentially fewer mis-ships and rework. Don’t leap to “guaranteed revenue growth”."}]}],"quiz":[{"q":"Which family does allocation and replenishment belong to?","o":["Omnichannel Fulfilment System","AI Planning OS","Channel Management","Store fulfilment"],"a":1,"w":"It’s inventory planning inside AI Planning OS."},{"q":"“We oversell online.” Which module do you think of first?","o":["Markdown optimisation","OMS","Label software","MFP"],"a":1,"w":"One inventory view across channels is the OMS’s job."},{"q":"“How do you know how much budget is left to buy mid-season?” tests the need for…","o":["OTB / WSSI","Store fulfilment","WMS","Cross-dock"],"a":0,"w":"Open-to-buy tracking."},{"q":"“Expiry losses and 20-day cycle counts.” Which module?","o":["WMS, carton/pallet","AI Planning OS","Endless aisle","MFP"],"a":0,"w":"Batches, FEFO and cycle counts are carton/pallet WMS territory."},{"q":"Who typically buys markdown optimisation?","o":["Head of Warehouse","Head of Merchandising, CEO","CTO only","Head of Logistics"],"a":1,"w":"Discount decisions sit with merchandising leadership."},{"q":"Which statement is safe?","o":["“Scan verification guarantees revenue growth.”","“Scan verification can catch a mismatched pick before dispatch, potentially reducing mis-ships.”","“Our WMS doubles sales.”","“No errors ever.”"],"a":1,"w":"Capability → operational change → possible consequence."}]},"C2":{"title":"AI Planning OS: financial and assortment planning","mins":15,"intro":"How the plan is set, and how the range is built and bought.","cards":[{"h":"Financial planning","sub":"Forecast demand, set the budget and approve the plan in one workflow.","b":[{"t":"tabs","items":[["Demand forecasting","Predict true demand at the store-SKU level.","Run your own algorithm scripts or swap individual algorithm blocks for your own logic · Compare forecast scenarios side by side and pick the winner on a weighted KPI scorecard · Reviews and approvals across hierarchies and teams, with every comment tracked."],["Merchandise financial planning","Align financial targets through forecasting.","Multi-level budgeting across category, channel, region and store, with automated top-down and bottom-up reconciliation · Built-in KPIs for revenue, margin, ASP and discount %, plus custom KPIs · AI growth suggestions with anomaly correction to clean out past over-buying."],["OTB planning / WSSI","Monitor weekly sales trends and optimise buying decisions.","OTB with flexible KPIs and weekly/monthly demand projections · Actual vs projected buying budgets tracked and adjusted as the season progresses · Monthly AOP targets broken into weekly plans using historical sell-through · An AI agent reviews each OTB plan and flags risks before sign-off."]],"labels":["What it does","Highlights"]}]},{"h":"Assortment planning","sub":"Build every assortment around the unique DNA of every store.","b":[{"t":"tabs","items":[["Range architecture","Attribute-driven assortments.","A unique store DNA for each store from historical sales, seasonality and attribute preferences · Attribute-group demand analysis across up to 17 fashion attributes, carried forward across seasons · Demand-corrected size curves, adjusted for past over- and under-buying, to prevent broken sizes."],["Buying","Lock in what to buy, how much and for which stores.","Forward-looking rate of sale for every store-style, with projected closing inventory · Range plan matched against the design catalogue or PLM, with suggested placeholders alongside actual style codes, images, costs and KPIs · Store-level distribution plan ranked by sales velocity, assortment fit and planogram gap."],["Reordering","Automate bestseller replenishment.","Styles classified by rate of sale, discount level and remaining sell window · Reorder quantities calculated at SKU level from live demand, cover days, lead times and safety stock · Reorder runs at several frequencies to match the buying calendar."]],"labels":["What it does","Highlights"]}]},{"h":"How forecasting works","sub":"Try your answer, then reveal.","b":[{"t":"reveal","q":"“How does your forecasting work?”","a":"Multiple models (SARIMA, XGBoost, Prophet) are back-tested and the best is chosen per category and level. Weightages and trade calendars are configurable. Clients can bring their own models, and standard models like moving average can be replicated."},{"t":"reveal","q":"“What about new products or brands with no history?”","a":"Attribute-based forecasting with up to 17 attribute levels, rolling up the hierarchy when data is thin. New brands can be benchmarked against similar ones. Assess fit and data readiness before predicting performance."},{"t":"reveal","q":"“How accurate is it?”","a":"It depends from client to client, and on how much historical data is available. Case studies have shown 85–90% accuracy from month 7 onwards, but the rolling data of a 5–6 month period plays a big role. Don’t promise a figure for their business: offer to assess their data first."},{"t":"reveal","q":"“What does MFP do?”","a":"It’s a planning system, not a reporting tool. It sets financial targets, covers revenue growth across channels and supports scenario comparison."}]}],"quiz":[{"q":"A prospect wants to keep their own forecasting algorithm. What do you say?","o":["Not possible","They can run their own scripts or swap individual algorithm blocks for their own logic","Only Increff models are allowed","Only in Excel"],"a":1,"w":"Algorithm Studio supports their own logic beside ours."},{"q":"How many fashion attributes can range architecture analyse?","o":["Up to 5","Up to 17","Exactly 3","Unlimited, guaranteed"],"a":1,"w":"Up to 17 attributes."},{"q":"“How accurate is your forecast?” Best answer?","o":["“Always 95%.”","“It depends on the client and their history; case studies show 85–90% from month 7, so let’s assess your data first.”","“We don’t measure it.”","“100% after a month.”"],"a":1,"w":"Never promise a figure."},{"q":"Which module breaks monthly AOP targets into weekly plans?","o":["OTB planning / WSSI","Reordering","Markdown","Label software"],"a":0,"w":"OTB / WSSI uses historical sell-through to build weekly plans."},{"q":"A brand launching new categories asks how we forecast without history. Answer?","o":["We can’t","Attribute-based forecasting rolls up the hierarchy and benchmarks against similar products; assess data readiness first","Copy last year","Ask the CEO"],"a":1,"w":"Attribute-level comparisons, then a data-readiness check."},{"q":"Is MFP a reporting tool?","o":["Yes","No: it is a planning system that sets targets and compares scenarios"],"a":1,"w":"Planning, not reporting."}]},"C3":{"title":"AI Planning OS: inventory planning, the platform and its limits","mins":15,"intro":"Getting stock to the right store, the platform features, and what not to promise.","cards":[{"h":"Inventory planning","sub":"Right stock, right store, right time.","b":[{"t":"tabs","items":[["Allocation & replenishment","True rate of sale for every store-style-SKU, from healthy, in-stock days only · Unique store–style rankings through Store-StyleRank™, using recency, seasonality, sales velocity and revenue potential · Custom parameters for allocation, replenishment and assortment by store or channel."],["Inter-store / warehouse transfers","Hyper-local rebalancing across the store and warehouse network based on pincode-level demand · Broken sizes moved to locations where they complete full-size runs, maximising full-price sell-through · Proactive reallocation suggestions from local demand forecasts."],["Markdown optimisation","Price elasticity to limit discounts and avoid wasted markdowns · In-season, event-based and end-of-season liquidation, with the event calendar as input · SKU-level discounts based on demand, sell-through and time left to clear."]],"labels":["Highlights"]},{"t":"reveal","q":"“Do you do markdowns and replenishment?”","a":"Yes. Markdown optimisation uses price elasticity. Replenishment can be automatic, or buy suggestions go for approval. Recommendations are pushed to the ERP, which creates the stock transfer orders."}]},{"h":"The platform","b":[{"t":"grid","items":[["Workflows and approvals","Planning runs as a cycle: each plan routes through store, merchandising, finance and leadership, with every comment and decision on record."],["Algorithm Studio","Use Increff algorithms as they are, tune them, or swap blocks for your own logic; run yours beside ours on the same data."],["Interactive workbooks","Build and review plans in spreadsheet-style workbooks, with charts, edits and pivots in one place."],["Scenarios and scorecards","Compare forecasts and plans side by side and choose the winner on a weighted KPI scorecard."],["Data and integrations","Bring in external data such as footfall alongside sales and stock."],["Role-based dashboards","A home page for each role, from CXO to merchandiser to store manager."]]}]},{"h":"AI that plans with you, not for you","b":[{"t":"grid","items":[["Plan faster","Agents draft and refine forecasts, workflows and dashboards for the team to approve."],["Catch risks earlier","Agents review every plan and flag issues before sign-off."],["Stay in control","You set the permissions, and every recommendation is explained."]]},{"t":"stats","items":[["90%","less planning cycle time"],["25%","better inventory health"],["22%","fewer stock-outs"],["15%","better forecast accuracy"]]},{"t":"reveal","q":"“Will it replace my merchandising team?”","a":"No. It is decision support with approvals. The system needs direction, and a softer transition is recommended. Planners’ expertise stays central."}]},{"h":"Boundaries: what AI Planning OS is not","b":[{"t":"grid","items":[["Not execution","It improves inventory <i>decisions</i>. It is not a POS, WMS, PLM/design tool or finance replacement. Transfers still need operational execution."],["Not a guarantee","Don’t promise forecast accuracy, autonomous decisions, or results without validation."],["Best for omnichannel brands","It relies on geographic (store) sales data, so it suits omnichannel and store-led brands best."],["AI claims","There is an in-product chatbot for guidance. APIs are available. Do not claim an official MCP server."]]},{"t":"reveal","q":"“If recommendations are right but stores get goods late, what else do we investigate?”","a":"Execution and replenishment lead time, not only planning logic."},{"t":"reveal","q":"“How do you prove the numbers?”","a":"A/B testing of stores on Increff against stores on the current method, and a pilot (any POC needs approved scope and conditions: see F6)."}]},{"h":"Discovery questions for planning","b":[{"t":"chips","items":["Who makes allocation decisions, with what data?","How much happens in spreadsheets?","How are stores clustered?","How are new products handled?","How do you tell low demand from lost sales due to no stock?","How quickly does a decision become an executed replenishment?","Are transfer benefits weighed against transport cost?","Who approves markdowns?"]},{"t":"p","x":"<b>Inputs you’ll need:</b> sales history, stock, product attributes, store structure, returns, season/event context, and who owns the data and its quality."}]}],"quiz":[{"q":"What makes Increff’s rate of sale “true”?","o":["It includes stock-out days as zero","It uses only healthy, in-stock days","It doubles weekend sales","It ignores stores"],"a":1,"w":"Stock-outs aren’t mistaken for low demand."},{"q":"Who creates the stock transfer orders after a replenishment recommendation?","o":["AI Planning OS","The ERP","The courier","The POS"],"a":1,"w":"Recommendations are pushed to the ERP, which creates the transfer orders."},{"q":"Does AI Planning OS replace planners?","o":["Yes","No: decision support with approvals"],"a":1,"w":"The team stays in control."},{"q":"An online-only brand with no stores asks for AI Planning OS. What should you know?","o":["It’s the perfect fit","It relies on geographic store sales data, so it suits omnichannel brands best","It needs no data","Only for pharma"],"a":1,"w":"Online-only is a weaker fit."},{"q":"How can a prospect prove the numbers?","o":["Trust us","A/B test stores on Increff vs the current method, or an approved POC","Read a brochure","No way to prove it"],"a":1,"w":"Evidence on their own stores."},{"q":"What does markdown optimisation use to limit discounts?","o":["Price elasticity","Courier rates","Bin locations","Payroll"],"a":0,"w":"Price elasticity plus sell-through and time left to clear."}]},"C4":{"title":"WMS: running the warehouse","mins":18,"intro":"How Increff controls stock from receiving to returns, and the two ways of tracking it.","cards":[{"h":"The warehouse journey","sub":"The questions behind each step.","b":[{"t":"steps","items":[["Receive","What arrived, in what quantity and condition?"],["Put away","Where was usable stock placed?"],["Pick","Which units, from where?"],["Pack","Do the items match the order?"],["Dispatch","What was handed over, and how is it evidenced?"],["Return","What came back, in what condition, and is it resellable?"]]},{"t":"p","x":"“Increff WMS supports warehouse inventory control and execution from receiving to dispatch and returns. The relevant conversation is how stock is recorded, located, verified, moved and reconciled.”"}]},{"h":"A platform that fits the warehouse","b":[{"t":"grid","items":[["Configurable workflows","Steps, rules, roles and automated triggers configured to match the operating model."],["Plug-in architecture","One stable core, plug-in modules of your choice, and room to add more without a rebuild."],["Built-in features","Wave picking, auto-replenishment, self-triggering cycle counts and a live control tower."],["Also built in","Pick-path optimisation · FIFO/FEFO automation · cross-docking · kits & bundles · 80+ dashboards."]]}]},{"h":"What’s new","b":[{"t":"grid","items":[["Role-based control tower","Every user, from CEO to supervisor, gets a dashboard built from a large library of charts and widgets."],["Multi-language UI","Set the language and rename terms to match each team and region."],["Digital 3D warehouse view","See the 2D layout as a 3D model, with pick and putaway movement overlaid to catch layout inefficiencies."],["Task-based operator app","Every job runs as a task on the handheld, with alerts and automatic follow-up tasks (missed picks, low stock)."],["Video-proof returns","Return unboxing captured on video to support marketplace claims for missing, damaged or wrong items."],["Quick onboarding","An intuitive interface designed so warehouse staff learn it fast. Don’t promise a fixed training time to a prospect."]]}]},{"h":"Serialized vs non-serialized","b":[{"t":"table","head":["","Serialized (piece-level)","Non-serialized (carton/pallet, SKU-level)"],"rows":[["How it tracks","A unique serial code for every item; scan-based operations; full audit trail per piece","Flexible units of measure: cases, cartons, pallets and eaches"],["Strengths","About 99.9% inventory accuracy, continuous audit, redirect to another bin if an item isn’t found, return tracking, fraud reduction","Bulk putaway and bulk return; suits wholesale-heavy and FMCG clients"],["Watch out","Every serial code must be scanned: no bulk putaway or bulk return","Rolling out in phases"]]},{"t":"tip","x":"When serialization seems too heavy for a prospect, quote both options. One system serves D2C, marketplaces, wholesale and offline retail."}]},{"h":"Label software","b":[{"t":"grid","items":[["Unique serial code per item","A unique digital signature for each item for accurate tracking."],["Drag-and-drop design","Create professional labels with simple design tools."],["Bulk printing","Thousands of labels with a single click."],["Print anywhere","From manufacturer, distributor or importer locations, with role-based access."]]},{"t":"reveal","q":"“Who adds the serial codes? Will a sticker spoil a luxury product?”","a":"Two methods: add the code at manufacturing via the label software, or scan items into boxes. The code can go on outer packaging, price tags or a sewn label. The brand controls placement and design."}]},{"h":"WMS impact","b":[{"t":"stats","items":[["99.9%","bin-level inventory accuracy"],["99.5%","orders fulfilled within SLA"],["25–30%","lower manpower and storage costs"]]},{"t":"tip","x":"Documented results, not guarantees. A prospect’s result depends on their baseline and scope."}]}],"quiz":[{"q":"A wholesaler wants bulk putaway. Which tracking mode?","o":["Serialized","Non-serialized"],"a":1,"w":"Bulk putaway and bulk return exist only in non-serialized mode."},{"q":"Which feature helps with marketplace claims for damaged returns?","o":["3D warehouse view","Video-proof returns","MFP","Endless aisle"],"a":1,"w":"Return unboxing is captured on video."},{"q":"A luxury brand worries a sticker will spoil the product. Answer?","o":["Stickers are mandatory on the item","The code can go on outer packaging, a price tag or a sewn label, and the brand controls placement","We can’t help","Use RFID only"],"a":1,"w":"Placement is flexible."},{"q":"Which step answers “Do the items match the order?”","o":["Receive","Put away","Pack","Return"],"a":2,"w":"Packing verifies against the order."},{"q":"What does the plug-in architecture mean for a client?","o":["Rebuild for every change","A stable core with modules added without a rebuild","On-premise install","No configuration"],"a":1,"w":"Grow without a rebuild."},{"q":"A prospect asks: “How fast can my staff learn it?” Best answer?","o":["“Exactly 10 minutes, guaranteed.”","“It’s designed to be learned quickly; let’s walk through the real task with your team.”","“Months.”","“No training needed ever.”"],"a":1,"w":"Don’t guarantee training times."}]},"C5":{"title":"WMS: questions prospects ask","mins":12,"intro":"The questions that come up most on calls, and what to capture.","cards":[{"h":"Your answer first","sub":"Try each, then reveal.","b":[{"t":"reveal","q":"“What is item-level serialization and why bother?”","a":"Each unit gets a unique ID: about 99.9% inventory accuracy, continuous audit, bin redirect when an item isn’t found, return tracking and fraud reduction. There’s also a non-serialized, SKU-level option; quote both when serialization seems heavy."},{"t":"reveal","q":"“How do you prevent wrong-item picks?”","a":"Two-step validation: a pick scan and a pack scan. Packers scan blind, without seeing the order; product images help."},{"t":"reveal","q":"“How do you handle multi-item orders and picker travel?”","a":"Items are consolidated using bins and serial-to-order mapping, and the system minimises picker travel. Bin-space optimisation isn’t standard but can be customised."},{"t":"reveal","q":"“Does it support returns?”","a":"Yes: return consolidation, video capture of forward and return shipments, and return-reduction strategies."},{"t":"reveal","q":"“Can we skip scanning steps, like AWB or bag-level?”","a":"Many steps are configurable. The AWB scan can be skipped from a configuration screen. Fixed-pallet export orders can be scanned at pallet level instead of bag level."}]},{"h":"More questions","b":[{"t":"reveal","q":"“Do you support batch and expiry?”","a":"Calls say yes: batch tagging, FEFO/FIFO, remaining shelf life by location and channel-specific shelf-life tolerances. But depth needs specialist validation: capture the exact rule, unit and validation point."},{"t":"reveal","q":"“Can one user log in on several devices?”","a":"Calls said only one login per user at a time. Don’t claim otherwise; verify if it matters."},{"t":"reveal","q":"“Can it run at our 3PL’s warehouse?”","a":"Yes. The value holds as long as the brand controls its inventory and visibility. Don’t guarantee how fast 3PL staff will be trained."},{"t":"reveal","q":"“Can we do bulk putaway in the serialized WMS?”","a":"No. Bulk putaway and bulk return exist only in the non-serialized mode; in serialized mode every code is scanned."},{"t":"reveal","q":"“Do you capture inbound photos or video at receiving?”","a":"Not currently (customisation possible). Forward and return video exist. Video is stored locally; Increff doesn’t supply hardware."},{"t":"reveal","q":"“Can you verify returns at the gate, or permanently relocate misplaced items?”","a":"Gate-entry shipment checks aren’t currently supported, and inventory normalisation isn’t available. Don’t say yes."}]},{"h":"Boundaries and discovery","b":[{"t":"grid","items":[["Browser-based","It runs in a browser and needs connectivity. No offline mode."],["Scope by unit","Piece-level and carton/B2B operations need different scoping."],["Validate","Batch/expiry/FEFO depth, hardware compatibility and unusual workflows need specialist validation."]]},{"t":"chips","items":["What is the fulfilment unit: piece, carton, pallet or mixed?","Normal and peak volumes (orders ≠ pieces)?","Which step limits throughput?","How much checking and rework?","Which transactions cause stock variance?","How fast is returned stock available after inspection?","Brand- or 3PL-controlled?"]}]}],"quiz":[{"q":"How does Increff prevent wrong-item picks?","o":["Supervisors check everything","Pick scan + blind pack scan, with product images","Random audits","RFID only"],"a":1,"w":"Two-step validation."},{"q":"“Do you support batch and expiry?” Best answer?","o":["“Yes, everything, guaranteed.”","“Calls say yes, but let’s capture your exact rules for specialist validation.”","“No.”","“Only for fashion.”"],"a":1,"w":"Depth needs validation."},{"q":"Can the AWB scan be skipped?","o":["Never","Yes, from a configuration screen","Only offline","Only for B2B"],"a":1,"w":"Many steps are configurable."},{"q":"“Can you verify returns at the gate?”","o":["Yes","Not currently supported: don’t say yes","Only with RFID","Coming next week"],"a":1,"w":"It’s on the do-not-claim list."},{"q":"A prospect’s connectivity drops for hours daily. What do you say?","o":["No problem","It’s browser-based and needs connectivity; be honest if offline is essential","Offline mode is coming","Buy a generator"],"a":1,"w":"No offline mode."},{"q":"Why ask “orders or pieces?”","o":["It doesn’t matter","Orders ≠ pieces: a 5-item order is 5 picks, which changes scale and fit","For billing only","For marketing"],"a":1,"w":"Volume must be measured in the right unit."}]},"C6":{"title":"Order orchestration: OMS, channels and vendors","mins":15,"intro":"Getting every order to the best node, and keeping every channel’s stock right.","cards":[{"h":"OMS","sub":"Route every order to the best fulfilment node across all channels.","b":[{"t":"grid","items":[["Intelligent routing and splitting","Route orders by availability, proximity and cost to reduce multiple shipments and delivery time."],["Multi-node orchestration","Handles partial shipments, multi-location dispatch, store pickups and returns."],["Returns resolution","Track forward and reverse shipments with integrated quality checks and video capture for returns."],["Prebuilt dashboards","SLAs, order volumes, returns, sales and cancellations across nodes and channels: 80+ dashboards."]]},{"t":"tip","x":"Internal sources disagree on exactly which routing and splitting rules sit in Increff versus the client’s systems. Teach them as requirements to capture, and validate each rule. Don’t promise a full enterprise OMS replacement."}]},{"h":"Channel Management System","b":[{"t":"grid","items":[["1,300+ live integrations","Connectors already built, tested and running across webshops, POS, marketplaces and ERPs."],["Flexible listing management","Link one warehouse SKU to multiple marketplace listings."],["Under-10-second sync","Inventory and orders update across channels in under 10 seconds."],["OMS- and ERP-agnostic","Add it to the existing stack without replacing the current OMS or ERP."]]},{"t":"tip","x":"Sync speed is under 10 seconds: use that figure everywhere. Always confirm the exact connector, version and flows rather than quoting the integration count as proof of fit."}]},{"h":"Vendor Inventory Management & Fulfilment","b":[{"t":"grid","items":[["Direct vendor fulfilment","Marketplace, D2C and B2B orders fulfilled directly from vendor locations, with no warehousing on your side."],["Cross-docking ready","B2C orders fulfilled as soon as inventory arrives, with no putaway or picking."],["APIs","REST APIs to connect vendor OMS, WMS or ERP systems."],["Volume surges","Intelligent allocation and vendor task panels to absorb order spikes."]]},{"t":"reveal","q":"What is Vendor Inventory Management, in one line?","a":"Brands expose stock from their own (or a vendor’s) warehouse without moving it, for example by CSV upload on a vendor portal, and orders are fulfilled through stock transfer notes."}]},{"h":"Questions prospects ask","b":[{"t":"reveal","q":"“How do you avoid overselling? Do I need a safety buffer?”","a":"Near-zero buffer exposure (100% inventory exposure). A store-level buffer can still be set, and stock pools can be split for B2B and B2C."},{"t":"reveal","q":"“Can I reserve stock for B2B?”","a":"Yes. Create virtual inventory pools and map a pool to B2B, for example exposing 50 of 100 units."},{"t":"reveal","q":"“Are OMS and WMS one product or separate?”","a":"They’re integrated in the Omnichannel Fulfilment System but can be bought separately by use case. Some clients keep their own WMS and use only the order layer."},{"t":"reveal","q":"“Can you route orders by tag or order type, not just PIN code?”","a":"Currently routing uses PIN-code proximity and inventory availability. Routing by tag is not confirmed: needs an owner. Don’t promise it."},{"t":"reveal","q":"“Can I edit an order after dispatch?”","a":"Only before invoicing. After invoicing: cancel and recreate, then re-scan and repack."},{"t":"reveal","q":"“Do you do financial reconciliation, stock transfer notes and GST?”","a":"No. Increff is a workflow system; the ERP handles reconciliation, STNs and credit notes. Raise this early: one prospect was dissatisfied because a competitor automated it."}]},{"h":"Discovery for order flows","b":[{"t":"chips","items":["Where is the order created?","Which system reserves inventory?","Who decides the fulfilment node?","Can the order move to another node?","Are split shipments acceptable?","How do cancellations release inventory?","How do status and returns flow back?"]}]}],"quiz":[{"q":"How can a brand keep 50 of 100 units for B2B?","o":["Not possible","Virtual inventory pools mapped to B2B","Manual spreadsheet","Separate warehouse only"],"a":1,"w":"Pools split expos
