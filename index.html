<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Increff Learning Academy</title>
<style>
:root{--navy:#152C53;--navy2:#1E3B6B;--coral:#EB5C5E;--muted:#5B6270;--line:#E5E7EB;--panel:#F6F8FB;--green:#1F8A5B;--red:#C8393B;--bg:#EEF2F8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--navy);background:var(--bg);line-height:1.5;font-size:16px}
a{color:var(--coral)}
button{font-family:inherit}
.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20}
.top .in{max-width:1120px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px}
.logo{display:inline-flex;background:#fff;border-radius:8px;padding:4px 8px}
.logo svg{height:28px;width:auto}
.brand{font-weight:800;font-size:17px;letter-spacing:.2px}
.brand small{display:block;font-weight:600;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#F7A9AA}
.sp{flex:1}
.tb{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;cursor:pointer}
.tb:hover{background:rgba(255,255,255,.2)}
.wrap{max-width:1120px;margin:0 auto;padding:28px 20px 80px}
.hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;border-radius:20px;padding:36px 40px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-120px;top:-140px;width:420px;height:420px;border-radius:50%;border:34px solid rgba(235,92,94,.2);pointer-events:none}
.hero h1{font-size:34px;line-height:1.15;font-weight:800;max-width:640px}
.hero p{color:#C9D3E6;max-width:640px;margin-top:10px;font-size:17px}
.hero .row{display:flex;gap:16px;margin-top:22px;flex-wrap:wrap;align-items:center;position:relative;z-index:1}
.hero input{border:none;border-radius:10px;padding:11px 14px;font-size:15px;min-width:240px}
.bar{height:10px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden;width:260px}
.bar i{display:block;height:100%;background:var(--coral);border-radius:99px;transition:width .4s}
.prog-l{font-size:14px;color:#C9D3E6}
.how{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0 8px}
.how div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:14px;color:var(--muted)}
.how b{display:block;color:var(--navy);font-size:15px;margin-bottom:2px}
.part{margin-top:30px}
.part-h{display:flex;align-items:baseline;gap:12px;margin-bottom:4px}
.part-h .pl{font-size:13px;font-weight:800;letter-spacing:2px;color:var(--coral);text-transform:uppercase}
.part-h h2{font-size:24px;font-weight:800}
.part-b{color:var(--muted);margin-bottom:12px;font-size:15px}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.mod{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:6px;min-height:150px;text-align:left;font-size:inherit;color:inherit}
.mod:hover{border-color:var(--coral);transform:translateY(-2px);box-shadow:0 6px 18px rgba(21,44,83,.08)}
.mod .id{font-size:12px;font-weight:800;color:var(--coral);letter-spacing:1px}
.mod h3{font-size:17px;line-height:1.25}
.mod p{font-size:13.5px;color:var(--muted)}
.mod .st{margin-top:auto;font-size:12.5px;font-weight:700;display:flex;justify-content:space-between}
.mod.locked{opacity:.55;cursor:not-allowed}
.mod.locked:hover{transform:none;border-color:var(--line);box-shadow:none}
.mod.done{border-color:#BFE3D0;background:#F7FCF9}
.pill{display:inline-block;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:99px;letter-spacing:.4px;text-transform:uppercase}
.p-g{background:#E3F4EC;color:var(--green)}.p-n{background:#EEF0F4;color:var(--muted)}.p-c{background:#FDE7E7;color:var(--red)}.p-b{background:#E4EDFB;color:#2F6FD6}
.soon{background:#fff;border:1.5px dashed #C7CFDC;border-radius:16px;padding:18px;color:var(--muted);font-size:14px}
.int{display:inline-block;background:var(--navy);color:#fff;font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;border-radius:6px;padding:2px 7px;margin-right:6px;vertical-align:1px}
/* lesson */
.lhead{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.back{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600;color:var(--navy)}
.lhead .t{font-weight:800;font-size:20px}
.lhead .t small{display:block;font-size:12px;letter-spacing:1.5px;color:var(--coral);text-transform:uppercase}
.steps-bar{display:flex;gap:5px;margin-bottom:18px}
.steps-bar span{flex:1;height:6px;border-radius:99px;background:#D6DDE8;cursor:pointer}
.steps-bar span.on{background:var(--coral)}.steps-bar span.seen{background:var(--navy)}
.card{background:#fff;border-radius:20px;border:1px solid var(--line);padding:34px 38px;min-height:420px;animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card h2{font-size:28px;line-height:1.2;font-weight:800;margin-bottom:6px}
.card .sub{color:var(--muted);margin-bottom:18px}
.card > .blk{margin-top:16px}
.card p.tx{font-size:17px}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.btn{background:var(--navy);color:#fff;border:none;border-radius:12px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer}
.btn:hover{background:var(--navy2)}
.btn.c{background:var(--coral)}.btn.c:hover{background:#D84B4D}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.grid div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;font-size:15px}
.grid b{display:block;font-size:16px;margin-bottom:4px}
.tip{background:#FFF6EC;border-left:4px solid var(--coral);border-radius:10px;padding:12px 16px;font-size:15px}
.reveal{border:1.5px solid var(--navy);border-radius:14px;overflow:hidden}
.reveal .q{padding:14px 18px;font-weight:600;font-size:16px;display:flex;gap:14px;align-items:flex-start;justify-content:space-between}
.reveal .q:before{content:"?";flex:none;width:26px;height:26px;border-radius:50%;background:var(--coral);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px}
.reveal .q span{flex:1}
.reveal button{flex:none;background:var(--navy);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-weight:700;cursor:pointer;font-size:13px}
.reveal .a{display:none;background:#F1F6FE;padding:14px 18px 14px 58px;border-top:1px solid var(--line);font-size:15.5px}
.reveal.open .a{display:block}
.flow{display:flex;gap:6px;flex-wrap:wrap}
.flow button{flex:1;min-width:110px;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:12px 8px;font-weight:700;font-size:14px;cursor:pointer;color:var(--navy);position:relative}
.flow button small{display:block;font-size:11px;color:var(--coral);font-weight:800}
.flow button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.flow-d{margin-top:12px;background:var(--panel);border-radius:14px;padding:16px 18px;min-height:96px;font-size:15.5px}
.flow-d .fit{margin-top:8px;padding-top:8px;border-top:1px dashed #CBD3E0;color:var(--navy)}
.flow-d .fit b{color:var(--coral)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:600;cursor:pointer;font-size:14px;color:var(--navy)}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tabd{background:var(--panel);border-radius:14px;padding:6px 18px}
.tabd div{padding:10px 0;border-bottom:1px solid var(--line);font-size:15.5px;display:grid;grid-template-columns:190px 1fr;gap:12px}
.tabd div:last-child{border:none}
.tabd b{color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:1px;padding-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:6px 13px;font-size:14px;font-weight:600}
.flips{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.flip{perspective:900px;height:178px;cursor:pointer}
.flip .fi{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .fi{transform:rotateY(180deg)}
.flip .fr,.flip .bk{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:16px;display:flex;flex-direction:column;justify-content:center}
.flip .fr{background:var(--navy);color:#fff;text-align:center;align-items:center;font-weight:800;font-size:19px}
.flip .fr small{font-size:11px;font-weight:600;color:#F7A9AA;letter-spacing:1px;margin-top:8px;text-transform:uppercase}
.flip .bk{background:#fff;border:1.5px solid var(--navy);transform:rotateY(180deg);font-size:13.5px;justify-content:flex-start;overflow:auto}
.flip .bk .qq{margin-top:8px;color:var(--coral);font-weight:600;font-size:12.5px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stats div{background:var(--panel);border-radius:14px;padding:14px 16px;border:1px solid var(--line)}
.stats b{display:block;font-size:30px;font-weight:800;color:var(--coral);line-height:1.1}
.stats span{font-size:13.5px;color:var(--muted)}
.quote{background:var(--panel);border-radius:16px;padding:22px 24px;border:1px solid var(--line);min-height:190px}
.quote p{font-size:17px;font-style:italic}
.quote .who{margin-top:12px;font-weight:800}.quote .who span{display:block;font-weight:500;color:var(--muted);font-size:14px}
.qnav{display:flex;gap:8px;align-items:center;margin-top:10px}
.qnav button{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.people div{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;text-align:center}
.people .av{width:62px;height:62px;border-radius:50%;background:var(--navy);color:#fff;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.people b{display:block}.people span{font-size:13.5px;color:var(--muted)}
.stps{counter-reset:s;display:grid;gap:8px}
.stps div{display:flex;gap:14px;align-items:flex-start;background:var(--panel);border-radius:12px;padding:12px 16px;font-size:15px}
.stps div:before{counter-increment:s;content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--coral);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.calc{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.calc label{font-size:12.5px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.calc input{width:120px;border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;font-size:16px;font-weight:700;color:var(--navy)}
.calc .out{font-size:16px;flex:1;min-width:220px;background:#fff;border-radius:10px;padding:10px 14px;border:1px solid var(--line)}
.calc .out b{color:var(--coral);font-size:20px}
/* quiz */
.qz .qi{border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:12px}
.qz .qi .qt{font-weight:700;margin-bottom:10px}
.qz .qi .qt span{color:var(--coral);margin-right:6px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;margin-top:6px;cursor:pointer;font-size:15px;color:var(--navy)}
.opt:hover{border-color:var(--navy)}
.opt.sel{border-color:var(--navy);background:#EEF3FB;font-weight:600}
.opt.ok{border-color:var(--green);background:#E3F4EC}
.opt.bad{border-color:var(--red);background:#FBE3E3}
.why{margin-top:8px;font-size:14px;color:var(--muted);display:none}
.qz.graded .why{display:block}
.res{border-radius:16px;padding:20px 22px;margin-top:16px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.res.pass{background:#E3F4EC}.res.fail{background:#FBE3E3}
.res b{font-size:32px}
/* glossary */
#gl{position:fixed;inset:0;background:rgba(14,30,58,.45);display:none;z-index:50;justify-content:flex-end}
#gl.open{display:flex}
#gl .pn{background:#fff;width:min(460px,100%);height:100%;padding:22px;display:flex;flex-direction:column}
#gl input{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;margin:12px 0}
#gl .ls{overflow:auto;flex:1}
#gl .it{padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
#gl .it b{display:block;font-size:15px}
#gl .it a{font-size:12px;font-weight:700;cursor:pointer}
.x{background:none;border:none;font-size:22px;cursor:pointer;color:var(--navy)}
.rc{width:100%;border-collapse:collapse;font-size:14.5px}
.rc th,.rc td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top}
.rc th{width:200px;color:var(--navy);font-weight:700;background:var(--panel)}
.tw{overflow-x:auto}.tbl th{width:auto;min-width:120px}.tbl tr:first-child th{background:var(--navy);color:#fff}
.bant .bg{display:grid;grid-template-columns:130px repeat(3,1fr);gap:6px}
.bh{text-align:center;font-weight:800;font-size:13px;border-radius:8px;padding:6px}.bh.g{background:#E3F4EC;color:var(--green)}.bh.y{background:#FFF3D6;color:#8A5E00}.bh.r{background:#FBE3E3;color:var(--red)}
.bl{font-weight:800;display:flex;align-items:center}
.bc{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px;cursor:pointer;font-weight:700;color:var(--muted)}
.bc.G.on{background:var(--green);color:#fff;border-color:var(--green)}.bc.Y.on{background:#C98A00;color:#fff;border-color:#C98A00}.bc.R.on{background:var(--red);color:#fff;border-color:var(--red)}
.bo{margin-top:12px;border-radius:12px;padding:12px 16px;font-size:15.5px}.bo.g{background:#E3F4EC}.bo.y{background:#FFF3D6}.bo.r{background:#FBE3E3}.bo.n{background:var(--panel)}
.bex{margin-top:12px;font-size:13px;color:var(--muted)}.bex button{margin:4px 6px 0 0;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer;font-size:13px;font-weight:600;color:var(--navy)}
.bw{margin-top:8px;font-size:14.5px}
.rcq{background:var(--panel);border-radius:10px;padding:10px 14px;margin-top:8px;font-size:14.5px}
.rvb{margin-top:26px;background:#FFF6EC;border:1px solid #F5C9A8;border-radius:14px;padding:14px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:14.5px}
.rvp{margin-top:30px;text-align:center;font-size:14px}
.rvp input{border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;margin-left:8px}
.rvp .btn{padding:8px 14px;font-size:13px}
.lnk{background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px}
.cert{margin-top:16px;border:3px double var(--navy);border-radius:18px;padding:34px;text-align:center;background:linear-gradient(180deg,#fff,#F6F8FB)}
.cert .cl svg{height:40px;width:auto}.ck{margin-top:10px;font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--coral);font-weight:800}
.cn{font-size:34px;font-weight:800;margin:10px 0}.ct{max-width:640px;margin:0 auto;color:var(--muted)}.cd{margin-top:14px;font-weight:700}
.reg{position:relative;z-index:1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px;width:100%}.reg b{width:100%;color:#fff}.reg input{min-width:200px}#rerr{color:#F7A9AA;font-size:13px;width:100%}.consent{color:#C9D3E6;font-size:12px;width:100%}
#rnote .pill{vertical-align:middle;background:#fff;color:var(--navy)}#rnote .lnk{color:#fff}#rnote span{color:#C9D3E6}
.foot{text-align:center;color:#8C95A6;font-size:13px;margin-top:40px}
@media (max-width:760px){.how{grid-template-columns:1fr 1fr}.card{padding:22px 18px}.hero{padding:26px 22px}.hero h1{font-size:26px}.tabd div{grid-template-columns:1fr}}
</style>
</head>

const PARTS=[{"id":"A","title":"Retail from zero","blurb":"How retail works, the words people use, the numbers they track and the systems they run. No Increff knowledge needed.","modules":["A1","A2","A3","A4","A5","A6","AX"]},{"id":"B","title":"Increff 101","blurb":"Who Increff is, who leads it, who does what in a deal, and how our team is set up.","modules":["B1","B2","B3","BX"]},{"id":"C","title":"Our products","blurb":"AI Planning OS and the Omnichannel Fulfilment System: what each module does, what it doesn’t, and how to answer product questions.","modules":["C1","C2","C3","C4","C5","C6","C7","CX"]},{"id":"D","title":"Industries & proof","blurb":"Industry use cases, the Lulu supermarket model, and choosing the right customer story.","modules":["D1","D2","D3","DX"]},{"id":"E","title":"Competition & objections","blurb":"The alternatives buyers compare us with, and how to handle every common objection with LAER+.","modules":["E1","E2","E3","E4","E5","EX"]},{"id":"F","title":"Qualifying & selling","blurb":"Sales words, ICP and routing, BANT in detail, field lessons, scenario practice, the handoff and running a discovery call.","modules":["F1","F2","F3","F4","F5","F6","F7","FX"]},{"id":"G","title":"Partnerships & commercial models","blurb":"Partner types, rev share, CPL and retainers, partner questions, the partner lifecycle and our tools.","modules":["G1","G2","G3","G4","GX"]},{"id":"X","title":"Final certification","blurb":"One exam across everything. Pass to earn your certificate.","modules":["X1"]}];
const MODULES={"A1":{"title":"How a retail business works","mins":12,"intro":"Follow one product from idea to customer, and learn why stock can be too much and too little at the same time.","cards":[{"h":"Brands, retailers and channels","b":[{"t":"p","x":"A <b>brand</b> designs or sources products under its own name. A <b>retailer</b> sells products to end customers. Many businesses do both: a fashion brand can sell through its own stores, its own website, marketplaces and other retailers at the same time."},{"t":"grid","items":[["Channel","Where the customer buys: a physical store, the brand’s own website or app, a marketplace, or another business buying in bulk (wholesale)."],["Node","A place where stock sits and from which an order can be shipped: a warehouse, a store, a dark store, or a vendor’s location."],["Dark store","A small hub close to customers that only fulfils online orders. Shoppers can’t walk in."],["Inventory","The stock a business owns. It is money sitting on shelves until it sells."]]}]},{"h":"Follow one product from plan to customer","sub":"Click each step.","b":[{"t":"flow","steps":[["Plan & buy","The business decides what to buy, how much, and for which stores and channels, within a budget for the season.","AI Planning OS: demand forecasting, financial plans, assortment and buying."],["Make or source","A factory or supplier produces the goods against a purchase order (PO).","Not Increff. We work with finished goods only, not raw materials or manufacturing."],["Receive & store","Goods arrive at a warehouse, are checked against the order, and put into a recorded storage location (a bin).","Increff WMS: receiving, putaway, bin-level control."],["Send to stores","Stock is allocated to stores, topped up as it sells, and moved between stores when one has too much and another too little.","AI Planning OS: allocation, replenishment, inter-store transfers."],["Sell & take orders","Customers buy in store, online or on marketplaces. Every channel must show the right stock.","Increff OMS and Channel Management: orders and stock across channels."],["Pick, pack, deliver","The order is picked, packed, handed to a courier, and tracked to the customer.","Increff WMS and order orchestration; store fulfilment for ship-from-store and click-and-collect."],["Returns & markdowns","Some items come back. Unsold stock at season end is cleared with discounts.","WMS and OMS for returns; AI Planning OS for markdown optimisation."]]},{"t":"tip","x":"Increff works with <b>finished goods only</b>. It does not plan raw materials or manufacturing; that needs an MRP (material requirements planning) tool, and we can introduce a partner."}]},{"h":"Inventory is not one number","sub":"Try it before you reveal the answer.","b":[{"t":"reveal","q":"A warehouse has 100 units. 10 are quarantined (blocked for a quality check) and 20 are reserved for orders already placed. Before any other rules, how many units might be available to sell?","a":"About <b>70</b>. 100 physical, minus 10 blocked, minus 20 reserved."},{"t":"grid","items":[["1. Physical / on-hand","It exists somewhere."],["2. Usable","Not damaged, expired, quarantined or otherwise blocked."],["3. Available-to-sell","Can be offered after reservations and business rules."],["4. Channel-published","What a website or marketplace currently shows."]]},{"t":"tip","x":"When a customer says “stock was available”, ask: <i>which system showed it, at what time, and was it actually available for that order?</i>"}]},{"h":"Too much and too little, at the same time","b":[{"t":"p","x":"A chain has enough shirts overall. But sizes M and L sell out in its busiest stores, while other sizes pile up elsewhere. Buying more of everything would make the excess worse."},{"t":"reveal","q":"Can a retailer have too much stock and still suffer stock-outs?","a":"Yes. Stock can be in the <b>wrong place</b>, the <b>wrong size mix</b>, or arrive at the <b>wrong time</b>. This is the single most important idea behind everything Increff sells."}]},{"h":"Four places a retail journey breaks","sub":"Ask where it failed before you think about any product.","b":[{"t":"grid","items":[["Inventory decisions","Wrong buy, assortment, location, size mix, replenishment, transfer or markdown."],["Connectivity","Information cannot reliably move between systems."],["Order coordination","Inventory and orders are not coordinated across channels and nodes."],["Execution","Receiving, storage, picking, packing, dispatch or returns don’t work reliably."]]},{"t":"tip","x":"A single cancelled order can come from any of the four. That is why we diagnose first."}]},{"h":"Which problem is it?","sub":"Name the likely problem area and the question you would ask next, then reveal.","b":[{"t":"reveal","q":"“We cancel online orders even though stores have the stock.”","a":"Could be visibility, availability rules, node allocation or store execution. <b>Ask:</b> is store stock reliable and eligible to be sold online?"},{"t":"reveal","q":"“Pickers can’t find items.”","a":"Location control or process recording (execution). <b>Ask:</b> where did the stock last move, and what does the system show?"},{"t":"reveal","q":"“Our best-selling sizes sell out.”","a":"Buying, size mix, allocation or replenishment (inventory decisions). <b>Ask:</b> does the stock exist elsewhere, and how are these decisions made?"},{"t":"reveal","q":"“Every channel launch needs manual uploads.”","a":"Connectivity: master-data mapping or channel workflow. <b>Capture</b> the specific flow."},{"t":"reveal","q":"“Returned stock sits untouched for days.”","a":"Returns execution and inventory-status update. <b>Identify</b> the bottleneck."},{"t":"reveal","q":"“We need AI.”","a":"No diagnosis yet. <b>Ask:</b> which decision or task should improve, and how would success be measured?"}]}],"quiz":[{"q":"“We need AI.” What is your best next question?","o":["“Great, which AI module?”","“Which decision or task should improve, and how would you measure success?”","“How big is your AI budget?”","Book a demo straight away"],"a":1,"w":"“We need AI” is not a diagnosis. Find the decision or task first."},{"q":"“Pickers can’t find items.” Which problem area is this most likely?","o":["Inventory decisions","Connectivity","Execution: location control or process recording","Markdown"],"a":2,"w":"Ask where the stock last moved and what the system shows."},{"q":"A prospect says: “Our website showed the jacket in stock, but the warehouse couldn’t find it.” Which inventory layer was wrong?","o":["Physical / on-hand","Channel-published vs actual usable stock","Available-to-sell after markdown","None. This is a courier issue"],"a":1,"w":"The website (channel-published) showed stock that wasn’t usable or findable. Ask which system showed it and when."},{"q":"A store chain has 40% more stock than last year and still loses sales on best-sellers. What is the most likely explanation?","o":["They need to buy more of everything","Stock is in the wrong place, size mix or time","Their stores are too small","It can’t happen; excess means no stock-outs"],"a":1,"w":"Excess and stock-outs often exist together. Buying more of everything usually makes excess worse."},{"q":"Which of these is a node, not a channel?","o":["A marketplace","The brand’s mobile app","A dark store","Wholesale buyers"],"a":2,"w":"A node is where stock sits and ships from. A dark store is a node; the others are places customers buy."},{"q":"“Orders download from our website manually every morning. The warehouse itself runs fine.” Which problem category is this?","o":["Inventory decisions","Connectivity","Execution","Markdown"],"a":1,"w":"Information isn’t moving between systems. Investigate the order flow before proposing anything for the warehouse."},{"q":"A prospect asks whether Increff can plan their raw-material purchases for their factory. What is true?","o":["Yes, AI Planning OS covers raw materials","Increff works with finished goods only; raw materials need an MRP tool","Only the WMS handles raw materials","Yes, but only for apparel"],"a":1,"w":"Finished goods only. Offer to introduce a partner for MRP needs."}]},"A2":{"title":"Business models and industries","mins":12,"intro":"The same industry can need very different conversations. Learn to spot how a business operates.","cards":[{"h":"Six operating models","sub":"Always identify which ones a prospect runs. Most run more than one.","b":[{"t":"grid","items":[["D2C (direct-to-consumer)","The brand sells straight to customers through its own website or app and ships parcels, usually piece by piece."],["Store-led","Most sales happen in the brand’s or retailer’s physical stores."],["Wholesale / B2B","Selling in bulk to other businesses, usually in cartons or pallets."],["Marketplace seller","Selling through platforms that own the customer storefront."],["3PL","A third-party logistics company runs warehouses and fulfilment for brands. The brands own the stock; the 3PL only stores and ships it."],["Mixed / omnichannel","Several of the above at once, with customer and stock journeys coordinated across channels."]]}]},{"h":"Same industry, different discovery","b":[{"t":"p","x":"A carton-based distributor and a piece-pick D2C brand need different discovery, even if both sell shoes. One ships pallets to a few buyers; the other ships thousands of single-item parcels a day."},{"t":"reveal","q":"A prospect sells home furnishings. What two things should you find out before anything else?","a":"Their <b>operating model</b> (stores, D2C, wholesale, marketplace, mixed) and the <b>unit</b> they buy, store and ship (piece, carton, pallet)."}]},{"h":"Fashion and non-fashion","b":[{"t":"grid","items":[["Fashion (lifestyle)","Apparel, footwear, cosmetics, home decor, luggage."],["Non-fashion","FMCG, food, healthcare, electronics."]]},{"t":"p","x":"Increff isn’t category-specific. Customers span many verticals, including sarees, luggage, jewellery, pharmacy, watches and home decor."},{"t":"tip","x":"If a prospect’s exact category is new to us, say so honestly, then share relevant experience from a similar category."}]},{"h":"Industry basics: what to recognise and ask","sub":"Click an industry.","b":[{"t":"tabs","items":[["Apparel","Style-colour-size, seasonality, returns.","Are stock-outs size-specific? How are winners replenished?","Attribute/size logic and the return workflow."],["Footwear","Size curves (the mix of sizes), broken size runs (key sizes missing in a store, e.g. only 6 and 10 left), residual stock.","How do you identify incomplete assortments?","Pair/unit tracking and planning scope."],["Beauty","Batch/expiry (each batch has an expiry date), kits, channel policies (each marketplace may demand a minimum remaining shelf life).","What remaining shelf life does each channel require?","FEFO, batches and bundle scope."],["Food / CPG","Shelf life, cases vs pieces, traceability.","Which units are bought, stored and dispatched?","Units of measure, batch/recall requirements."],["Jewellery / accessories","High value, attributes, item traceability.","Which controls and item identifiers are mandatory?","RFID/serialisation, special compliance."],["Home / furniture","Bulky goods, sets, long lead times.","Is fulfilment constrained by stock, components or delivery?","Handling and long-cycle planning fit."],["Electronics","Serial numbers/warranty, bundles, return verification.","Where must serial identity be captured?","Warranty/serial integration scope."]],"labels":["Recognise","Ask","Validate with a specialist"]}]},{"h":"Verticals Increff serves","b":[{"t":"chips","items":["Fashion & lifestyle","Fashion & apparel","Footwear & sportswear","Jewellery & accessories","Eyewear","Beauty, cosmetics & personal care","Home furnishing & decor","Retail & consumer","Books & stationery","Health care & pharma","General merchandise","Consumer goods","Electronics & appliances","Automotive","Supply chain & enterprise","Wholesale & distribution","Postal & parcel carriers","Third-party logistics (3PL)","Manufacturing","Agriculture"]},{"t":"p","x":"Source: Increff Overview deck. Use cases for each are covered in Part D."}]}],"quiz":[{"q":"A brand ships 200 cartons a week to 12 department stores and has no website. Which operating model is this?","o":["D2C","Wholesale / B2B","Marketplace seller","3PL"],"a":1,"w":"Bulk sales in cartons to other businesses is wholesale/B2B."},{"q":"A 3PL asks to use Increff for its warehouses. Who owns the stock inside?","o":["The 3PL","Increff","The brands whose goods they store","The courier"],"a":2,"w":"A 3PL is a fulfilment provider. The brand owns the inventory."},{"q":"A beauty brand sells on two marketplaces with different shelf-life rules. Which question matters most?","o":["How many stores do you have?","What remaining shelf life does each channel require?","Who designs your packaging?","Do you use RFID?"],"a":1,"w":"Beauty is about batch, expiry and channel policies. Capture the exact rule; batch/expiry depth needs specialist validation."},{"q":"A footwear prospect says some stores have size 6 and 10 but nothing in between. What is this called?","o":["A marketplace issue","A broken size run","A wholesale order","A 3PL problem"],"a":1,"w":"Missing sizes in the middle of a run is a broken size run, a key footwear and apparel problem."},{"q":"A prospect sells consumer durables, a category where we have no direct customer. What do you say?","o":["Claim we have many in that category","Say so honestly, then share relevant experience from a similar category","End the call","Promise a custom build"],"a":1,"w":"Honesty first, then a relevant analogue. Never over-promise category experience."}]},"A3":{"title":"Product and planning words","mins":15,"intro":"The vocabulary planners and merchandisers use every day. Flip each card, then try the question it unlocks.","cards":[{"h":"What is being sold","sub":"Click a card to flip it.","b":[{"t":"flip","items":[["SKU","Stock-keeping unit: one distinct variant. A shirt in one style, colour and size is one SKU.","How many SKUs are active, and how much does the range change?"],["Style","The design itself, before colour and size. One style can have many SKUs.","How many styles per season, and how many sizes per style?"],["Item / serial identifier","An ID for one individual physical unit, not just its SKU.","Do you need to trace a particular unit through dispatch and return?"],["Assortment width","The variety of options: how many different styles or products.","Is the issue too many options, or the wrong quantity per option?"],["Assortment depth","How many units you hold of each option.","Do you run out of winners while slow options sit?"],["Size curve","The mix of sizes bought or sent for a style (e.g. more M and L than XS).","How do you decide the size mix per store?"],["Broken size run","A style where key sizes are missing in a location.","How do you spot incomplete assortments?"],["Season","The selling window for a range. Pre-season = planning before it; in-season = managing during it.","Where does planning effort go: before or during the season?"]]}]},{"h":"Getting stock to the right place","b":[{"t":"flip","items":[["Allocation","The initial distribution of stock to stores or channels. Not the same as reserving stock for an order.","Are we discussing stock sent to stores, or stock reserved for orders?"],["Replenishment","Topping up stock as demand consumes it.","How often is replenishment decided, and how fast is it executed?"],["IST (inter-store transfer)","Moving stock from one store to another that needs it more.","How do you weigh the demand gain against transfer cost?"],["Store clustering","Grouping stores that behave alike so they get similar ranges.","How are your stores grouped today?"],["Rate of sale (ROS)","Units sold per day or week. Increff’s “true ROS” uses only healthy, in-stock days.","How do you tell low demand from lost sales due to no stock?"],["Markdown","A reduction in selling price, often to clear aged stock.","How are products and discount levels chosen, and who approves?"]]}]},{"h":"Planning the money","b":[{"t":"flip","items":[["MFP (merchandise financial planning)","Setting sales, margin, stock and intake targets across category, channel, region and store.","How are top-down targets and bottom-up plans reconciled?"],["OTB (open-to-buy)","The buying budget still available under the merchandise plan.","How are sales, stock and intake plans linked to buying?"],["WSSI","Weekly sales, stock and intake plan: the week-by-week view used to track OTB through the season.","How often are buying budgets re-checked in-season?"],["Demand forecast","An estimate of future sales, used to drive buying and stock decisions.","What level do you forecast at: category, style, or store-SKU?"]]},{"t":"tip","x":"Planning answers <b>what to buy, how much, where to send it, when to top up or move it, and when to discount it</b>. It does not physically move goods."}]}],"quiz":[{"q":"“We have 40 shirt styles, each in 3 colours and 5 sizes.” How many SKUs is that?","o":["40","120","600","200"],"a":2,"w":"40 × 3 × 5 = 600 SKUs."},{"q":"A planner says: “We send the first lot to stores at launch, then top up weekly.” Which two terms describe this?","o":["Markdown, then IST","Allocation, then replenishment","OTB, then WSSI","Putaway, then picking"],"a":1,"w":"The first distribution is allocation. Weekly top-ups are replenishment."},{"q":"Store A has 30 unsold units of a style; Store B sold out in a week. Moving stock from A to B is called…","o":["Replenishment from warehouse","Inter-store transfer (IST)","Markdown","Allocation"],"a":1,"w":"Moving stock store-to-store is an IST. Always weigh the gain against transfer cost."},{"q":"A style sold 0 units last week in a store that had none in stock. What does “true ROS” do with that week?","o":["Counts it as zero demand","Excludes it, using only healthy in-stock days","Doubles the next week","Adds it to markdown"],"a":1,"w":"True ROS uses only in-stock days, so a stock-out isn’t mistaken for low demand."},{"q":"The finance head asks how much buying budget is left for the season. Which term is she asking about?","o":["Rate of sale","Size curve","Open-to-buy (OTB)","Store clustering"],"a":2,"w":"OTB is the buying capacity still available under the plan."}]},"A4":{"title":"Warehouse, order and store words","mins":15,"intro":"What happens between a goods truck arriving and a parcel reaching a customer.","cards":[{"h":"Inside the warehouse","sub":"In the order things happen.","b":[{"t":"flip","items":[["PO (purchase order)","The order a business places with a supplier.","Which system creates POs, and does the warehouse see them?"],["ASN (advance shipping notice)","The supplier’s note of what is coming, sent before goods arrive.","Do suppliers send ASNs, and are they matched to POs?"],["GRN (goods received note)","The record of goods received, with quantity and condition.","When does received stock become usable and sellable?"],["Putaway","Placing received goods into a recorded location.","Is the location confirmed at putaway?"],["Bin","A recorded storage location inside the warehouse.","How do operators know where to find stock?"],["Picking","Retrieving the items for an order from their bins.","Where do errors or delays enter?"],["Packing","Verifying items against the order and preparing the shipment.","How are wrong items caught before dispatch?"],["Cycle count","Counting part of the stock regularly instead of shutting down for a full count.","How often do you count, and how big is the variance?"],["Cross-docking","Shipping goods out as soon as they arrive, with no putaway or picking.","Which flows could skip storage?"]]}]},{"h":"How stock is tracked","b":[{"t":"flip","items":[["Serialized","Every unit gets its own unique code and is scanned at each step. Gives a full audit trail per piece.","Do you need to trace individual units?"],["Non-serialized","Stock is tracked by SKU and unit of measure, not by individual piece.","Do you move goods in bulk (cases, cartons)?"],["Unit of measure (UoM)","The unit goods are counted in: each (piece), case, carton or pallet.","Which units are bought, stored and dispatched?"],["FIFO","First in, first out: oldest stock ships first.","Is rotation based on arrival date?"],["FEFO","First expired, first out: stock nearest expiry ships first.","Is rotation based on expiry? (Scope needs validation.)"],["Kits / virtual bundle","A sellable combination of components, sometimes without pre-packing it.","How is component availability handled?"],["RFID","Radio tags that let items be read without a line-of-sight scan.","Which controls and identifiers are mandatory?"]]},{"t":"reveal","q":"“An item-level barcode and a SKU barcode mean the same thing.” True or false?","a":"<b>False.</b> Many units share one SKU barcode. An item identifier distinguishes one specific unit."}]},{"h":"Orders and delivery","b":[{"t":"flip","items":[["Dispatch","Handing a packed order to the courier.","What evidence is kept of what was handed over?"],["AWB (air waybill)","The shipment’s tracking reference.","Which system generates it and receives tracking updates?"],["SLA","The agreed service target. Always define start, end and how it is measured.","Is the target dispatch or delivery, and when does the clock start?"],["COD","Cash on delivery: the customer pays the courier on receipt.","What share of orders are COD?"],["RTO","Return to origin: an undelivered shipment coming back (refused, unreachable).","How is RTO handled differently from a customer return?"],["Customer return","A delivered item the customer sends back.","How fast is returned stock sellable again after inspection?"]]}]},{"h":"Stores as fulfilment points","b":[{"t":"flip","items":[["Ship from store","An online order packed and dispatched from a store instead of the warehouse.","Is store stock reliable enough to promise online?"],["BOPIS","Buy online, pick up in store (also called click-and-collect).","Which stores can offer pickup, and how fast?"],["BORIS","Buy online, return in store.","How do online returns get back into store stock?"],["Endless aisle","Selling items not in this store from the wider network, on a phone or tablet.","How do staff see stock in other locations?"],["Dark store","A small fulfilment hub near customers, not open to walk-ins.","Which areas need faster delivery?"],["Self-checkout / scan-and-go","Customers scan and pay on their phone without a billing counter.","Where do queues hurt the store experience?"]]}]}],"quiz":[{"q":"“Our trucks arrive and we often don’t know what’s inside until we open them.” What document is missing?","o":["AWB","ASN (advance shipping notice)","RTO","OTB"],"a":1,"w":"An ASN tells the warehouse what is coming before it arrives, so it can be matched to the PO."},{"q":"A parcel couldn’t be delivered because the customer refused a COD order, and it’s heading back. What is this?","o":["A customer return","RTO (return to origin)","Cross-docking","BORIS"],"a":1,"w":"An undelivered forward shipment coming back is an RTO, not a customer return."},{"q":"A beauty brand wants stock with the nearest expiry to ship first. Which rule is this?","o":["FIFO","FEFO","BOPIS","UoM"],"a":1,"w":"First expired, first out. Its depth in a specific setup needs specialist validation."},{"q":"A customer orders online and collects from her nearest store an hour later. What is this called?","o":["BOPIS (click-and-collect)","Ship from store","Endless aisle","Dark store"],"a":0,"w":"Buy online, pick up in store."},{"q":"A wholesaler moves full cartons and finds scanning every single unit too slow. Which tracking approach fits better?","o":["Serialized, every unit scanned","Non-serialized, tracked by SKU and unit of measure","RFID on every item","No tracking"],"a":1,"w":"Non-serialized tracking by SKU and UoM suits bulk, carton-based operations."}]},"A5":{"title":"Metrics, with the maths","mins":15,"intro":"Understand what a number means before you repeat it. Use the calculators.","cards":[{"h":"Sell-through","b":[{"t":"p","x":"<b>Sell-through</b> = units sold ÷ units available or received, over a defined period. <b>Full-price sell-through</b> counts only units sold without markdown."},{"t":"calc","kind":"st"},{"t":"reveal","q":"A store received 200 units and sold 120, of which 30 were on discount. What is the full-price sell-through?","a":"Full-price units = 120 − 30 = 90. 90 ÷ 200 = <b>45%</b>. (Overall sell-through is 60%.)"}]},{"h":"Rate of sale and weeks of cover","b":[{"t":"p","x":"<b>Rate of sale (ROS)</b> = units sold per day or week. <b>Weeks of cover</b> = stock on hand ÷ weekly ROS: how long stock lasts at today’s pace."},{"t":"calc","kind":"ros"}]},{"h":"Percentage points vs percent","b":[{"t":"reveal","q":"Sell-through rose from 40% to 50%. Is that a 10% rise?","a":"It rose <b>10 percentage points</b>, which is a <b>25% relative</b> rise (10 ÷ 40). Say which one you mean."},{"t":"calc","kind":"pp"}]},{"h":"Turns, accuracy, SLA and cancellations","b":[{"t":"grid","items":[["Inventory turns","Usually cost of goods sold ÷ average inventory at cost, over the same period. Higher = stock moves faster."],["Inventory accuracy","How well recorded stock matches actual stock, under a stated method. Unit variance and SKU-location match rates are not interchangeable."],["Order accuracy / pick accuracy","How correct the fulfilled orders or picks are. Not the same as inventory accuracy."],["SLA adherence","Share of eligible events that met the agreed service target."],["Cancellation rate","Cancelled orders or units ÷ the relevant total. Separate customer-initiated from seller-side cancellations."],["Productivity","Output per hour or person. More capacity is not automatically a cash saving."]]},{"t":"reveal","q":"COGS for the year was ₹60 lakh and average inventory at cost was ₹15 lakh. How many turns?","a":"60 ÷ 15 = <b>4 turns</b> a year."}]},{"h":"Talk about impact without inventing ROI","b":[{"t":"p","x":"On a first call, ask about these, and keep them separate:"},{"t":"chips","items":["Manual effort and rework","Stock loss and write-offs","Seller cancellations and penalties","Dispatch delays and complaints","Missed availability and discounting","Stock tied up in the wrong place","Scaling without more people"]},{"t":"tip","x":"Revenue, margin, working capital, cost avoided and time freed are different things. Never add them into one ROI number on a call. Sales and Finance validate the value case."}]}],"quiz":[{"q":"A store sold 84 units in 4 weeks and has 63 units left. Roughly how many weeks of cover does it have?","o":["1 week","3 weeks","4 weeks","21 weeks"],"a":1,"w":"ROS = 84 ÷ 4 = 21 a week. Cover = 63 ÷ 21 = 3 weeks."},{"q":"A prospect’s SLA adherence went from 80% to 92%. How should you describe it?","o":["A 12% rise","A 12 percentage-point rise (15% relative)","A 92% rise","A 15 percentage-point rise"],"a":1,"w":"92 − 80 = 12 points. 12 ÷ 80 = 15% relative."},{"q":"An audit finds 970 of 1,000 SKU-locations match the system. A prospect then says “so our order accuracy is 97%”. What do you say?","o":["Agree","That’s inventory accuracy (SKU-location match); order accuracy is a different measure","That’s sell-through","That’s SLA adherence"],"a":1,"w":"Inventory accuracy and order/pick accuracy are different metrics."},{"q":"A store received 500 units and sold 350. What is the sell-through?","o":["35%","50%","70%","143%"],"a":2,"w":"350 ÷ 500 = 70%."},{"q":"Planners save 2 days a week with better tools. The prospect asks: “So we can cut 2 planners?” Best answer?","o":["Yes, guaranteed","Time saved is capacity; whether it becomes a payroll saving is their decision, and Sales/Finance validate the value case","No savings at all","Yes, plus 20% revenue growth"],"a":1,"w":"Capacity improvement is not automatically cash savings. Never promise headcount cuts."}]},"A6":{"title":"The retail systems map","mins":12,"intro":"Which system does which job, and where Increff sits.","cards":[{"h":"Seven systems you’ll hear about","sub":"Click each one. Roles are typical: always verify in the customer’s setup.","b":[{"t":"tabs","items":[["ERP","Business records, procurement, stock and finance transactions. Usually the system of record.","Examples: SAP, Oracle, Microsoft Dynamics, Tally, Odoo, NetSuite."],["POS","Store sales and related store transactions at the billing counter.","The source of store sales data."],["Commerce platform / marketplace","Customer-facing order and channel activity: the website, app or marketplace.","Example: Shopify for websites."],["OMS","Order management: coordinates orders and inventory across channels and fulfilment nodes.","Decides what is available where and which node ships."],["WMS","Warehouse management: controls physical execution: receive, put away, pick, pack, dispatch, return.","Lives inside the four walls of the warehouse."],["Logistics / carrier","Shipment booking, tracking and delivery. Often through a logistics aggregator.","Generates the AWB and tracking updates."],["Planning / data platform","Planning decisions and analytical inputs: forecasts, buying, allocation, markdowns.","Where AI Planning OS sits."]],"labels":["Its job","Good to know"]}]},{"h":"OMS vs WMS","b":[{"t":"reveal","q":"What is the difference between an OMS and a WMS?","a":"The <b>OMS</b> coordinates orders and inventory across channels and nodes (which stock, which node). The <b>WMS</b> runs the physical work inside one warehouse (receive, store, pick, pack, dispatch, return)."},{"t":"p","x":"Increff offers both, integrated in the Omnichannel Fulfilment System, but they can be bought separately by use case. Some customers keep their own WMS and use only the order layer."}]},{"h":"Where Increff sits","b":[{"t":"grid","items":[["Increff is","An execution and decision layer alongside the ERP. It shares data with ERPs such as Tally, Zoho Books and SAP."],["Increff is not","An ERP, accounting tool, billing system or CRM. It tracks inventory movement, not the sale transaction. The ERP stays the system of record for finance."],["Not covered","Financial reconciliation, stock transfer notes, credit notes and GST stay in the ERP. Raise this early."],["How it runs","In a browser, on Chrome, mobile, tablets and handhelds. No installation. The client supplies printers and handhelds."]]}]},{"h":"An integration is not a promise","b":[{"t":"reveal","q":"A prospect says: “You integrate with our ERP, right?” Does an ERP integration mean every ERP workflow is covered?","a":"<b>No.</b> A connector doesn’t establish which flows are covered, how often data updates, how exceptions are handled, or whether it works with their customisations. Each ERP integration needs its own flows. Validate the exact scope."},{"t":"p","x":"Capture integration needs in this worksheet:"},{"t":"chips","items":["From system","To system","Information (orders / stock / shipments / returns / masters)","Direction and frequency","Current problem","Owner","Confirmed or to validate"]}]},{"h":"How information moves between systems","b":[{"t":"grid","items":[["Mapping","A product, warehouse or customer can have a different ID in each system. These IDs must be mapped correctly or data lands in the wrong place."],["API or file?","Both are used. SFTP file transfer is recommended for reliability and can run several times a day; custom API integrations are available. For planning, SFTP is often enough."],["System of record","Increff is the execution layer. The ERP stays the system of record for finance; Increff can post statuses (e.g. quality-check results) or sales back to the ERP."],["ERP already linked to the website?","Increff integrates separately with the ERP and with the website, through APIs."],["Automation and carriers","Increff connects to warehouse automation systems and to logistics aggregators for carrier connectivity."],["No plug-and-play","Standard APIs exist, but every ERP integration needs its own flows to be built and confirmed."]]}]},{"h":"Trace an order through the systems","b":[{"t":"steps","items":[["Created","An order is created on the website."],["Coordinated","It is sent to an order system (OMS)."],["Allocated","It is allocated to a warehouse or store."],["Executed","The warehouse (WMS) picks and packs it."],["Shipped","It is handed to a carrier."],["Updated","The status returns to the website."]]},{"t":"reveal","q":"What two questions do you ask a prospect after walking through this flow?","a":"“Which system owns each step in your environment?” and “What event changes sellable stock, which system records it, and how does the channel learn about it?”"}]},{"h":"“You integrate with our ERP, right?”","b":[{"t":"grid","items":[["Bad answers","“Yes, everything will work.” “We must replace it.” Or simply noting the ERP name."],["Capture instead","Exact system, version and region; current connector or customisation; required events and reference IDs; expected update speed and what happens if it fails; data access and technical owner; any non-negotiable go-live need."],["Who confirms","Presales confirms the connector scope."]]},{"t":"tip","x":"Say: “I recognise the system name. Let me capture the required flows and have our solutions team confirm the connector scope.”"}]},{"h":"Myth or fact?","sub":"Decide, then reveal.","b":[{"t":"reveal","q":"“OMS and WMS are interchangeable.”","a":"<b>Myth.</b> Coordination across channels and nodes versus execution inside a warehouse."},{"t":"reveal","q":"“A connector covers all workflows.”","a":"<b>Myth.</b> Validate the exact scope."},{"t":"reveal","q":"“A cancellation proves an OMS problem.”","a":"<b>Myth.</b> Trace where the journey failed first."},{"t":"reveal","q":"“Planning software executes every stock transfer.”","a":"<b>Myth.</b> Planning recommends; the transfer is executed operationally (often through the ERP)."},{"t":"reveal","q":"“Stock-outs plus excess means they should buy more.”","a":"<b>Myth.</b> Location, size mix and timing may be wrong."}]}],"quiz":[{"q":"A prospect’s ERP is already connected to Shopify. How does Increff connect?","o":["Only through Shopify","Separately with the ERP and the website, through APIs","It replaces the ERP","It can’t"],"a":1,"w":"Increff integrates separately with each system."},{"q":"“A cancellation proves we have an OMS problem.” True?","o":["True","Myth: trace where the journey failed first"],"a":1,"w":"Cancellations can come from any of the four problem areas."},{"q":"“Pickers can’t find items that the system says are in bin C-04.” Which system’s job is this?","o":["ERP","WMS","POS","Planning platform"],"a":1,"w":"Bin-level location control is warehouse execution: the WMS."},{"q":"“We can’t decide which warehouse should ship an order that has stock in two places.” Which system’s job is this?","o":["OMS","POS","ERP","Carrier"],"a":0,"w":"Choosing the fulfilment node across locations is order coordination: the OMS."},{"q":"A prospect wants Increff to generate GST invoices and reconcile finance. What do you say?","o":["Yes, fully","No. The ERP handles reconciliation, stock transfer notes and GST. Raise it early","Only for marketplaces","Yes, with the WMS"],"a":1,"w":"Increff is a workflow system; finance and tax stay in the ERP."},{"q":"Which system usually stays the system of record for finance?","o":["WMS","OMS","ERP","Carrier platform"],"a":2,"w":"Increff is the execution layer; the ERP remains the system of record for finance."},{"q":"Does a prospect need to install Increff on their own servers?","o":["Yes, on-premise only","No, it runs in a browser on desktop, mobile, tablets and handhelds","Only the WMS needs installation","Yes, plus special hardware from Increff"],"a":1,"w":"No installation. The client supplies printers and handhelds; Increff recommends vendors and trains the team."}]},"B1":{"title":"What Increff is","mins":12,"intro":"The company in one screen, then the details.","cards":[{"h":"Inventory at incredible efficiency","b":[{"t":"p","x":"Increff is an AI-powered SaaS company for <b>planning, fulfilment and inventory optimisation</b>, built for retail and consumer brands. Founded in 2016 and headquartered in <b>Bengaluru</b>."},{"t":"stats","items":[["700+","Brands"],["35+","Countries"],["250+","Employees"],["2016","Founded"]]},{"t":"p","x":"<b>Active regions:</b> India, Middle East & Africa (MEA), South-East Asia (SEA), United States, Australia & New Zealand (ANZ)."}]},{"h":"Two product families","sub":"Covered in depth in Part C.","b":[{"t":"grid","items":[["AI Planning OS","Plans the inventory. Demand forecasting, financial, assortment and inventory planning in one connected, AI-native workflow: what to buy, how much, where to send it, when to top up, move or discount it."],["Omnichannel Fulfilment System","Runs the inventory. Warehouse operations, order orchestration, logistics and store & omnichannel: exposing every piece of stock across channels and getting each order out accurately."]]},{"t":"reveal","q":"Explain Increff in one sentence, without the words “AI”, “platform” or “solution”.","a":"For example: <i>“Increff helps retail brands decide what stock to buy and where to put it, and then get every order out of the right warehouse or store, accurately and on time.”</i>"},{"t":"tip","x":"Start with the part of the customer’s operation causing the problem, not the whole catalogue."}]},{"h":"What Increff is not","b":[{"t":"grid","items":[["Not an ERP, accounting tool or CRM","We sit alongside the ERP and share data with it."],["Not for raw materials or manufacturing","Finished goods only. Raw materials need an MRP tool; offer a partner introduction."],["Not a PO tracking system","Reports can show PO-related data, but that isn’t the product."],["Not installed software","Runs in the browser on any device."]]}]},{"h":"Proven impact","b":[{"t":"p","x":"<b>AI Planning OS</b>"},{"t":"stats","items":[["90%","less planning cycle time"],["25%","better inventory health"],["22%","fewer stock-outs"],["15%","better forecast accuracy"]]},{"t":"p","x":"<b>Omnichannel Fulfilment System</b>"},{"t":"stats","items":[["<10s","inventory sync across channels"],["99.9%","bin-level inventory accuracy"],["99.5%","orders fulfilled within SLA"],["1,300+","webshop, POS, marketplace and ERP integrations"],["100%","inventory exposure (no buffer)"],["25–30%","lower manpower and storage costs"]]},{"t":"tip","x":"These are documented results, not guarantees. A prospect’s result depends on their baseline, data and scope."}]},{"h":"In our customers’ words","b":[{"t":"quotes","items":[["Increff’s recommendations basis true ROS, stores’ capacities, transfer time & cost, etc. have brought positive results by significantly improving ROS. Tool is accurate, saves man-hours and has the potential to impact conversions & markdown positively.","Gaurav Sharma","Director – Merchandising, Adidas India"],["Increff’s dedicated and hands-on support enabled us to initiate the roll-out of their tool to our merchandise team and stores. Increff’s tool has streamlined our processes, allowing us to adhere more closely to the core principles of retail allocation: the right quantity, at the right place, at the right time.","Bouwe Hendriksen","Senior Project Manager, PUMA Retail Europe"],["Increff has been very helpful – the tool brings many things on a platform to help decision making easier. BI dashboard, Open to Buy, Mark down, Replenishment & concept of true ROS helps the retail business to go on with their day to day operations in no time.","Ajit Hawa","Head of Merchandise Planning, Sharaf Retail, UAE"],["Solving complexity at scale, Increff provides Puma with a stable platform that drives inventory efficiency across all channels, successfully bringing down order-to-ship SLAs.","Abhishek Ganguly","Ex-Managing Director, PUMA India"],["Increff team are doing some outstanding work on supply chain tech that cuts across physical and digital. Their platform comprising Order Management System and Warehouse Management System is really very compelling in terms of comprehensiveness as well as elegance.","Prashant Gupta","Ex-President Chairman Office, Aditya Birla Group"],["We worked with Increff to support our expansion. Their record on operating metrics, particularly fulfillment accuracy and SLA adherence, was strong, backed by very friendly, relevant technology solutions. They are a responsive team, with a sound understanding of warehousing needs from a fashion/e-commerce perspective.","Aditi Pany","Ex-COO Reliance, AJIO"],["A great product with unparalleled service makes Increff our go-to OMS/WMS.","Nishant Singh","Head of Operations, Pintola"]]},{"t":"p","x":"Full logo wall and video testimonials: <a href=\"https://overview-increff-deck.lovable.app/\" target=\"_blank\" rel=\"noopener\">Increff Overview deck</a>."}]},{"h":"What prospects ask about us","sub":"Try your answer, then reveal the recommended one.","b":[{"t":"reveal","q":"“What is Increff? What do you do?”","a":"A Bengaluru-based supply chain and retail technology company with two product families: <b>AI Planning OS</b> (forecasting, assortment, replenishment, financial planning) and the <b>Omnichannel Fulfilment System</b> (integrated OMS, WMS and store fulfilment). Core market: fashion, lifestyle and D2C, expanding into FMCG and non-fashion."},{"t":"reveal","q":"“Which brands do you work with?”","a":"Share a <b>relevant</b> customer story rather than a long list, and use only approved references (see the testimonials)."},{"t":"reveal","q":"“Do you work in my category?”","a":"We aren’t category-specific: sarees, luggage, jewellery, pharmacy, watches, home decor and more. If we have no direct experience in their category, say so, then cite the closest similar experience."},{"t":"reveal","q":"“Do you have local support in my country?”","a":"Support runs <b>24/7 from India</b>, with on-site visits where needed. Don’t promise a local team."},{"t":"reveal","q":"“Is it an ERP, accounting tool or CRM?”","a":"No. It is an execution layer alongside the ERP and shares data with ERPs such as Tally, Zoho Books and SAP. No billing, accounting or CRM."},{"t":"reveal","q":"“Does it need installation or special hardware?”","a":"No installation. It runs in a browser on Chrome, mobile, tablets and handhelds. The client supplies printers and handhelds; Increff recommends vendors and trains the team."},{"t":"reveal","q":"“Does Increff run events or partner programmes?”","a":"Yes. Conferences and expos, and partners who refer leads or run their own campaigns. Strict BANT qualification applies to every lead."}]},{"h":"What happens after a first call","b":[{"t":"grid","items":[["No repeating themselves","The team reviews the call recording and summary internally before the next call, so the prospect doesn’t re-explain requirements."],["Demo","A full interface demo takes about an hour, so book it as its own session. On-site demos are possible where travel allows."],["Follow-up","Send the minutes with the relevant decks after the call. Specialist contacts can join later calls."]]}]},{"h":"The do-not-claim list","sub":"Decide Yes, No or Verify, then reveal.","b":[{"t":"reveal","q":"“Do you have an official MCP server?”","a":"<b>No.</b> APIs exist for developers; no official MCP server and no standalone AI or optimisation consulting."},{"t":"reveal","q":"“Can you manage raw materials and work-in-progress?”","a":"<b>No.</b> Finished goods only; refer an MRP partner."},{"t":"reveal","q":"“Do you do billing, accounting or CRM?”","a":"<b>No.</b> Execution layer alongside the ERP."},{"t":"reveal","q":"“Does it work offline?”","a":"<b>No.</b> It’s browser-based and needs connectivity. If offline is non-negotiable, be honest about the mismatch."},{"t":"reveal","q":"“What’s your exact forecast accuracy?”","a":"<b>Verify.</b> It depends on the client and on how much history is available. Case studies have shown 85–90% from month 7 onwards, but don’t promise a figure: offer to assess their data first."},{"t":"reveal","q":"“Is there a pre-built NetSuite integration?”","a":"<b>Verify.</b> Don’t claim it until tech confirms. The same goes for routing orders by tag."},{"t":"reveal","q":"“What does Brand X pay you?”","a":"<b>Never share</b> another client’s price."},{"t":"reveal","q":"“Will you list us on your website as a partner?”","a":"<b>Don’t commit.</b> It needs an owner."}]}],"quiz":[{"q":"A prospect asks: “What’s your exact forecast accuracy?” Best answer?","o":["“95%, guaranteed”","It depends on the client and their history; case studies show 85–90% from month 7, but we’d assess their data first","“We don’t measure it”","Refuse to answer"],"a":1,"w":"Never promise a figure for their business."},{"q":"“Do you have an official MCP server?”","o":["Yes","No: APIs exist, but no official MCP server","Coming next month","Verify"],"a":1,"w":"It’s on the do-not-claim list."},{"q":"“Can we work offline when the internet drops?”","o":["Yes, fully","No: it’s browser-based and needs connectivity; be honest if offline is non-negotiable","Only the WMS","Yes, with special hardware"],"a":1,"w":"Offline mode isn’t supported."},{"q":"A prospect asks: “How big are you?” Which answer is correct?","o":["Founded 2016, 700+ brands, 35+ countries, 250+ employees","Founded 2010, 100 brands, 5 countries","Founded 2016, 70 brands, India only","Founded 2020, 35 brands"],"a":0,"w":"Use the Overview deck figures."},{"q":"Where is Increff headquartered?","o":["Mumbai","Dubai","Bengaluru","Singapore"],"a":2,"w":"Bengaluru, India."},{"q":"Which pair names Increff’s two product families?","o":["Merchandising and CRM","AI Planning OS and Omnichannel Fulfilment System","ERP and WMS","POS and OMS"],"a":1,"w":"Plan the inventory with AI Planning OS; run it with the Omnichannel Fulfilment System."},{"q":"A prospect says: “You got 99.9% accuracy for others, so we’ll get 99.9% too, right?” Best answer?","o":["Yes, guaranteed","It’s a documented result; theirs depends on baseline, data and scope, so we’d assess it","No, that number is made up","Only if they pay more"],"a":1,"w":"Proof points show what’s possible, never a guarantee."},{"q":"Which of these regions is NOT in Increff’s active list?","o":["SEA","ANZ","MEA","Latin America"],"a":3,"w":"Active regions: India, MEA, SEA, US and ANZ."}]},"B2":{"title":"Founders and leadership","mins":5,"intro":"The people who run Increff.","cards":[{"h":"Leadership team","b":[{"t":"people","items":[["Rajul Jain","Co-Founder & CEO"],["Anshuman Agarwal","Co-Founder & COO"],["Vishal Raj","Co-Founder & CTO"],["Kanika Bhalla","Chief Revenue Officer"],["Vaibhav Shukla","VP & Global Head, Merchandising and Planning Solutions"]]},{"t":"p","x":"Increff was founded in 2016 by its three co-founders."}]}],"quiz":[{"q":"Who is Increff’s CEO?","o":["Vishal Raj","Rajul Jain","Anshuman Agarwal","Kanika Bhalla"],"a":1,"w":"Rajul Jain, Co-Founder & CEO."},{"q":"A CIO asks who leads technology at Increff. Who do you name?","o":["Vishal Raj, Co-Founder & CTO","Kanika Bhalla","Vaibhav Shukla","Anshuman Agarwal"],"a":0,"w":"Vishal Raj is the Co-Founder & CTO."},{"q":"Who is Increff’s Chief Revenue Officer?","o":["Rajul Jain","Kanika Bhalla","Anshuman Agarwal","Vishal Raj"],"a":1,"w":"Kanika Bhalla, CRO."},{"q":"A retailer wants to speak to the global head of the planning business. Who leads it?","o":["Vaibhav Shukla","Vishal Raj","Rajul Jain","Anshuman Agarwal"],"a":0,"w":"Vaibhav Shukla, VP & Global Head, Merchandising and Planning Solutions."},{"q":"Who is Increff’s Co-Founder & COO?","o":["Kanika Bhalla","Vaibhav Shukla","Anshuman Agarwal","Vishal Raj"],"a":2,"w":"Anshuman Agarwal."}]},"B3":{"title":"Who does what in a deal","mins":10,"intro":"What you own on a first call, and who to bring in for everything else.","cards":[{"h":"Your job on a first call","b":[{"t":"grid","items":[["Diagnose","Understand the customer’s process and evidence."],["Explain","Connect the relevant capability to that process, in plain language."],["Advance","Recommend a purposeful next conversation, with the customer’s agreement."]]},{"t":"tip","x":"<b>You do not own:</b> custom design, discounts, guaranteed outcomes, roadmap dates, security assurances, or final implementation scope."}]},{"h":"Who to bring in","sub":"Click a topic to see who owns it.","b":[{"t":"tabs","items":[["Pricing & commercials","Sales (the authorised commercial owner).","Never quote prices, discounts or new pricing structures yourself."],["Is this feature live?","Presales confirms current feature status.","Separate live functionality, a demo/mock-up and an approved roadmap item."],["Integration scope","Presales and the technical team confirm connector and flows.","Capture the exact system, version and flows; don’t say “we integrate with everything”."],["Timelines & go-live","The implementation team proposes testing, cutover and milestones.","No fixed go-live or zero-downtime promises."],["Security & legal","Security and Legal review questionnaires, certifications and contracts.","Don’t quote certifications or share sensitive reports casually."],["Roadmap","Product confirms what is approved.","Never give a roadmap date."],["Value case / ROI","Sales and Finance validate it.","Don’t calculate ROI on the call."]],"labels":["Owner","Your rule"]}]},{"h":"From first call to go-live","b":[{"t":"steps","items":[["Source & qualify","S&M (marketing, partnerships, events, inside sales) and partners find and qualify the lead."],["Discovery","A first call establishes the problem, scale, systems, stakeholders and why now."],["Handover to Sales","Sales gets the problem in the customer’s words, an example, scale, impact, systems and owners, stakeholders and what the next call must establish."],["Demo & evaluation","Sales and Presales demonstrate the relevant workflows."],["Proposal & contract","Sales owns commercials; Legal owns contract terms."],["Implementation","The implementation team sets up, integrates, trains and goes live."]]},{"t":"reveal","q":"What does Sales need from you beyond “the customer wants a demo”?","a":"The problem in the customer’s words, a recent example, scale, impact, systems and owners, why now, stakeholders, a working hypothesis, and what the next call must establish."}]}],"quiz":[{"q":"On a first call, the prospect asks for a 15% discount if they sign this month. What do you do?","o":["Agree to 10% as a middle ground","Note it and route it to Sales, the commercial owner","Refuse to discuss","Promise 15%"],"a":1,"w":"Discounts aren’t yours to give. Escalate rather than improvise."},{"q":"A prospect asks if a feature they saw in a demo video is live today. You’re not sure. What do you say?","o":["Yes, it’s live","It’s on the roadmap for next quarter","I’ll confirm the current status with Presales","We can build it for you"],"a":2,"w":"State only confirmed status; never give roadmap dates."},{"q":"Which of these is part of YOUR job on a first call?","o":["Final implementation scope","Diagnosing the customer’s process and evidence","Security assurances","Guaranteed outcomes"],"a":1,"w":"Diagnose, explain, advance."},{"q":"A prospect asks how long go-live will take. Best response?","o":["Two weeks, guaranteed","The implementation team proposes a plan once scope and dependencies are clear","Six months, always","Same day"],"a":1,"w":"Timelines depend on scope; implementation validates them."},{"q":"The prospect’s IT team sends a 200-question security questionnaire. Who owns it?","o":["You, tonight","Security and Legal review it","The prospect","Marketing"],"a":1,"w":"Route it to the right owner; don’t answer security questions yourself."}]},"F1":{"title":"Sales words you’ll hear every day","mins":10,"intro":"Lead, opportunity, nurture, pipeline: what each word means at Increff.","cards":[{"h":"From a name to a deal","b":[{"t":"steps","items":[["Account","A company we might sell to."],["Contact / lead","A person at that company we have reason to talk to. A lead is not yet qualified."],["Meeting booked","A call is in the calendar. On its own, this counts for nothing."],["Meeting held","The call happened, with the right person."],["Opportunity (SQL)","The meeting was held AND it cleared the BANT gate. Only now is it a sales-qualified opportunity."],["Pipeline","All open opportunities, moving through stages towards a contract."]]},{"t":"reveal","q":"A partner says: “We booked 12 meetings for you this month.” How many opportunities is that?","a":"Possibly <b>none</b>. Count only meetings that were <b>held</b> and <b>cleared BANT</b>."}]},{"h":"The words for “not now” and “not ever”","b":[{"t":"grid","items":[["Qualified","Strong across BANT, or a clear path to close the gaps."],["Nurture","Real interest, but a key BANT letter is missing (often Timing or Budget). Keep in touch with a dated follow-up."],["Disqualify","Outside our ideal customer profile, or no fit at all."],["Not qualified yet","Only an interest signal (a brochure taken, a badge scanned). Do discovery first."],["Dormant","An account that went quiet after earlier conversations."]]}]},{"h":"Other words in the sales process","b":[{"t":"flip","items":[["ICP","Ideal customer profile: the type and size of company we sell to best.","Does this company clear the ICP bar before we even run BANT?"],["BANT","Budget, Authority, Need, Timeline: the four checks before a lead becomes an opportunity.","Which letter is weakest?"],["Handoff (LHO)","The lead handover: everything Sales needs before the first Increff call.","Are all mandatory fields filled?"],["Persona","A typical role we talk to, e.g. Head of Merchandising or Warehouse Head.","What does this person care about most?"],["Buying committee","Everyone who influences or signs off a purchase.","Who else needs to be in the next call?"],["RFP","Request for proposal: a formal, written vendor evaluation.","Who wrote it, and have we spoken to anyone?"],["NDA","Non-disclosure agreement, so real data can be shared safely.","Who is the data owner on their side?"],["LOI","Letter of intent: a written intent to buy if agreed criteria are met. Needed before a paid POC.","Who signs it?"],["POC","Proof of concept: a time-boxed test on the prospect’s own data against written success criteria.","What are the 3–5 success criteria?"],["DNC list","Do-not-contact list: accounts we must not reach out to (e.g. existing customers or accounts already owned).","Is this account on DNC before we reach out?"]]}]}],"quiz":[{"q":"An agency booked 10 meetings; 7 were held; 4 of those cleared BANT. How many opportunities?","o":["10","7","4","0"],"a":2,"w":"Only held meetings that clear BANT become opportunities."},{"q":"A CFO loves the idea, but budget opens only next financial year, 7 months away. What status?","o":["Qualified","Nurture, with a dated follow-up","Disqualify","Dormant"],"a":1,"w":"Real interest, but Budget and Timing are delayed: nurture with a date."},{"q":"Someone scanned their badge at our booth and walked off. What is this?","o":["An opportunity","Not qualified yet: do discovery first","Pipeline","An RFP"],"a":1,"w":"An interest signal only."},{"q":"A prospect wants to test Increff on their real sales data. What must be signed before data moves?","o":["An RFP","An NDA","A DNC","Nothing"],"a":1,"w":"An NDA lets real data be shared safely. It is not a signal of buying intent."},{"q":"Before reaching out to an account, what do you check first?","o":["That it is not on the DNC list","The POC criteria","The LOI","The RFP deadline"],"a":0,"w":"Check DNC (do-not-contact) before any outreach."}]},"F2":{"title":"Who we sell to: ICP, routing and buying roles","mins":20,"intro":"Before BANT even starts, a company must clear the ICP bar, and you must route it to the right product.","cards":[{"h":"Route first: four questions","sub":"These tell you which product a lead belongs to.","b":[{"t":"table","head":["Ask","If they say…","It points to"],"rows":[["What are you trying to solve?","Planning and buying the right stock","AI Planning OS"],["","Warehouse or order operations","Omnichannel Fulfilment (WMS / OMS)"],["","ERP or finance-system problems","Not an Increff meeting on its own"],["Where do you sell?","Stores + online / marketplaces","Also OMS and store fulfilment"],["How do goods leave the warehouse?","One piece at a time","WMS, piece-level"],["","Cartons / pallets","WMS, carton/pallet"],["","A 3PL runs it","Don’t book WMS for the brand; look for order or planning pain"],["What industry?","Manufacturing or pure services","Likely not a fit; check with Increff first"]]},{"t":"tip","x":"Name the meeting after the real pain. A meeting booked as a “planning overview” when the pain is marketplace sync wastes everyone’s time."}]},{"h":"The ICP bar","sub":"Exceptions exist where urgency or complexity is high: flag them to Increff before booking.","b":[{"t":"table","head":["Product","Revenue & volume floor","Minimum deal (checks Budget)","Must also be true"],"rows":[["AI Planning OS","≥ ₹100 Cr / US$10M revenue (US: ≥ US$20M)","≥ ₹3L MRR (India) · ~US$3.5k MRR (international)","Minimum 20 stores; mostly retail / store-led, not wholesale; historical sales data available"],["WMS, piece-level","≥ ₹30 Cr / US$5M revenue, plus ≥ 30,000 pieces a month","≥ ₹1.5L MRR (India) · ~US$1–1.5k MRR (international)","D2C / omnichannel brand whose order volume is outgrowing its warehouse process"],["WMS, carton/pallet","≥ ₹30 Cr / US$5M revenue, plus ≥ 5,000 cartons a month","Same as piece-level WMS","Distributor or operator moving cases, cartons and pallets; not a pure manufacturer"],["OMS / store fulfilment","≥ ₹30 Cr / US$5M revenue","Same as WMS","10+ stores selling online and offline"]]},{"t":"grid","items":[["Budget = can they clear the minimum deal?","Below the revenue floor with no funded growth plan: don’t pursue."],["Cloud only","Increff is cloud-only. An on-premise-only requirement is a disqualifier."],["Not an AI Planning OS buyer","A COO / Head of Supply Chain is a WMS / OMS buyer. Don’t accept a COO-only lead against AI Planning OS."]]},{"t":"tip","x":"Seen in partner meetings: a 12-store retailer shipping ~3,000 items a month and a brand launching with 120 SKUs. Both left at the first mention of minimum billing."}]},{"h":"Industry fit","sub":"Which products fit, what to listen for, and who to meet. Click an industry.","b":[{"t":"tabs","items":[["Apparel & fashion","AI Planning OS + WMS (piece-level) + OMS / store fulfilment","Many stores and SKUs, seasonal collections, Excel planning, marketplace overselling","EB: CEO / Founder, Merchandising Director, COO · Champion: Head of Planning, Warehouse Head"],["Footwear & sportswear","AI Planning OS + WMS (piece-level) + OMS / store fulfilment","Size curves and broken sizes, high online returns, stock spread across stores and marketplaces","EB: CEO / Founder, VP Merchandising, Head / VP Supply Chain · Champion: Head of Planning, Head of Operations"],["Jewellery","AI Planning OS + WMS (piece-level)","High value per piece, item-level tracking, stock across many counters or stores","EB: Founder, Business Head, COO · Champion: Head of Planning, Warehouse Head"],["Eyewear","AI Planning OS + WMS (piece-level)","Huge SKU variety (frames × lenses), store replenishment, online + store orders","EB: CEO, Merchandising Director, Head of Operations · Champion: Head of Planning, Head of Fulfilment"],["Beauty & cosmetics","AI Planning OS + WMS (piece-level or carton/pallet)","Batches and expiry, gift sets / kits, many small SKUs across retail and online","EB: Founder / CEO, Head / VP Supply Chain · Champion: Head of Planning, Warehouse Head"],["Home décor & furnishing","AI Planning OS + WMS (piece-level)","Slow-moving items, one product in several boxes (kitting), large store networks","EB: CEO, Merchandising Director, COO · Champion: Head of Planning, Head of Operations"],["Sporting goods & toys","WMS (piece-level); AI Planning OS, qualify carefully","Seasonal peaks, many SKUs, stores plus marketplaces","EB: CEO / Founder, COO · Champion: Head of Operations, Head of Planning"],["Department stores & multi-brand","OMS / store fulfilment; AI Planning OS, qualify carefully","Many brands and categories, Excel allocation, online orders from stores","EB: CEO, Group Strategy Director, Merchandising Director · Champion: Head of Planning"],["Fashion accessories","WMS (piece-level) + OMS","Small, high-SKU items, D2C and marketplace orders","EB: Founder / CEO, COO · Champion: Warehouse Head, Head of Fulfilment"],["Home appliances & electronics","WMS (piece-level or carton/pallet)","Serial numbers, cartons and pallets, dealer / B2B dispatch","EB: COO, Head / VP Supply Chain · Champion: Head of Warehousing, Head of Distribution"],["FMCG (distributor / operator side)","WMS carton/pallet (piece-level for B2C)","Batches, FEFO / expiry, pallets, long cycle counts, distributor orders. Not pure manufacturers","EB: COO, Head / VP Supply Chain, MD · Champion: Head of Warehousing, Head of Distribution"],["Pharma & healthcare distribution","WMS (piece-level or carton/pallet)","Batch and expiry compliance, recalls. Not qualified if B2B-only","EB: COO, Director Operations · Champion: Head of Warehousing · Evaluator: Head of IT"],["Spare parts","WMS carton/pallet","Large SKU counts, cartons, dealer dispatch","EB: COO, Head / VP Supply Chain · Champion: Head of Warehousing"],["Marketplaces","WMS (piece-level), qualify carefully","Own fulfilment operations, high order volumes","EB: COO, Head of Operations · Evaluator: CTO"],["Hypermarkets & supermarkets","WMS for store fulfilment (see the Lulu model, Part D)","Online orders picked from the store floor, express and slotted delivery, batch/expiry, fresh produce","EB: COO, Head of E-commerce / Omnichannel · Champion: Head of Store Operations"]],"labels":["Products that fit","Signals to listen for","Who to meet"]}]},{"h":"Disqualifiers: drop these before booking","b":[{"t":"table","head":["Disqualifier","What it means","You might hear"],"rows":[["Doesn’t sell physical goods","Or a pure intermediary / trader with no warehouse or stores of
